# providers.yaml — ОТКУДА сервер берёт провайдера, модель и параметры вызова.
#
# Смена провайдера или модели не должна быть правкой кода и перезапуском: строка листа
# `RESOURCE_LIMITS` (книга канала, перенесена из конфига в S22) — это и есть живой конфиг.
# Одна строка = провайдер + модель + параметры + лимит + fallback; адаптер читает строку
# целиком и получает всё для вызова (`05 §1`).
#
# Переключить провайдера = `table_update` по этой строке. Своего инструмента для этого нет
# намеренно: дверь уже есть, дублировать её значит заводить второй способ делать одно и то же.

source:
  sheet: RESOURCE_LIMITS
  type_column: resource_type          # чем различаются виды ресурса (tts/stt/image/…)
  provider_column: provider
  fallback_column: fallback_provider  # к кому уходим, когда основной недоступен
  fallback_book: channel_data         # дефолт из декларации, пока книга канала не заполнена

# Что считать исчерпанием. Значения — из тех же строк; отрицательный лимит = без ограничения.
limits:
  limit_column: daily_limit
  usage_column: current_usage
  warning_column: warning_threshold
  unlimited_below: 0                  # daily_limit < 0 → лимита нет

# Служебные столбцы строки: всё ОСТАЛЬНОЕ уходит адаптеру как параметры вызова.
# Так добавление нового параметра модели = новый столбец в книге, а не правка кода.
meta_columns: [resource_type, provider, fallback_provider,
               daily_limit, current_usage, warning_threshold]

# Глубина цепочки fallback: защита от кольца «A → B → A» в данных, которые правит ИИ.
max_fallback_depth: 5
