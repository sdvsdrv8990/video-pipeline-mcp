# providers.yaml — ОТКУДА сервер берёт провайдера, модель и параметры вызова.
#
# Смена провайдера или модели не должна быть правкой кода и перезапуском: строка листа
# `RESOURCE_LIMITS` (книга канала, перенесена из конфига в S22) — это и есть живой конфиг.
# Одна строка = провайдер + модель + параметры + лимит + fallback; адаптер читает строку
# целиком и получает всё для вызова (`05 §1`).
#
# Переключить провайдера = `table_update` по этой строке. Своего инструмента для этого нет
# намеренно: дверь уже есть, дублировать её значит заводить второй способ делать одно и то же.

source:
  sheet: RESOURCE_LIMITS
  type_column: resource_type          # чем различаются виды ресурса (tts/stt/image/…)
  provider_column: provider
  fallback_column: fallback_provider  # к кому уходим, когда основной недоступен
  fallback_book: channel_data         # дефолт из декларации, пока книга канала не заполнена

# Что считать исчерпанием. Значения — из тех же строк; отрицательный лимит = без ограничения.
limits:
  limit_column: daily_limit
  usage_column: current_usage
  warning_column: warning_threshold
  unlimited_below: 0                  # daily_limit < 0 → лимита нет

# Служебные столбцы строки: всё ОСТАЛЬНОЕ уходит адаптеру как параметры вызова.
# Так добавление нового параметра модели = новый столбец в книге, а не правка кода.
meta_columns: [resource_type, provider, fallback_provider,
               daily_limit, current_usage, warning_threshold, usage_unit]

# Глубина цепочки fallback: защита от кольца «A → B → A» в данных, которые правит ИИ.
max_fallback_depth: 5

# ═══ Чем является `input` для вида ресурса ═══
# Озвучка создаёт из текста, картинка — из промпта, а удаление фона и апскейл ПЕРЕРАБАТЫВАЮТ
# готовый файл. Разница объявлена здесь, потому что иначе media_generate различал бы виды
# ресурса ветками в коде, и каждый новый вид добавлял бы туда ещё одну.
# `file` означает: input — путь внутри рабочей области, он проходит containment и должен
# существовать до вызова.
resources:
  default: {input: text}
  by_resource:
    bg_removals: {input: file}
    upscales: {input: file}
    transcriptions: {input: file}

# ═══ Учёт расхода ═══
# Без него лимиты и fallback выше остаются теорией: `current_usage` никто не двигает, и
# «исчерпан» не наступает никогда. Считаем ПОСЛЕ состоявшегося вызова — отказ провайдера
# нашу квоту не тратит.
usage:
  unit_column: usage_unit             # чем меряется расход этой строки; пусто → default_unit
  default_unit: call
  # Единица → КАК её мерить. Способов измерения ровно три и они в коде; какой единицей
  # меряется конкретный провайдер — данные канала (новый провайдер = строка, не правка кода).
  units:
    call: fixed                       # одна операция = 1
    character: input_length           # длина текста запроса — этим меряют озвучку
    image: output_count               # сколько файлов получено

# ═══ Кто исполняет: имя провайдера → адаптер ═══
# Имя провайдера приходит из данных канала, которые правит ИИ. Путь к КОДУ по этому имени
# берётся отсюда, из серверного конфига: иначе строка таблицы импортировала бы произвольный
# модуль — то есть исполняла бы код по данным.
adapters:
  root: core.providers                # импорт разрешён только отсюда (вторая линия защиты)
  # Ключ — имя провайдера, либо «провайдер:вид_ресурса», когда один провайдер исполняет
  # несколько видов ресурса разным кодом. Точное совпадение по паре ищется первым.
  by_provider:
    Local_piper: tts.piper_local:PiperLocalTTS
    Local_whisper: stt.whisper_local:WhisperLocalSTT
    Local_diffusers: img.diffusers_local:DiffusersLocalIMG
    # Фон и апскейл исполняются графом ONNX: у ходовых моделей этих видов архитектуры нет в
    # transformers, и путь через неё требует исполнить `.py` из репозитория модели.
    Local_onnx_bg: img.onnx_bg:OnnxBGRemoval
    Local_onnx_upscale: img.onnx_upscale:OnnxUpscale
    # Те же локальные модели, но поднятые в ОТДЕЛЬНОМ процессе (раннере). Своего адаптера у него
    # нет намеренно: раннер говорит на том же контракте «файл → файл», что платные провайдеры, —
    # значит исполняет его тот же `http_image`, а отличия объявлены ниже в online.http.
    # Ключ раннера не из книги канала: его выдаёт сервер при запуске (`key_source: runner`), и
    # `requires_key` здесь не ставится — иначе вызов требовал бы ключа, которого владелец не вносил.
    Local_runner: {adapter: img.http_image:HttpImageAPI, key_source: runner}
    # Облачные: ключ ОБЯЗАТЕЛЕН, и объявляется это здесь, а не в данных канала — строку канала
    # правит ИИ, и «ключ не нужен» не должно быть его решением. Адаптера нет намеренно: строка без
    # `adapter` даёт PROVIDER_ADAPTER_MISSING с перечнем того, чем исполнить можно.
    ElevenLabs: {requires_key: true}
    OpenAI: {requires_key: true}
    Fal: {requires_key: true}
    # Платные «файл → файл»: адаптер один на всех, чем они отличаются — ниже, в online.http.
    RemoveBg: {adapter: img.http_image:HttpImageAPI, requires_key: true}
    Bria: {adapter: img.http_image:HttpImageAPI, requires_key: true}
    Replicate: {adapter: img.http_image:HttpImageAPI, requires_key: true}
    # У `Fal` два ремесла: картинку он рисует (стаб выше), а фон и апскейл исполняет очередью.
    # Пара «провайдер:вид ресурса» точнее одного имени и ищется первой — для этого она и есть.
    Fal:bg_removals: {adapter: img.http_image:HttpImageAPI, requires_key: true}
    Fal:upscales: {adapter: img.http_image:HttpImageAPI, requires_key: true}

# ═══ ЧТО МОДЕЛЬ УМЕЕТ (спецификация параметров) ═══
# Строку канала заполняет ИИ, а какие параметры модель принимает и в каких пределах — знает
# только сама модель: `birefnet` умеет 1024 и 2048 и НЕ умеет 4К, у sd-turbo нативные 512.
# Без этого ИИ пишет параметры вслепую, а узнаёт о невозможном из платного отказа — или, хуже,
# получает не то, что просил, без единой жалобы.
#
# Формат спеки — JSON Schema: он уже язык этого сервера (`input_schema` инструментов), и проверяет
# его установленная библиотека, а не наш код. Источники по убыванию достоверности: сам провайдер →
# наш справочник → файлы модели на диске. Что нашлось, помечается в ответе — «не знаем» не выдаётся
# за «ограничений нет».
capabilities:
  cache_dir: specs              # относительно models_dir: спрошенное однажды не спрашивается снова
  ttl_hours: 168                # неделя: набор параметров модели меняется редко, но не никогда
  # Где спросить САМ провайдер. `{model}` — из строки канала.
  online:
    Fal:
      # fal отдаёт OpenAPI своей очереди БЕЗ ключа — спека доступна до всякой оплаты.
      url: "https://fal.ai/api/openapi/queue/openapi.json?endpoint_id={model}"
      auth: none
      schema_path: "components.schemas.{Input}"   # {Input} — первая схема, чьё имя кончается на Input
    Replicate:
      # А этот требует токен даже на чтение модели (проверено: без него 401), поэтому спека
      # спрашивается его же ключом; нет ключа — работает справочник ниже.
      url: "https://api.replicate.com/v1/models/{model_path}"
      auth: bearer
      schema_path: "latest_version.openapi_schema.components.schemas.Input"

# ═══ Онлайн-модели: спросить самого провайдера ═══
# Реестр шлюза знает то, что знал на день своей сборки, — новая модель появляется у провайдера
# раньше. Поэтому при наличии ключа список берётся у ПЕРВОИСТОЧНИКА, а реестр остаётся тем, что
# добавляет к именам смысл: режим вызова, эндпоинт, цену. Ключ уходит только на объявленный здесь
# адрес и только по https; в ответ клиенту он не возвращается никогда.
online:
  live:
    OpenAI:
      url: https://api.openai.com/v1/models
      auth: bearer                  # Authorization: Bearer <ключ>
      items: data                   # где в ответе лежит список
      id_field: id
    ElevenLabs:
      url: https://api.elevenlabs.io/v1/models
      auth: header:xi-api-key       # свой заголовок вместо Authorization
      items: ""                     # ответ — сам массив
      id_field: model_id
  # ═══ Платные провайдеры «файл → файл» ═══
  # У удаления фона и апскейла режима в реестре LiteLLM нет вовсе — это обычный HTTP-вызов с
  # приложенным файлом. Поэтому здесь объявлено ВСЁ, что нужно для вызова: адрес, как провайдер
  # принимает ключ, каким полем уходит файл, что считать ответом. Новый платный провайдер —
  # блок здесь, а не новый Python; исполняет их всех один адаптер (`Online_http`).
  #
  # `send` — карта «поле запроса → столбец строки канала»: чего в строке нет, то не отправляется.
  # Так параметр провайдера добавляется столбцом в книге, как и у локальных моделей.
  # Ключ уходит только на объявленный адрес и только по https, в ответ клиенту не возвращается.
  http:
    RemoveBg:
      url: https://api.remove.bg/v1.0/removebg
      auth: header:X-Api-Key
      file_field: image_file
      response: binary              # файл приходит телом ответа
      send: {size: img_size, format: response_format}
      kinds: [bg_removals]
    Bria:
      url: https://engine.prod.bria-api.com/v1/background/remove
      auth: header:api_token
      file_field: file
      response: json                # в ответе ссылка; она скачивается правилами media_tasks.yaml
      send: {}
      kinds: [bg_removals]
    # ═══ Агрегаторы: один ключ — сотни моделей ═══
    # Прямой API дешевле, но знает одну модель. Агрегатор берёт наценку и даёт выбор: bria,
    # birefnet, rembg, real-esrgan, clarity-upscaler — сменой столбца `model` строки канала.
    # Оба отвечают ЗАДАЧЕЙ, а не файлом: адрес статуса они сообщают сами, дальше работает общий
    # цикл ожидания (`config/media_tasks.yaml`) — тот же, что у любого асинхронного провайдера.
    # Коды повтора — те же, на которых повторяют их собственные официальные клиенты.
    Replicate:
      url: https://api.replicate.com/v1/predictions
      auth: bearer
      send_mode: json_base64
      max_inline_mb: 10
      file_field: input.image       # у него параметры вызова вложены в `input`
      send: {version: model, input.scale: scale}
      response: task
      task_field: id
      status_url_field: urls.get    # адрес прозвонки приходит в ответе, а не строится нами
      result_path: output[0]
      retry_on: [429, 503, 504]
      kinds: [bg_removals, upscales]
    Fal:
      # Имя модели из строки канала подставляется в адрес; после подстановки он проверяется
      # заново — хост обязан остаться объявленным (строку канала правит ИИ).
      url: https://queue.fal.run/{model}
      auth: header:Authorization
      auth_prefix: "Key "
      send_mode: json_base64
      max_inline_mb: 10
      file_field: image_url
      send: {}
      response: task
      task_field: request_id
      status_url_field: status_url
      result_url_field: response_url  # у очереди результат лежит отдельным адресом от статуса
      result_path: image.url
      retry_on: [429, 503, 504]
      kinds: [bg_removals, upscales]

    # ═══ Раннер локальных моделей (S24) ═══
    # Он объявлен ЗДЕСЬ, среди «онлайновых», хотя никуда не выходит: `online.http` — это не «в
    # интернете», а форма вызова «HTTP, файл → файл». Раннер её и говорит, поэтому исполняется тем
    # же адаптером, а переключение «в процессе → в раннере» остаётся правкой строки канала.
    #
    # Два отличия от платных, и оба объявлены данными, а не сняты проверкой:
    # `allow_insecure_host` — https обязателен во внешней сети, но требовать его от петли значит
    # запрещать саму идею раннера; послабление действует ТОЛЬКО для этого хоста и только по http.
    # `send_mode: paths` — обмениваемся путями, а не байтами: раннер видит тот же workspace, и
    # гонять 4К-кадр в base64 на каждый вызов — десятки мегабайт на ровном месте.
    Local_runner:
      # Порт объявлен ровно здесь: супервизор берёт его отсюда же, второй копии числа нет.
      url: http://127.0.0.1:8770/run
      allow_insecure_host: 127.0.0.1
      auth: header:X-Runner-Token
      send_mode: paths
      response: files             # раннер пишет файл сам и возвращает путь, а не тело и не ссылку
      send: {}                    # вся строка канала уходит в params одним куском (см. paths)
      # Раннер не поднялся или упал — это НЕ «провайдер недоступен, повтори позже»: его поднимают
      # командой. Код отказа объявлен здесь, чтобы подсказка вела к инструменту, а не в никуда.
      # Локальный расчёт идёт минутами, а не секундами: общего предела в 120 с ему мало, и
      # упёршись в него, вызов соврал бы «раннер не отвечает» про раннер, который занят делом.
      timeout_sec: 900
      on_unreachable: RUNNER_NOT_RUNNING
      # Раннер называет причину отказа НАШИМ кодом реестра — он же наш процесс. Без этого его
      # «нет весов» приехало бы к ИИ общим PROVIDER_FAILED с JSON в тексте, без подсказки.
      error_fields: {code: code, message: message, reason: reason}
      kinds: [bg_removals, upscales, tts_characters, image_generations]

  # Чем отличить картиночную модель от прочих в СЫРОМ списке провайдера: он отдаёт всё подряд.
  # Правило — по имени, потому что режима вызова в его ответе нет. Новая линейка = строка здесь.
  kinds:
    image: ["gpt-image", "dall-e", "imagen", "flux", "stable-diffusion"]
    tts: ["tts", "speech", "eleven_"]
    stt: ["whisper", "transcribe", "scribe"]

# ═══ Локальные модели ═══
# Веса — зависимость, а не исходник: каталог в .gitignore, наполняется
# `scripts/models.py pull`. Нет весов → честный LOCAL_MODEL_MISSING, а не молчаливый успех.
local:
  models_dir: vendor/models

  # ═══ ТРАНСКРИБАЦИЯ ═══
  # Рычаги вызова объявлены здесь, а не ветками в адаптере. Форматы результата НЕ дублируются
  # сюда: их сериализаторы живут в коде (`WRITERS`), а совпадение с write_allowlist держит тест.
  stt:
    # Параметры ПОДЪЁМА пайплайна. Окно 30 с — родное окно whisper: длиннее модель не слышит,
    # длинная запись режется на куски именно им.
    pipeline:
      chunk_length_s: 30
    # Параметры ВЫЗОВА. Границы слов — то, ради чего локальное распознавание вообще берётся:
    # по ним считаются паузы и раскладка сцен.
    call:
      return_timestamps: word
    # Столбец строки провайдера → параметр генерации. Пустой столбец не передаётся вовсе,
    # и работает дефолт модели.
    generate_from_row:
      language: language              # пусто → модель определяет язык сама
      task: task                      # transcribe | translate

  # ОТКУДА БЕРЁТСЯ СПИСОК доступных моделей. Каталоги живые (сеть), а не снимок документации:
  # список моделей меняется чаще, чем что-либо в этом файле. Здесь объявлено, где смотреть и
  # что считать лишним, — отсев данными, а не правкой скрипта.
  sources:
    tts:
      kind: piper_index                # индекс голосов piper: язык, качество, размеры, хэши
      repo: rhasspy/piper-voices
      index: voices.json
      filters:
        language: ru_RU               # пусто → все языки
        max_mb: 300
    image:
      kind: hf_hub                     # каталог Hugging Face по задаче и библиотеке
      pipeline_tag: text-to-image
      library: diffusers
      filters:
        max_mb: 8000                  # веса больше этого на CPU бессмысленны
        min_downloads: 50000          # отсев заброшенного и экспериментального
        gated: false                  # закрытые требуют токена — ставить нечем

    # Удаление фона и апскейл отбираются НЕ по pipeline_tag: он у них общий с чужими задачами
    # (сегментация одежды, img2img-диффузия). Отбор идёт по тегу задачи + тегу формата, потому
    # что формат здесь решающий: у популярных моделей этих двух видов (RMBG-2.0, BiRefNet)
    # архитектуры нет в transformers, и путь через неё требует исполнить скачанный `.py`
    # (`trust_remote_code`). ONNX даёт ту же модель без исполнения чужого кода — а `.onnx` уже
    # разрешён install.allow_suffixes. Отсюда `require_formats`: модель без .onnx не показываем
    # вовсе, иначе список предлагал бы то, что установщик обязан отклонить.
    bg_removal:
      kind: hf_hub
      tags: [background-removal, onnx]
      dest: bg
      require_formats: [".onnx"]
      filters:
        max_mb: 1000
        min_mb: 5                     # мельче — не модель, а посторонний файл в том же репозитории
        min_downloads: 3000           # ниже — единичные экспорты без сопровождения
        gated: false                  # RMBG-2.0 закрыт (gated) — ставить нечем, и это честно
    upscale:
      kind: hf_hub
      tags: [image-to-image, onnx]
      dest: upscale
      require_formats: [".onnx"]
      filters:
        max_mb: 1000
        min_mb: 5                     # отсекает чужие .onnx в репозиториях LoRA (детектор лиц ~0.1 МБ)
        min_downloads: 300            # апскейлеров в ONNX мало: тот же порог оставил бы пусто
        gated: false

    # Распознавание речи. `require_formats` здесь — не придирчивость к качеству, а граница
    # безопасности: у vanilla-whisper веса лежат в `.pt`, это pickle, и его загрузка исполняет
    # код из файла — install.deny_suffixes такие форматы отклоняет. Репозитории с safetensors
    # (путь transformers) дают ту же модель без исполнения чужого кода, поэтому модель без
    # safetensors не показываем вовсе: список не должен предлагать то, что установщик обязан
    # отклонить.
    stt:
      kind: hf_hub
      pipeline_tag: automatic-speech-recognition
      library: transformers
      dest: stt
      require_formats: [".safetensors"]
      filters:
        max_mb: 4000                  # large-v3 в fp32 — около трёх гигабайт
        min_mb: 20                    # мельче — не модель, а посторонний файл в репозитории
        min_downloads: 10000
        gated: false

  # ПОДНЯТАЯ МОДЕЛЬ МЕЖДУ ВЫЗОВАМИ. Замер S24 (sd-turbo): 10.9 с на холодную, 1.4 с при тёплом
  # кэше ядра, 0.2 с — если модель уже поднята. Страницы весов кэширует само ядро, а вот разбор в
  # структуры и перенос на карту повторяются каждый раз — их и снимает пул.
  pool:
    enabled: true
    # Доля СВОБОДНОЙ памяти устройства, которую пулу разрешено занять. Не «всей»: сервер живёт
    # рядом с чужими процессами, и забрать всё значит поменять один тормоз на другой.
    budget_ratio: 0.5
    # Сколько модель ждёт следующего вызова, прежде чем её выгрузят. Карта дороже прогрева:
    # вернуть гигабайты выгоднее, чем сэкономить секунду. Выгрузка происходит ПРИ СЛЕДУЮЩЕМ
    # обращении, а не по таймеру: демона на сервере нет (решение владельца S15).
    idle_ttl_sec: 900
    max_entries: 4              # верхний предел на случай, если размеры оценены слишком мелко

  # ═══ ОТДЕЛЬНЫЙ ПРОЦЕСС ПОД ИНФЕРЕНС (раннер, S24) ═══
  # Инференс в процессе сервера роняет сервер вместе с собой: OOM или падение в графе рвут туннель
  # к Claude. Раннер выносит расчёт наружу — падает он, а сервер отвечает дальше.
  #
  # ЭТО НЕ ДЕМОН (решение владельца S15 в силе). Раннер не тикает, ничего не подхватывает в фоне и
  # не планирует задачи: он поднимается ЯВНОЙ командой (media_runner) и отвечает на запросы. Сервер
  # не поднимает его сам ни при первом вызове, ни при старте — иначе это и был бы демон.
  runner:
    # Под каким именем раннер объявлен провайдером. Отсюда и супервизор, и сам раннер берут адрес,
    # порт и имя заголовка с токеном — все три живут в ОДНОМ месте (online.http.<это имя>).
    provider: Local_runner
    # Кого раннер поднимает под вид ресурса. Строка канала называет `Local_runner` (ГДЕ считать), а
    # ЧЕМ считать — знает сервер: спрашивать это у ИИ значило бы требовать столбец, который он
    # всё равно заполнил бы отсюда. Модель по-прежнему выбирается столбцом `model` строки.
    by_resource:
      bg_removals: Local_onnx_bg
      upscales: Local_onnx_upscale
      tts_characters: Local_piper
      image_generations: Local_diffusers
      transcriptions: Local_whisper
    # Состояние жизненного цикла — на диске, как у установок моделей: сервер перезапустили, а
    # поднятый раннер остался, и «не знаю про него» было бы враньём. Пути от корня проекта, вне
    # workspace: это состояние СЕРВЕРА, а не данные канала.
    state_file: vendor/runner/state.json
    log_file: vendor/runner/runner.log     # причина падения обязана пережить сам процесс
    ready_timeout_sec: 60       # подъём процесса + импорт torch — это секунды, а не миллисекунды
    poll_sec: 0.3               # как часто спрашивать /health, пока раннер встаёт
    stop_grace_sec: 5           # сколько ждать после terminate, прежде чем kill
    # Запуск в контейнере (R6): изоляция зависимостей ценой размера образа. Колёса ROCm — гигабайты,
    # поэтому режим объявлен, но по умолчанию не выбран.
    docker:
      image: video-pipeline-runner
      container: video-pipeline-runner
      # Карта пробрасывается устройствами ядра: системный ROCm внутрь не ставится, он не нужен.
      # Группа доступа не перечисляется именами намеренно — она берётся у самих устройств числом:
      # в образе группы `render` нет вовсе, а карту держит именно она.
      devices: ["/dev/kfd", "/dev/dri"]
      # Веса и рабочая область — ТОМАМИ, а не слоями образа: класть гигабайты в образ значит
      # пересобирать их при каждой правке кода. Слева путь на хосте (от корня проекта), справа — в
      # контейнере; внутри раннер видит их по тем же относительным путям, что и сервер.
      # Значение справа уходит в `-v` как есть, поэтому `:ro` — обычный синтаксис docker, а не наш
      # механизм. Декларации монтируются ЖИВЫЕ и только для чтения: запечённые в образ, они
      # разошлись бы с серверными, и «поменял строку в конфиге» перестало бы работать до пересборки.
      # Секреты (`config/tunnel.yaml`, ключи каналов) сюда не попадают — раннеру они не нужны.
      mounts:
        workspace: /app/workspace
        vendor/models: /app/vendor/models
        config/providers.yaml: /app/config/providers.yaml:ro
        config/firewall.yaml: /app/config/firewall.yaml:ro

  # ЧЕМ СЧИТАТЬ ГРАФ ONNX (фон, апскейл). Сама предобработка — нормализация, масштаб, размер
  # входа — берётся из `preprocessor_config.json`, который автор кладёт рядом с графом: у каждой
  # модели она своя, и место ей в файле модели, а не в нашем коде.
  onnx:
    # Исполнители onnxruntime по порядку. Azure не назван намеренно: этот исполнитель отправляет
    # картинку на сторону, и «локальная модель» перестала бы быть локальной.
    providers: [CPUExecutionProvider]
    # Стороны входа округляются вверх до кратности: свёрточная пирамида этих сетей на
    # произвольном размере падает прямо в графе.
    align: 32

  # ЧЕМ МОДЕЛЬ ОТЛИЧАЕТСЯ ОТ СОСЕДНЕЙ. Числа (размер, параметры, загрузки) не отвечают на вопрос
  # «что она вообще делает» — выбор по ним получается вслепую. Описание берётся из карточки
  # модели, а не пишется здесь: карточку правит автор модели, а список моделей живой.
  describe:
    from: README.md
    max_chars: 240
    # У ONNX-порта собственная карточка вырождена — «…with ONNX weights to be compatible with
    # Transformers.js» вместо смысла (проверено на Xenova/swin2SR и onnx-community/BiRefNet).
    # Совпал признак — описание берётся у БАЗОВОЙ модели карточки, там оно настоящее.
    port_markers: ["transformers.js", "onnx weights", "with onnx"]
    workers: 8                  # карточки тянутся параллельно: по секунде на модель × 20 = минуты

  # КУДА КЛАДЁТ ЗАГРУЗЧИК. Своим кэшем он ходит в домашний каталог пользователя, и веса лежат
  # дважды: копия в кэше и копия здесь. Каталог зависимостей проекта — один, и кэш живёт внутри
  # него: тогда «сколько весит проект» — один ответ, а перенос машины забирает всё разом.
  cache_dir: .cache             # относительно models_dir — каталог весов остаётся один корень

  # ЧТО РАЗРЕШЕНО КЛАСТЬ НА ДИСК. Веса — исполняемое содержимое: формат `.bin/.ckpt/.pt` это
  # pickle, а его загрузка выполняет произвольный код. Поэтому ставим только форматы, которые
  # кодом не являются; остальное — отказ, даже если модель популярная.
  install:
    # Источники — ХОСТЫ, а не отдельные репозитории: имя модели на HF имеет вид org/name,
    # и перечислять их поимённо значит не ограничивать ничего. Ссылка на чужой сайт — отказ.
    allow_sources: [huggingface.co]
    allow_suffixes: [".safetensors", ".onnx", ".json", ".txt", ".model"]
    deny_suffixes: [".bin", ".ckpt", ".pt", ".pth", ".pkl", ".h5"]
    max_total_mb: 8000
    # Каким протоколом тянуть веса. `xet` — поведение клиента HF по умолчанию; на этой сети он
    # давал 0.08–3 МБ/с и вставал на середине, обычный `https` — 9.5 МБ/с на том же файле (замер
    # S23, тот же канал: curl оттуда же — 5 МБ/с). Медленно ≠ сломано, но 5 ГБ так не приезжают.
    transfer: https             # https | xet
    # В ONNX-репозитории рядом лежит ОДИН И ТОТ ЖЕ граф в нескольких разрядностях
    # (model.onnx, model_fp16.onnx, model_q4.onnx). Тянуть все — платить диском за копии одного
    # и того же, поэтому берётся первое совпавшее по этому порядку. Полная разрядность впереди
    # намеренно: считает это onnxruntime на процессоре, а там fp16 не ускоряет, а замедляет —
    # каждый слой разворачивается в fp32 на лету.
    prefer_files: ["onnx/model.onnx", "*_fp16.onnx", "*.onnx"]
    # Установка идёт минутами и рвётся на середине, поэтому за ней наблюдают. Прогресс меряется
    # ПО ДИСКУ: загрузчик может отчитаться и оборваться, а выросшие байты не врут.
    progress:
      heartbeat_sec: 2          # как часто пересчитывать, сколько байт уже легло
      stale_after_sec: 120      # байты не растут дольше этого → «прервано», а не вечное «идёт»
  # ВЛЕЗЕТ ЛИ МОДЕЛЬ. Число параметров без объёма памяти ничего не значит, поэтому сервер
  # считает потребность сам: параметры × разрядность + запас на активации. Пороги здесь, а не в
  # коде: на другой машине «впритык» начинается в другом месте.
  fit:
    dtype_bytes: {F32: 4, F16: 2, BF16: 2, I64: 8, I32: 4, I8: 1, U8: 1, BOOL: 1}
    default_dtype_bytes: 4      # разрядность не названа → считаем по худшему
    # Имя разрядности у torch ↔ имя в метаданных весов. Веса на диске могут лежать в fp32, а
    # подниматься в fp16 (так на карте) — вердикт обязан считать по тому, КАК поднимут.
    dtype_alias: {float16: F16, bfloat16: BF16, float32: F32}
    # Активации и кэш поверх самих весов. 1.8 — не круглое число «на глаз», а замер S23:
    # sdxl-turbo (2.57B, fp16, 512×512, 1 шаг) занял на карте 9276 МБ при 5135 МБ чистых весов.
    # Прежние 1.35 давали прогноз 6932 МБ — заниженный на треть. ⚠️ Размер кадра в оценку не
    # входит: на 1024×1024 активаций больше, и запас снова окажется мал.
    overhead: 1.8
    tight_ratio: 0.8            # выше этой доли доступной памяти — «впритык», а не «влезет»
  # ЧЕМ СЧИТАТЬ. Локальные модели крутят на видеокарте, а не на процессоре, поэтому её память —
  # отдельное число рядом с ОЗУ. Карта и её объём читаются из /sys/class/drm БЕЗ root; здесь
  # объявлено лишь, чем её память становится доступна расчёту.
  gpu:
    package: torch              # чей билд решает доступность: `2.13.0+cu130` → тег `cu`
    # Тега в версии может не быть — тогда смотрим переменную сборки в `<пакет>/version.py`.
    build_vars: {cu: cuda, rocm: hip}
    # Драйвер ядра → нужный тег сборки. Тег не совпал (сборка под CUDA на карте AMD) — память
    # карты в вердикт НЕ идёт, и рядом сказано, какой сборкой это чинится.
    # `torch_device` — как устройство зовётся в самом torch. У ROCm-сборки оно то же `cuda`:
    # отдельного имени в torch нет, различает только сборка. Пусто = считать на этом нечем.
    drivers:
      amdgpu: {runtime: ROCm, torch_tag: rocm, torch_device: cuda}
      nvidia: {runtime: CUDA, torch_tag: cu, torch_device: cuda}
      i915:   {runtime: "", torch_tag: "", torch_device: ""}   # встроенная Intel: делит ОЗУ
      xe:     {runtime: "", torch_tag: "", torch_device: ""}
    # Разрядность по месту расчёта: на карте fp16 вдвое дешевле по памяти и быстрее, на
    # процессоре половинная точность местами не поддержана вовсе — там fp32.
    dtype: {gpu: float16, cpu: float32}
    # Что уезжает в ЗАГРУЗЧИК модели (а не в вызов): слева столбец строки, справа параметр
    # библиотеки. Новый рычаг diffusers = строка ЗДЕСЬ, а не ветка в коде. Чего в строке нет — не
    # передаётся; `variant` при этом известен из описи, и строка нужна лишь чтобы его перекрыть.
    load_from_row: {variant: variant, device_map: device_map, max_memory: max_memory}
    # Модель больше выбранного устройства — не приговор: библиотека умеет держать на карте по
    # одной части, остальное в ОЗУ. Медленнее, но работает. `error` = отказаться вслух.
    oversize: model_offload     # error | model_offload | sequential_offload

# ═══ Куда лёг результат ═══
# Имя ассета — шаблон, а не ветка в коде: новый вид ресурса = строка здесь. Расширение берётся
# из строки провайдера (`response_format`), потому что его знает провайдер, а не мы.
assets:
  # `ext` — запасное расширение, когда строка провайдера про формат молчит (у картинок столбца
  # response_format нет вовсе). Файл без расширения не пропустит write_allowlist, и правильно.
  default: {dir: assets, name: "{video_slug}_{resource_type}_{scene_id}", ext: bin}
  by_resource:
    tts_characters: {dir: assets/audio, name: "{video_slug}_tts_{scene_id}", ext: wav}
    image_generations: {dir: assets/img, name: "{video_slug}_img_{scene_id}", ext: png}
    # Переработка готового файла: имя строится от ИСХОДНИКА, иначе два фона от разных картинок
    # одной сцены легли бы в один файл и второй затёр бы первый.
    bg_removals: {dir: assets/img, name: "{source_stem}_nobg", ext: png}
    upscales: {dir: assets/img, name: "{source_stem}_upscaled", ext: png}
    # Имя от ИСХОДНИКА по той же причине, что у фона: две записи одной сцены иначе легли бы
    # в один файл. `json` — единственный богатый формат, разрешённый write_allowlist.
    transcriptions: {dir: assets/text, name: "{source_stem}_transcript", ext: json}
