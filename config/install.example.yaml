# install.example.yaml — ШАБЛОН режима установки. install.sh пишет по нему config/install.yaml.
# Секретов здесь НЕ бывает: данные сервера, домен, ключи REALITY живут в config/deploy.local.yaml
# (в .gitignore — секреты не коммитим). Этот файл трекается, реальный config/install.yaml — нет.
#
# Ручки объявляются ПО МЕРЕ появления читателя — ключ без читателя ничего не меняет, это украшение.
# Дальше сюда лягут local_port (шаг run.sh), models_mode и transport — каждая со своим читателем.

# Роль машины — определяет, что поднимает ./run.sh без флагов.
#   local  — сервер MCP + клиентский конец туннеля (рабочая машина)
#   server — только серверный конец туннеля (VPS вне РФ)
#   both   — и то, и другое на одной машине
role: local
