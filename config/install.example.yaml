# install.example.yaml — ШАБЛОН объявления установки. install.sh пишет по нему config/install.yaml.
# Секретов здесь НЕ бывает: данные сервера, домен, ключи REALITY живут в config/deploy.local.yaml
# (в .gitignore — секреты не коммитим). Этот файл трекается, реальный config/install.yaml — нет.
#
# Ручки объявляются ПО МЕРЕ появления читателя — ключ без читателя ничего не меняет, это украшение.
# Читатель этих двух — core/deploy (install/mcp/tunnel_end), потребитель — run.sh.
#
# Объявляются ДВА независимых факта, потому что одной ролью они не выражаются: «сервер MCP +
# серверный конец туннеля» в прежнем словаре local|server|both эквивалента не имел.
# Старый ключ `role:` из прежних установок читается как совместимость и переводится в эту пару.

# Стоит ли на этой машине сервер MCP.
mcp: true

# Какой конец туннеля здесь работает:
#   client — клиентский (маскирует и шифрует, идёт к серверному концу)
#   server — серверный (расшифровывает, отдаёт наружу чистый трафик)
#   both   — оба на одной машине; пользователю такой строки не показывают, это техническое значение
#   none   — туннеля на этой машине нет
tunnel: client
