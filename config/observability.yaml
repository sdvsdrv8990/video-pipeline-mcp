# След вызовов сервера. Из него воспроизводитель собирает сценарий на отказ, условия которого
# иначе взять негде: живая сессия ничего после себя не оставляла.
#
# Формат записи СОВПАДАЕТ с журналом харнесса (tests/.journal/*.jsonl) намеренно — тогда
# синтезатор сценариев читает оба источника одним кодом, а не двумя. Форма ОБЪЯВЛЕНА в
# `core/contracts/trail_record.py`: писателя сервера судит по ней mypy, харнесс и читателя —
# ось `поле записи мимо объявления`. До объявления это держалось прозой, и переименование поля
# проходило гейт целиком.
#
# Корень журналов один — у следа и у журнала фактов: каталог журналов пользователя этой ОС (platformdirs) для имени
# ниже; переменная среды MCP_LOGS переопределяет его, как MCP_WORKSPACE — рабочую область (тестовый сервер пишет в свой
# каталог). Не каталог кода и не рабочая область: журнал фактов не попадает под инструменты fs_* клиента.
logs:
  app: "video_pipeline_mcp"
  # Журнал фактов (что сервер сделал по вызовам) — для владельца: файл с ротацией по размеру. Ноль в max_bytes или
  # backup_count — не «без предела», а «ротации нет», поэтому ноль — отказ объявления.
  session:
    file: "session.md"
    max_bytes: 10485760
    backup_count: 5

trail:
  # По умолчанию включён: выключенный след не пишется ровно тогда, когда он нужен, —
  # отказ уже случился, а условий нет.
  enabled: true
  # Относительно корня журналов (logs выше).
  dir: "trail"
  # Аргументы вызова проходят через санитизатор перед записью. false — писать только форму
  # (инструмент, код, порядок): сценарий тогда придётся дополнять руками.
  record_args: true
  # Удержание: файл на прогон сервера, старые сверх этого числа удаляются.
  keep_files: 20
  # Предел на файл прогона; после него запись прекращается, а не растёт бесконечно.
  max_bytes: 5242880

# Соединения, которые держат открытыми. Счётчика запросов на соединении библиотека не даёт, поэтому
# наблюдается ЧИСЛО удерживаемых — именно так выглядят скан портов и медленное исчерпание.
socket:
  enabled: true
  # Как часто смотреть. Реже — дешевле, но короткая волна проскочит между замерами.
  period_sec: 1.0
  # Со скольких удерживаемых соединений это перестаёт быть обычной работой клиента.
  held_threshold: 8
