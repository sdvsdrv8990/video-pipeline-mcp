# След вызовов сервера. Из него воспроизводитель собирает сценарий на отказ, условия которого
# иначе взять негде: живая сессия ничего после себя не оставляла.
#
# Формат записи СОВПАДАЕТ с журналом харнесса (tests/.journal/*.jsonl) намеренно — тогда
# синтезатор сценариев читает оба источника одним кодом, а не двумя.
trail:
  # По умолчанию включён: выключенный след не пишется ровно тогда, когда он нужен, —
  # отказ уже случился, а условий нет.
  enabled: true
  # Относительно КОРНЯ проекта, не workspace: это лог сервера, а не данные владельца
  # (то же правило, что у _SESSION_LOG.md).
  dir: "logs/trail"
  # Аргументы вызова проходят через санитизатор перед записью. false — писать только форму
  # (инструмент, код, порядок): сценарий тогда придётся дополнять руками.
  record_args: true
  # Удержание: файл на прогон сервера, старые сверх этого числа удаляются.
  keep_files: 20
  # Предел на файл прогона; после него запись прекращается, а не растёт бесконечно.
  max_bytes: 5242880

# Соединения, которые держат открытыми. Счётчика запросов на соединении библиотека не даёт, поэтому
# наблюдается ЧИСЛО удерживаемых — именно так выглядят скан портов и медленное исчерпание.
socket:
  enabled: true
  # Как часто смотреть. Реже — дешевле, но короткая волна проскочит между замерами.
  period_sec: 1.0
  # Со скольких удерживаемых соединений это перестаёт быть обычной работой клиента.
  held_threshold: 8
