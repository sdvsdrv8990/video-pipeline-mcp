# transport.yaml — что сервер обещает клиенту на проводе. Схема — core/declaration_schemas.py TransportDeclaration.

# Источники страниц (Origin), которым разрешено звать сервер вдобавок к петле: клиенты, чей бэкенд шлёт Origin.
# Прочим Origin — отказ ORIGIN_FORBIDDEN; запрос без Origin (не браузер) судится как прежде. Добавка на одной машине —
# переменная MCP_ALLOWED_ORIGINS (через запятую), к этому списку.
origins:
  allowed:
    - https://claude.ai     # коннектор Claude AI Web: строгая проверка Origin ему не даёт подняться (claude.com/docs/connectors/building/troubleshooting)

# Сколько ответа клиент берёт в один результат вызова инструмента (текст и structuredContent вместе) — больше он обрежет
# или отвергнет, поэтому сервер такой ответ не шлёт: fs_read_file отдаёт страницами (offset → next_offset), прочим
# инструментам — отказ RESULT_TOO_LARGE. Клиенты MCP и их пределы — в их же единицах. Источник: claude.com/docs/connectors/building, таблица «Design within the
# size and timeout limits» (прочитано 2026-10-13): claude.ai and Desktop — «~150,000 characters», «240 seconds per tool
# call»; Claude Code — «25,000 tokens, configurable with MAX_MCP_OUTPUT_TOKENS», срок — «Configurable with
# MCP_TOOL_TIMEOUT» (числа на странице нет — не объявлен, ожидания нет). Какие клиенты у этой установки — по её фактам
# (install.yaml): клиентский конец туннеля → `tunnel`, MCP на этой машине → `loopback`; нет объявления — все. Действует
# самый тесный из клиентов установки: ни один клиент не получит больше своего.
# Claude Code (code.claude.com/docs/en/mcp, «MCP output limits and warnings», установлен 2.1.296, прочитано
# 2026-10-13): успешный итог сверх 25 000 токенов или 50 000 знаков не обрезается — «saves it to a file and replaces it
# in the conversation with a message that names the file path»; теряется тело больше 16 MB — «stops reading a response …
# once one JSON response body … passes 16 MB after decompression. The request that response answers fails». Текст
# отказа (isError) длиннее ~11 000 знаков режется: «keeps only its first 5,000 and last 5,000 characters» — целым
# остаётся 10 000. Срок вызова не объявлен: без MCP_TOOL_TIMEOUT у клиента «about 28 hours» — его умолчание, не наш срок.
# Исправлено 2026-10-19 (прочитано 13.10 неполно): code.claude.com/docs/en/env-vars.md, строка MCP_TOOL_TIMEOUT, установлен
# 2.1.302 — «For an HTTP, SSE, or claude.ai connector server, each request also times out after 60 seconds by default; set
# this variable, or the per-server `timeout`, above 60000 to raise that per-request limit». Сервер для Claude Code — HTTP
# (server.py, aiohttp на петле), поэтому срок 60 с. Поднятый пользователем предел (MCP_TOOL_TIMEOUT или `timeout` сервера)
# серверу не виден: тогда дверь отдаёт статус раньше, чем могла бы, — честно, без обрыва.
# `reserve_sec` — запас доставки ответа внутри срока: дверь ждёт задание не дольше call_sec − reserve_sec. Замер петли
# 2026-10-19 00:13 (seamkeeper workspace/orders/infra/job-node/media-generate/reserve_probe.out, проба reserve_probe.py
# там же): живой server.py, 127.0.0.1, круг task_status N=300 — p50 3,34 мс, p99 19,39 мс, max 30,98 мс, ответ 461 знак;
# 1 с — p99 с округлением вверх до шага срока (call_sec — целые секунды). Туннель — не мерено: нет замера туннеля, его
# доля прибавится к запасу claude_ai после замера.
clients:
  claude_ai:
    reached: tunnel
    answer_chars: 150000
    call_sec: 240
    reserve_sec: 1
  claude_code:
    reached: loopback
    answer_bytes: 16000000
    error_chars: 10000
    call_sec: 60
    reserve_sec: 1
