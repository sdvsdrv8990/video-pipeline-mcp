# Шаблон уровня КАНАЛ (наш). ИНСТРУКЦИЯ_шаблоны.md §3.
# Ребёнок — video (ссылка). При создании канала видео НЕ разворачиваются (контроль глубины):
# создаётся только контейнер videos/. Видео материализуется, когда ИИ назвал его имя.
channel:
  folders:
    - { name: "scene_layouts", required: true }
    - { name: "videos", required: true }
  files:
    - { name: "channel_data.xlsx", kind: table, table_template: channel_data, required: true }
    - { name: "channel_config.xlsx", kind: table, table_template: channel_config, required: true }
    - { name: "project_memory.md", kind: file, required: true }
  children:
    - { type: video, container: "videos/" }
