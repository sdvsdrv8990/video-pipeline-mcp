# _defaults.yaml — общие правила материализации книг (не книга, а декларация поверх всех схем).
#
# ДЕГРАДАЦИЯ ФОРМУЛ. Требование владельца: при неполных данных формула НЕ ломается —
# отдаёт пусто/PENDING/0, а не `#DIV/0!`/`#REF!`/`#NAME?`. Механизм обязан быть декларативным:
# материализатор оборачивает объявленную формулу в IFERROR с запасным значением ОТСЮДА,
# в коде нет ни одного «если данных нет» — только чтение этой таблицы.
#
# Приоритет: `on_empty:` у столбца → `degrade:` у книги → эта таблица.
# Значение подставляется как есть: число — числом, строка — строкой в кавычках.

degrade:
  float: 0            # доли/проценты: пустой вход = 0, дальше видно по данным
  integer: 0
  boolean: false
  # Текстовые и категориальные НЕ занулять: 0 в столбце статуса читается как значение.
  # PENDING говорит «ещё не посчитано», и это ровно то, что нужно на неполных данных.
  enum: ""            # пусто: PENDING не входит в enum столбца и нарушил бы дропдаун
  string: PENDING
  date: ""
  list: ""

# ЧТО ПОКРЫВАЕТ ЗАПАСНОЕ на заполненных входах (пустой вход — всегда неполные данные). Ошибка другого вида на заполненных
# входах — дыра формулы: мерило tests/quick/test_book_formulas.py краснеет с формулой, входом и ошибкой. Столбец
# перекрывает своим `degrade_covers`.
degrade_covers: ["#DIV/0!"]   # доля и процент от нуля (0 просмотров) — запасное

# ФОРМАТЫ СТРОК. Столбец `format: <имя>`: запись снимка судит значение выражением (отказ VALIDATION_ERROR), мерило формул
# берёт образцы входами.
formats:
  mmss:   # отметка транскрибации «минуты:секунды», минут сколько угодно (час — «60:00»)
    pattern: '\d{1,3}:[0-5]\d'
    examples: ["0:00", "01:13", "59:59", "75:10"]
