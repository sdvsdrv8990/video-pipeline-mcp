# competitor_video_data.xlsx — черновик из спеки (scripts/spec_to_schema.py). ТРЕБУЕТ ВЫЧИТКИ.
# Источник: docs/roadmap/spec/schemas/competitor_video_data.schema.md. Формат: spec/TABLE_SCHEMA_FORMAT.md.
book: competitor_video_data
level: competitor_video
source: competitor_video_data.schema.md
sheets:
  - name: META
    # столбцы из прозаической формы спеки: тип не объявлен, принят string
    columns:
      - { name: video_id, type: string, flag: id }
      - { name: title, type: string, flag: W }
      - { name: url, type: string, flag: W }
      - { name: channel_id, type: string, flag: fk }
      - { name: channel_name, type: string, flag: W }
      - { name: publish_date, type: string, flag: W }
      - { name: duration_sec, type: string, flag: W }
      - { name: niche, type: string, flag: W }
      - { name: views, type: string, flag: W }
      - { name: likes, type: string, flag: W }
      - { name: comments, type: string, flag: W }
      - { name: estimated_subs_at_publish, type: string, flag: W }
      - { name: type, type: string, flag: F }

  - name: PERFORMANCE
    columns:
      - { name: views, type: integer, flag: W }
      - { name: likes, type: integer, flag: W }
      - { name: comments, type: integer, flag: W }
      - { name: like_rate, type: float, flag: F, formula: '=likes/views*100' }   # `=likes/views*100`
      - { name: comment_rate, type: float, flag: F, formula: '=comments/views*100' }   # `=comments/views*100`
      - { name: engagement_rate, type: float, flag: F, formula: '=(likes+comments)/views*100' }   # `=(likes+comments)/views*100`
      - { name: estimated_retention, type: float, flag: F, formula: '=MIN(85,20+engagement_rate*8)' }   # `=MIN(85,20+engagement_rate*8)` (оценка, нет реальных данных)
      - { name: retention_tier, type: enum, flag: F, enum: ['HIGH', 'MED', 'LOW'] }   # HIGH/MED/LOW
      - { name: performance_score, type: float, flag: F, formula: '=like_rate*0.4+comment_rate*0.3+(est_retention/100)*0.3' }   # `=like_rate*0.4+comment_rate*0.3+(est_retention/100)*0.3`

  - name: TRANSCRIPT
    # столбцы из прозаической формы спеки: тип не объявлен, принят string
    columns:
      - { name: scene_id, type: string, flag: id }
      - { name: timestamp_start, type: string, flag: W }
      - { name: timestamp_end, type: string, flag: W }
      - { name: duration_sec, type: string, flag: W }
      - { name: act_number, type: string, flag: W }
      - { name: text, type: string, flag: W }
      - { name: word_count, type: string, flag: W }
      - { name: pace_wpm, type: string, flag: F }   # word_count/(duration/60)
      - { name: energy_level, type: string, flag: W }   # 1–5
      - { name: notes, type: string, flag: W }

  - name: TECHNIQUES
    # столбцы из прозаической формы спеки: тип не объявлен, принят string
    columns:
      - { name: technique_id, type: string, flag: id }
      - { name: timestamp, type: string, flag: W }
      - { name: act_number, type: string, flag: W }
      - { name: technique_type, type: string, flag: W }
      - { name: description, type: string, flag: W }
      - { name: effectiveness, type: string, flag: W }   # 1–5
      - { name: steal_priority, type: enum, flag: W, enum: ['HIGH', 'MED', 'LOW', 'SKIP'] }
      - { name: already_in_our_dna, type: enum, flag: W, enum: ['YES', 'NO'] }
      - { name: psychological_pattern_id, type: string, flag: fk }   # P01–P12
      - { name: audience_category, type: enum, flag: W, enum: ['C1', 'C2', 'C3'] }
      - { name: notes, type: string, flag: W }

  - name: PATTERNS
    # столбцы из прозаической формы спеки: тип не объявлен, принят string
    columns:
      - { name: pattern_id, type: string, flag: id }
