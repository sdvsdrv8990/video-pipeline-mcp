# niche_network_data.xlsx — черновик из спеки (scripts/spec_to_schema.py). ТРЕБУЕТ ВЫЧИТКИ.
# Источник: docs/roadmap/spec/schemas/niche_network_data.schema.md. Формат: spec/TABLE_SCHEMA_FORMAT.md.
book: niche_network_data
level: network
source: niche_network_data.schema.md
sheets:
  - name: COMPETITORS_INDEX
    columns:
      - { name: channel_id, type: string, flag: id }
      - { name: channel_name, type: string, flag: W }
      - { name: subs_approx, type: integer, flag: W }
      - { name: videos_analyzed, type: integer, flag: W }
      - { name: avg_performance_score, type: float, flag: F }
      - { name: primary_hook_type, type: string, flag: W }
      - { name: primary_visual_style, type: string, flag: W }
      - { name: primary_audio_style, type: string, flag: W }
      - { name: threat_level, type: enum, flag: W, enum: ['HIGH', 'MED', 'LOW'] }   # HIGH/MED/LOW
      - { name: last_analyzed_date, type: date, flag: W }
      - { name: top_video_id, type: string, flag: W }
      - { name: top_video_views, type: integer, flag: W }
      - { name: our_adoption_count, type: integer, flag: F }   # сколько их инсайтов мы применили

  - name: NICHE_PATTERNS
    columns:
      - { name: pattern_id, type: string, flag: id }
      - { name: pattern_type, type: enum, flag: W }   # visual/script/audio/retention
      - { name: found_in_channels, type: string, flag: W }   # список channel_id
      - { name: channels_count, type: integer, flag: F }
      - { name: frequency_pct, type: float, flag: F, formula: '=channels_count/total_channels*100' }   # `=channels_count/total_channels*100`
      - { name: avg_effectiveness, type: float, flag: W }
      - { name: best_example_video_id, type: string, flag: W }
      - { name: our_adoption_status, type: enum, flag: W, enum: ['NOT_ADOPTED', 'IN_DNA', 'TESTING', 'TESTED', 'REJECTED'] }   # NOT_ADOPTED/IN_DNA/TESTING/TESTED/REJECTED
      - { name: psychological_pattern_id, type: string, flag: W }   # P01–P12
      - { name: audience_category, type: enum, flag: W, enum: ['C1', 'C2', 'C3'] }   # C1/C2/C3
      - { name: notes, type: string, flag: W }

  - name: TOP_TOPICS
    columns:
      - { name: rank, type: integer, flag: W }
      - { name: topic, type: string, flag: W }
      - { name: channel_id, type: string, flag: W }
      - { name: video_id, type: string, flag: W }
      - { name: views, type: integer, flag: W }
      - { name: performance_score, type: float, flag: W }
      - { name: hook_angle_used, type: string, flag: W }
      - { name: approach_a_feasibility, type: integer, flag: W }   # 1–5
      - { name: approach_b_signal, type: integer, flag: W }   # 1–5
      - { name: our_coverage_status, type: enum, flag: W, enum: ['NOT_COVERED', 'PLANNED', 'IN_PRODUCTION', 'DONE'] }   # NOT_COVERED/PLANNED/IN_PRODUCTION/DONE
      - { name: our_video_id, type: string, flag: W }
      - { name: notes, type: string, flag: W }

  - name: AUDIENCE_PROFILE   # (2 секции)
    # столбцы из прозаической формы спеки: тип не объявлен, принят string
    columns:
      - { name: category_id, type: string, flag: id }
      - { name: category_name, type: string, flag: W }
      - { name: description, type: string, flag: W }
      - { name: evidence_source, type: string, flag: W }   # список video_id
      - { name: size_estimate, type: enum, flag: W, enum: ['LARGE', 'MED', 'SMALL'] }
      - { name: primary_pain_point, type: string, flag: W }
      - { name: primary_desire, type: string, flag: W }
      - { name: content_format_preference, type: string, flag: W }
      - { name: pattern_id, type: string, flag: id }
      - { name: pattern_name, type: string, flag: W }
      - { name: pattern_type, type: string, flag: W }   # cognitive_bias/behavioral/psychographic
      - { name: evidence_from_top_videos, type: string, flag: W }
      - { name: strength_in_niche, type: string, flag: W }   # 1–5
      - { name: content_application, type: string, flag: W }
      - { name: already_in_our_dna, type: enum, flag: W, enum: ['YES', 'NO'] }

  - name: CONTENT_PREDICTION   # предсказания (gap → план)
    columns:
      - { name: prediction_id, type: string, flag: id }
      - { name: approach, type: enum, flag: W }   # A/B
      - { name: prediction_origin, type: enum, flag: W }   # competitor_clone/audience_gap/trend_collision/cross_niche_transfer/emerging_pattern
      - { name: approach_name, type: string, flag: W }
      - { name: approach_goal, type: string, flag: W }
      - { name: why_this_is_white_spot, type: string, flag: W }
      - { name: ai_execution_steps, type: string, flag: W }
      - { name: topic, type: string, flag: W }
      - { name: hook_angle, type: string, flag: W }
      - { name: target_category_id, type: string, flag: W }   # из AUDIENCE_PROFILE
      - { name: patterns_triggered, type: string, flag: W }   # P01–P12
      - { name: source_channels, type: string, flag: W }
      - { name: source_video_ids, type: string, flag: W }
      - { name: evidence, type: string, flag: W }
      - { name: predicted_performance, type: integer, flag: W }   # 1–5
      - { name: confidence, type: enum, flag: W }
      - { name: risk_level, type: enum, flag: W }
      - { name: estimated_production_difficulty, type: integer, flag: W }   # 1–5
      - { name: estimated_uniqueness, type: integer, flag: W }   # 1–5
      - { name: our_advantage_angle, type: string, flag: W }
      - { name: recommended_format, type: string, flag: W }
      - { name: status, type: enum, flag: W, enum: ['IDEA', 'PLANNED', 'IN_PRODUCTION', 'TESTING', 'DONE', 'REJECTED'] }   # IDEA/PLANNED/IN_PRODUCTION/TESTING/DONE/REJECTED
      - { name: assigned_to_agent, type: string, flag: W }
      - { name: result_video_id, type: string, flag: W }
      - { name: actual_performance_score, type: float, flag: W }   # после DONE
      - { name: prediction_accuracy, type: enum, flag: F, enum: ['ACCURATE', 'CLOSE', 'MISS', 'PENDING'] }   # ACCURATE/CLOSE/MISS/PENDING (формула по status)
      - { name: postmortem_notes, type: string, flag: W }
      - { name: next_iteration_action, type: string, flag: W }

  - name: TOP_VIDEOS_NICHE
    columns:
      - { name: rank, type: integer, flag: W }
      - { name: video_id, type: string, flag: W }
      - { name: channel_id, type: string, flag: W }
      - { name: title, type: string, flag: W }
      - { name: views, type: string, flag: W }
      - { name: performance_score, type: string, flag: W }
      - { name: hook_type, type: string, flag: W }
      - { name: key_technique, type: string, flag: W }
      - { name: why_it_dominated, type: string, flag: W }
      - { name: steal_priority, type: enum, flag: W, enum: ['HIGH', 'MED', 'LOW'] }   # HIGH/MED/LOW
      - { name: applied_by_us, type: enum, flag: W, enum: ['YES', 'NO'] }   # YES/NO
      - { name: our_video_id, type: string, flag: W }

  - name: NICHE_VISUAL_PATTERNS
    # столбцы из прозаической формы спеки: тип не объявлен, принят string
    columns:
      - { name: pattern_id, type: string, flag: id }
      - { name: context_tag, type: string, flag: W }
      - { name: found_in_channels, type: string, flag: W }   # список
      - { name: channels_count, type: string, flag: F }
      - { name: frequency_pct, type: string, flag: F }
      - { name: avg_effectiveness, type: string, flag: W }
      - { name: best_example_video_id, type: string, flag: fk }
      - { name: our_adoption_status, type: enum, flag: W }
      - { name: our_pattern_id, type: string, flag: fk }
      - { name: psychological_pattern_id, type: string, flag: fk }   # P01–P12
      - { name: audience_category, type: enum, flag: W }
      - { name: notes, type: string, flag: W }
      - { name: visual_solution, type: string, flag: W }

  - name: NICHE_SCRIPT_PATTERNS
    # столбцы из прозаической формы спеки: тип не объявлен, принят string
    columns:
      - { name: pattern_id, type: string, flag: id }
      - { name: context_tag, type: string, flag: W }
      - { name: found_in_channels, type: string, flag: W }   # список
      - { name: channels_count, type: string, flag: F }
      - { name: frequency_pct, type: string, flag: F }
      - { name: avg_effectiveness, type: string, flag: W }
      - { name: best_example_video_id, type: string, flag: fk }
      - { name: our_adoption_status, type: enum, flag: W }
      - { name: our_pattern_id, type: string, flag: fk }
      - { name: psychological_pattern_id, type: string, flag: fk }   # P01–P12
      - { name: audience_category, type: enum, flag: W }
      - { name: notes, type: string, flag: W }
      - { name: pattern_description, type: string, flag: W }

  - name: NICHE_AUDIO_PATTERNS
    # столбцы из прозаической формы спеки: тип не объявлен, принят string
    columns:
      - { name: pattern_id, type: string, flag: id }
      - { name: context_tag, type: string, flag: W }
      - { name: found_in_channels, type: string, flag: W }   # список
      - { name: channels_count, type: string, flag: F }
      - { name: frequency_pct, type: string, flag: F }
      - { name: avg_effectiveness, type: string, flag: W }
      - { name: best_example_video_id, type: string, flag: fk }
      - { name: our_adoption_status, type: enum, flag: W }
      - { name: our_pattern_id, type: string, flag: fk }
      - { name: psychological_pattern_id, type: string, flag: fk }   # P01–P12
      - { name: audience_category, type: enum, flag: W }
      - { name: notes, type: string, flag: W }
      - { name: pattern_description, type: string, flag: W }

  - name: NICHE_RETENTION_PATTERNS
    # столбцы из прозаической формы спеки: тип не объявлен, принят string
    columns:
      - { name: pattern_id, type: string, flag: id }
      - { name: context_tag, type: string, flag: W }
