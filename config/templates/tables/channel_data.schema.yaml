      - { name: category, type: enum, flag: W }   # color/emotion/lighting/camera/sound
      - { name: rule_description, type: string, flag: W }
      - { name: example_from_human, type: string, flag: W }
      - { name: strictness, type: integer, flag: W }   # 1–5
      - { name: applied_in_videos_count, type: integer, flag: F }
      - { name: last_applied_video_id, type: string, flag: W }

  - name: GOLDEN_SCRIPTS   # эталонные сценарии
    columns:
