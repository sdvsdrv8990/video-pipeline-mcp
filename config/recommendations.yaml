# recommendations.yaml — что сервер СОВЕТУЕТ клиенту в успешном ответе (F59).
#
# Реестр реакций (server_reactions.yaml) объясняет ОШИБКИ. Этот файл — второй канал:
# объяснение в момент УСПЕХА, когда у ИИ был выбор, о котором он не знал. Формат один и тот же
# по духу: код → текст + инструмент + параметры, чтобы совет был исполним, а не прозой.
#
# Формат записи:
#   <ключ>:
#     - id: короткий идентификатор совета (стабилен, по нему пишут регрессии)
#       text: что это и когда брать — одной фразой, без «очередей» и «многопоточности»
#       tool: инструмент, которым совет исполняется (пусто — если действия не требуется)
#       params: пример параметров вызова (подставляются {плейсхолдеры} из контекста)
#
# `{path}` подставляется вызывающим. Незнакомый плейсхолдер остаётся текстом — молча не гасим.

structure_create.modes:
  - id: mode_default
    text: "Режим default (сейчас применён): папки и книги создаются по серверным шаблонам как есть. Обычный случай — брать, если структура проекта стандартная."
    tool: structure_create
    params: { mode: default }

  - id: mode_custom
    text: "Режим custom: проект получает СВОЮ копию шаблонов и правит её ДО материализации. Брать, если структура этого канала отличается от стандартной. Сначала structure_customize, потом structure_create с mode=custom."
    tool: structure_customize
    params: { path: "{path}", what: both }

  - id: mode_manual
    text: "Режим manual: сервер не материализует ничего, отдаёт работу инструментам fs_* и excel_*. Брать для разового нестандартного случая, когда шаблон писать дороже, чем собрать руками."
    tool: structure_create
    params: { mode: manual }

structure_create.custom_without_templates:
  - id: custom_no_templates
    text: "Режим custom запрошен, но своих шаблонов у проекта нет — взяты серверные. Чтобы править структуру под проект, сначала скопируй шаблоны себе."
    tool: structure_customize
    params: { path: "{path}", what: both }

structure_create.manual:
  - id: manual_next
    text: "Ничего не создано намеренно (mode=manual). Папки — fs_create_dir, файлы — fs_create_file, книги — excel_create_workbook + excel_add_sheet/excel_add_column. ID сущности назначается через structure_assign_id, иначе она останется без владельца."
    tool: structure_assign_id
    params: { path: "{path}" }

uniqueness.compensated:
  - id: compensation_recorded
    text: "Сцена прошла за счёт соседей: заспамленные фрагменты закрыты уникальным текстом и фоном. Это записано в проект — приём разрешён, но не раз за разом. До следующего применения дешевле поменять саму сцену: переставить фрагменты, заменить анимацию, взять другой переход."
    tool: uniqueness_check
    params: { table: "{table}" }

uniqueness.escalated:
  - id: compensation_escalated
    text: "Приём «пройти уникальность за счёт соседей» применён к этой сцене слишком много раз. Дальше компенсация не считается решением: нужна уникальная сцена — новые SVG-компоненты или полностью новая сборка. Перестановка и смена анимации здесь уже не помогут."
    tool: structure_find
    params: { text: "{scene_ref}" }
  # Требование сервера ОСПОРИМО: расчёт может ошибиться. Отдельных инструментов для спора нет
  # и не нужно — журнал сигнала это обычный лист, читается и правится теми же дверями.
  - id: compensation_dispute_facts
    text: "Не согласен с требованием — сперва посмотри ФАКТЫ, на которых оно построено: записи журнала по этой сцене (какие фрагменты, когда, каким числом). Это обычный лист, читается запросом по столбцам."
    tool: search_tables
    params:
      yaml_query: "sheet: UNIQUENESS_ALERTS\nwhere:\n  scene_ref: {scene_ref}"
  - id: compensation_dismiss
    text: "Считаешь сигнал ошибочным — сними КОНКРЕТНУЮ запись журнала: signal_status=dismissed, flag_source=human_decision (решение за человеком, сервер рекомендует, но не решает), reason=почему. Снятая запись перестаёт копиться в долг, и требование новой сцены уходит. Обоснование продублируй в память проекта — таблица помнит ЧТО, память помнит ПОЧЕМУ."
    tool: table_update
    params:
      sheet: UNIQUENESS_ALERTS
      data: { signal_status: dismissed, flag_source: human_decision, reason: "<почему сигнал ошибочен>" }

uniqueness.no_competitor_patterns:
  - id: no_competitor_patterns
    text: "ПРИОРИТЕТ: патернов конкурентов нет — сравнивать не с чем, и уникальность меряется вслепую. Разбери конкурентов ПЕРВЫМИ: без внешнего эталона любая оценка «уникально» ничем не подтверждена."
    tool: search_tables
    params:
      yaml_query: "sheet: COMPETITOR_PATTERNS"

uniqueness.no_own_patterns:
  - id: no_own_patterns
    text: "Своих патернов ещё нет — на старте канала это нормально, наработки копятся. Минус меньше, чем отсутствие конкурентов: сравнивать с собой пока просто не с чем."
    tool: search_tables
    params:
      yaml_query: "sheet: SCRIPT_PATTERNS_USED"

structure_customize:
  - id: customize_edit
    text: "Шаблоны скопированы в проект. Правь их (fs_read/fs_write), затем создавай узел с mode=custom — материализация пойдёт по твоей копии, серверные шаблоны останутся нетронутыми."
    tool: structure_create
    params: { mode: custom }
