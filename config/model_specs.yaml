# model_specs.yaml — что модель принимает на вход, когда спросить об этом НЕКОГО.
#
# Порядок источников спеки (см. `providers.yaml → capabilities`): сам провайдер → ЭТОТ справочник
# → файлы модели на диске. Сюда попадает то, чего не отдаёт ни провайдер, ни диск:
#   • параметры НАШИХ локальных адаптеров — их не описывает никто, кроме нас;
#   • модели провайдера, который схему не отдаёт (Replicate требует токен даже на чтение).
#
# Формат — JSON Schema (тот же язык, что у `input_schema` инструментов), проверяет его
# установленная библиотека. Ключи: `providers.<имя>` — общее для всех моделей провайдера,
# `models.<имя>` — точнее и имеет приоритет.
#
# ⚠️ Вписывать сюда чужую схему «по памяти» нельзя: неверная спека хуже отсутствующей — она
# запретит то, что модель умеет, и разрешит то, чего не умеет. Только проверенное.

providers:
  # Наш адаптер удаления фона: эти столбцы строки канала читает `core/providers/img/onnx_bg.py`.
  Local_onnx_bg:
    description: >-
      Удаление фона графом ONNX. Маска считается в своём разрешении и растягивается на исходник,
      поэтому input_size влияет на качество края, а не на размер результата.
    schema:
      type: object
      properties:
        input_size:
          type: integer
          minimum: 128
          maximum: 2048
          description: >-
            Сторона квадрата, в котором модель считает маску. Пусто — берётся из
            preprocessor_config.json модели. Больше 2048 не имеет смысла: сети этого класса
            обучены на 512–1024, и лишнее разрешение добавляет время, а не точность.
        cutoff:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Порог отсечения маски: 0 (пусто) — мягкая полупрозрачная кайма, 0.5 — резкая граница.
        bg_color:
          type: string
          description: >-
            Залить фон цветом вместо прозрачности (имя цвета или #RRGGBB). Пусто — прозрачный PNG.

  # Наш адаптер увеличения. Кратность НЕ параметр: она свойство модели и измеряется по её выходу.
  Local_onnx_upscale:
    description: >-
      Увеличение графом ONNX. Во сколько раз — решает сама модель (x2, x4), задать это нельзя.
    schema:
      type: object
      properties:
        tile:
          type: integer
          minimum: 0
          maximum: 2048
          description: >-
            Сторона куска, которым считается большая картинка. 0 — считать целиком (быстрее, но
            память растёт квадратично от площади кадра). 256 — разумно для кадров от 1024.
        tile_overlap:
          type: integer
          minimum: 0
          maximum: 512
          description: >-
            Перекрытие кусков, чтобы шов не был виден. Пусто — восьмая часть tile.

models: {}
# Сюда — модели провайдеров, которые схему не отдают (например, Replicate: у него на чтение
# модели нужен токен, проверено — без него 401). Заполняется по ФАКТУ: скопировать
# `components.schemas.Input` из ответа провайдера, а не сочинять по памяти.
