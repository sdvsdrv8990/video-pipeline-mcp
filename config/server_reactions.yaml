# server_reactions.yaml — реестр реакций сервера
#
# Движок (core/engine) при ошибке смотрит сюда по `code` и собирает ErrorDetail.
# Добавить реакцию = строка здесь, не код. Формат читается core/reactions/reactions.py:
#   <CODE>:
#     class: ai_recoverable | server_recoverable | human_required | integrity | unknown
#     message_template: "текст по умолчанию"
#     recovery: { suggested_tool, suggested_params, reason }

# ═══ Ошибки движка/транспорта ═══

TOOL_NOT_FOUND:
  class: ai_recoverable
  message_template: "Инструмент не найден."
  recovery:
    suggested_tool: "tools/list"
    reason: "Посмотри доступные инструменты и вызови существующий."

VALIDATION_ERROR:
  class: ai_recoverable
  message_template: "Параметры не соответствуют input_schema инструмента."
  recovery:
    suggested_tool: "tools/list"
    reason: "Сверь параметры со схемой инструмента и повтори вызов."

BOOK_ROW_INVALID:
  class: ai_recoverable
  message_template: "Строка {row} листа {sheet} книги канала не принята: какое поле и какое правило нарушено — в errors."
  recovery:
    suggested_tool: table_update
    reason: "Это данные канала, а не вызов инструмента: поправь ячейки этой строки (table_update) и повтори."

INTERNAL_ERROR:
  class: human_required
  message_template: "Внутренняя ошибка сервера."
  recovery:
    reason: "Непредвиденный сбой в хендлере. Нужна диагностика человеком."

# ═══ Файловая система (safe-join) ═══

PATH_ESCAPE:
  class: ai_recoverable
  message_template: "Путь «{path}» выходит за пределы своего корня."
  recovery:
    reason: "Путь задаётся внутри своего корня — рабочей области или каталога весов, — без '..' и абсолютных путей."

FILE_NOT_FOUND:
  class: ai_recoverable
  message_template: "Файл не найден."
  recovery:
    suggested_tool: "fs_create_file"
    reason: "Создай файл перед чтением."

TABLE_NOT_FOUND:
  class: ai_recoverable
  message_template: "Таблица не найдена."
  recovery:
    suggested_tool: "fs_create_project_structure"
    reason: "Создай структуру проекта."

FILE_EXISTS:
  class: ai_recoverable
  message_template: "Файл или каталог уже существует: {path}"
  recovery:
    reason: "Удали существующий файл или используй другое имя."

TEMPLATE_NOT_FOUND:
  class: ai_recoverable
  message_template: "Шаблон не найден: {template}"
  recovery:
    reason: "Проверь имя шаблона в config/templates/workspace/."

NO_FRAGMENTS:
  class: ai_recoverable
  message_template: "Нет фрагментов для создания."
  recovery:
    reason: "Укажи template или fragments."

INVALID_EXTENSION:
  class: ai_recoverable
  message_template: "Неверное расширение файла: {path}"
  recovery:
    reason: "Используй расширение .py для Python-скриптов."

PROVIDER_FAILED:
  class: server_recoverable
  message_template: "Внешний провайдер недоступен."
  recovery:
    reason: "Повтор с задержкой (retry_count/retry_delay) и переход на fallback_provider — всё из строки листа провайдеров книги канала; при исчерпании цепочки — человек."

CONTENT_REJECTED:
  class: ai_recoverable
  message_template: "Провайдер отклонил контент (модерация)."
  recovery:
    reason: "Переформулируй промпт — повтор того же промпта даст тот же отказ."

LOCAL_INFERENCE_FAILED:
  class: server_recoverable
  message_template: "Сбой локального инференса."
  recovery:
    reason: "Деградация модели (large→medium→base) или проверка ресурсов; при исчерпании — человек. Среда расчёта ставится под КАРТУ машины: python3 scripts/configure.py → «Среда расчёта»; голое `pip install -e \".[local]\"` даёт библиотеки моделей БЕЗ torch."

# ═══ Аутентификация ═══

AUTH_REQUIRED:
  class: human_required
  message_template: "Требуется аутентификация. Заголовок Authorization отсутствует."
  recovery:
    reason: "Передай bearer-токен в заголовке Authorization: Bearer <token>."

AUTH_FAILED:
  class: human_required
  message_template: "Аутентификация не пройдена. Неверный токен."
  recovery:
    reason: "Проверь значение MCP_AUTH_TOKEN и повтори запрос."

# ═══ Таблицы: данные (Категория 3) ═══

SHEET_NOT_FOUND:
  class: ai_recoverable
  message_template: "Лист не найден в таблице."
  recovery:
    suggested_tool: "json_read_snapshot"
    reason: "Проверь имя листа (регистр важен) или создай через excel_add_sheet."

COLUMN_NOT_FOUND:
  class: ai_recoverable
  message_template: "Столбец не найден в листе."
  recovery:
    reason: "Сверь имя столбца со схемой (json_read_snapshot) или добавь через excel_add_column."

ROW_NOT_FOUND:
  class: ai_recoverable
  message_template: "Строка с таким ID не найдена."
  recovery:
    suggested_tool: table_find_row
    reason: "Если известно ЗНАЧЕНИЕ, а не ID — найди ID через table_find_row(where={{столбец: значение}}); иначе создай строку через table_append."

COMPUTED_READONLY:
  class: ai_recoverable
  message_template: "Столбец вычисляемый (формула) — запись данных запрещена."
  recovery:
    reason: "Формулы не перезаписываются. Меняй исходные столбцы, из которых считается формула."

ENUM_VIOLATION:
  class: ai_recoverable
  message_template: "Значение вне допустимого enum столбца."
  recovery:
    reason: "Используй одно из значений enum из схемы столбца."

INVALID_ACTION:
  class: ai_recoverable
  message_template: "Недопустимое действие для очереди."
  recovery:
    reason: "В очередь идут только set/append/delete; чтения (get_column/get_row) выполняются сразу."

# ═══ Таблицы: структура (Категория 2, excel_*) ═══

WORKBOOK_NOT_FOUND:
  class: ai_recoverable
  message_template: "Книга .xlsx не найдена."
  recovery:
    suggested_tool: "excel_create_workbook"
    reason: "Создай книгу через excel_create_workbook или проверь путь."

SHEET_EXISTS:
  class: ai_recoverable
  message_template: "Лист с таким именем уже существует."
  recovery:
    reason: "Выбери свободное имя или переименуй существующий через excel_rename_sheet."

SHEET_NAME_INVALID:
  class: ai_recoverable
  message_template: "Имя листа не принято книгой."
  recovery:
    reason: "Имя листа — непустое и без символов \\ / ? * [ ] :, а длиннее 31 символа его не прочтут другие программы."

LAST_SHEET:
  class: ai_recoverable
  message_template: "Нельзя удалить последний лист книги."
  recovery:
    reason: "В книге всегда должен оставаться хотя бы один лист."

COLUMN_EXISTS:
  class: ai_recoverable
  message_template: "Столбец с таким заголовком уже существует."
  recovery:
    reason: "Используй другое имя или удали существующий через excel_delete_column."

FORMULA_PROTECTED:
  class: ai_recoverable
  message_template: "В ячейке уже есть формула — тихая перезапись запрещена."
  recovery:
    reason: "Перезапись критической формулы недопустима молча. Передай overwrite=true осознанно."

COLUMN_HAS_DEPENDENTS:
  class: ai_recoverable
  message_template: "На столбец ссылаются формулы — удаление/перенос сломает их молча."
  recovery:
    suggested_tool: excel_validate_formulas
    reason: "Перечисленные формулы съедут в #REF!. Сначала перепиши их (excel_insert_formula) или убери; если ссылки уже не нужны — передай force=true осознанно."

PROVIDER_NOT_CONFIGURED:
  class: ai_recoverable
  message_template: "Для этого вида ресурса не объявлен ни один провайдер."
  recovery:
    suggested_tool: table_append
    reason: "Провайдер живёт в данных канала, а не в коде: добавь строку в лист RESOURCE_LIMITS — провайдер, модель, лимит, fallback."

PROVIDER_EXHAUSTED:
  class: human_required
  message_template: "Все объявленные провайдеры исчерпали дневной лимит."
  recovery:
    suggested_tool: table_update
    reason: "Подними daily_limit, обнули current_usage или добавь ещё одного провайдера строкой — это данные канала, правятся без перезапуска сервера."

RESOURCE_BUSY:
  class: server_recoverable
  message_template: "Класс ресурса занят: свободных мест нет."
  recovery:
    suggested_tool: "tools/list"
    reason: "Ждать в вызове нельзя — ожидание за пределом клиента даёт отказ без кода. Займись другой задачей и повтори позже; через сколько — сказано в сообщении отказа. Если задача обязана встать в очередь, это решение человека, а не сервера."

PROVIDER_TIMEOUT:
  class: server_recoverable
  message_template: "Задача провайдера не завершилась за отведённое время."
  recovery:
    reason: "Подними timeout_sec/max_attempts в config/media_tasks.yaml, если задача штатно дольше, либо проверь задачу на стороне провайдера. Повтор без изменения предела даст тот же результат."

DOWNLOAD_INCOMPLETE:
  class: server_recoverable
  message_template: "Файл с «{host}» не загружен полностью: на диске {got} байт из {expected}."
  recovery:
    reason: "Ответ 200 не означает загрузку — файла нет, он пуст или размер не сошёлся с обещанным. Оборванная часть лежит остатком: повтор той же установки докачает её с места обрыва; при повторе проверь ссылку и место на диске."

DOWNLOAD_RANGE_INVALID:
  class: server_recoverable
  message_template: "«{host}» ответил на докачку не с того места: ждали байт {expected}, пришло «{got}»."
  recovery:
    reason: "Сервер прислал часть файла не с той позиции, и дописать её к остатку значило бы испортить файл. Остаток не тронут; повтор начнёт заново, если сервер ответит целиком."

DOWNLOAD_TOO_LARGE:
  class: integrity
  message_template: "Ответ больше объявленного предела {limit_mb} МБ — чтение оборвано, недописанное убрано."
  recovery:
    reason: "Предел считается по ходу потока, а не после записи. Если такой размер штатный — подними предел в config/media_tasks.yaml: download.fetch.max_bytes для файла результата, download.answer.max_bytes для ответа статуса задачи."

DOWNLOAD_TOO_SLOW:
  class: server_recoverable
  message_template: "Источник «{host}» отдаёт медленнее объявленного: {got} байт за {window_sec} с при пределе {floor} байт/с."
  recovery:
    reason: "Медленная передача — не работа: поток держался бы вечно. Попытка потрачена: веса модели докачиваются повтором с принятого, файл результата поставщика остатка не оставляет — повторный вызов качает его с начала. Если такая скорость штатна — порог в speed_floor_bytes_per_sec политики загрузки (config/providers.yaml local.install.fetch, config/media_tasks.yaml download.fetch)."

SECRET_ACCESS_DENIED:
  class: integrity
  message_template: "Каталог секретов закрыт: ключи провайдеров не читаются инструментами."
  recovery:
    reason: "Это не сбой и не вопрос прав конкретного вызова: ключи канала недоступны серверным инструментам по построению. Вносит и меняет их владелец вручную — python scripts/set_provider_key.py --channel <канал> --provider <имя>. Проверить, ЧТО стоит, можно через media_provider_status: он показывает отпечаток и дату, но никогда значение."

PROVIDER_KEY_MISSING:
  class: human_required
  message_template: "У провайдера нет ключа доступа для этого канала."
  recovery:
    suggested_tool: media_provider_status
    reason: "Ключ вносит только владелец и только вручную — у сервера и модели нет прав его читать или записывать через инструменты: python scripts/set_provider_key.py --channel <канал> --provider <имя> (ввод скрыт, значение шифруется до записи). Пока ключа нет, поставь в строке канала провайдера, который работает без ключа (например, локального), — это обычный table_update."

SECRET_UNREADABLE:
  class: human_required
  message_template: "Файл ключей канала не расшифровывается."
  recovery:
    reason: "Файл зашифрован ключом другого инстанса — восстановлен из чужого бэкапа или утерян instance_secret.key. Прочитать нечем: внеси ключи заново через scripts/set_provider_key.py."

SECRET_ENCRYPTION_UNAVAILABLE:
  class: human_required
  message_template: "Шифрование недоступно: нет библиотеки cryptography."
  recovery:
    reason: "Поставь зависимости сервера (pip install -e .). Хранить ключи провайдеров в открытом виде сервер не станет — это было бы защитой на словах."

DOWNLOAD_FORBIDDEN:
  class: integrity
  message_template: "Адрес «{host}» не пропущен: туда не уходят ни ключ, ни запрос (разрешён: {allowed})."
  recovery:
    reason: "Ключ уходит только по https на объявленный хост провайдера (config/providers.yaml → online.http), даже если адрес статуса или результата назвал сам провайдер. По ссылкам во внутреннюю сеть и на необъявленные схемы и хосты сервер тоже не ходит: результаты — config/media_tasks.yaml → download.fetch, веса — config/providers.yaml → local.install.fetch. Проверь, что вернул провайдер, и столбец model строки канала — он подставляется в адрес вызова."

PROVIDER_ADAPTER_MISSING:
  class: human_required
  message_template: "Для провайдера из строки канала не объявлен адаптер."
  recovery:
    suggested_tool: media_provider_status
    reason: "Имя провайдера — данные канала, а код по этому имени — серверный конфиг. Либо поставь в строке провайдера, которого сервер умеет исполнять, либо объяви адаптер в config/providers.yaml → adapters.by_provider."

RUNNER_NOT_RUNNING:
  class: ai_recoverable
  message_template: "Раннер локальных моделей не отвечает."
  recovery:
    suggested_tool: media_runner
    suggested_params: {action: start}
    reason: "Раннер поднимается явной командой и сам не стартует (демона на сервере нет). Подними его — media_runner(action='start') — либо переключи строку канала на провайдера, который считает в самом сервере (table_update). Молчаливого отката в процесс нет намеренно: он скрыл бы, что изоляции больше нет."

DISK_SPACE_UNKNOWN:
  class: human_required
  message_template: "Хватит ли места под веса '{model}', не определить: свободное место в {dir} не прочитано."
  recovery:
    reason: "Сервер не смог прочитать свободное место на диске весов (причина — в строке «НЕ ЗНАЕМ» вывода python scripts/models.py hardware), а качать вслепую он не станет. Другая модель здесь не поможет: владелец проверяет доступ к {dir} и его диск."

MODEL_SIZE_UNKNOWN:
  class: human_required
  message_template: "Хватит ли места под веса '{model}', не определить: источник не назвал длину частей — {parts}."
  recovery:
    suggested_tool: media_models
    reason: "Без длины каждой части место не проверить, а качать вслепую сервер не станет. Выбери модель, размер которой источник называет (media_models, scope='local'); иначе решает владелец — проверяет место сам и ставит модель вручную."

INSTALL_STALLED:
  class: ai_recoverable
  message_template: "Установка '{model}' не подаёт признаков работы дольше {seconds} с: байты не растут, загрузчик молчит."
  recovery:
    suggested_tool: media_model_install
    reason: "Сеть встала, сервер перезапустили или загрузка зависла. Повтори установку: целые части в план не войдут, а оборванная часть докачается с места обрыва, если источник не сменил файл (докачку подтверждает валидатор ответившего сервера); сменил — часть качается заново."

MODEL_INSTALL_BUSY:
  class: ai_recoverable
  message_template: "Модель '{model}' уже ставится: её части сейчас пишет другая установка — в этом сервере или в другом процессе (scripts/models.py)."
  recovery:
    suggested_tool: media_install_status
    reason: "Две установки одной модели пишут один остаток части и портят его, поэтому вторая не начинается. Прозвони идущую (media_install_status) и дождись её исхода; не поставила — повтори установку: целые части в план не войдут, оборванная докачается."

MODEL_NO_DISK_SPACE:
  class: human_required
  message_template: "Весам '{model}' нужно {need_mb} МБ, а на диске под веса свободно {free_mb} МБ."
  recovery:
    suggested_tool: media_models
    reason: "Освободи место либо выбери модель меньше: media_models(scope='local', fits=true) отдаёт только те, что влезают на эту машину."

LOCAL_MODEL_MISSING:
  class: human_required
  message_template: "Веса локальной модели '{model}' не найдены (ожидались в {path})."
  recovery:
    suggested_tool: media_models
    reason: "Веса не лежат в git. Посмотри, что можно поставить — media_models (scope='local'), поставь — media_model_install; из терминала то же делает python scripts/models.py install <id> --kind <вид>, а поставленное по описи на другой машине вернёт python scripts/models.py pull. Либо переключи строку канала на другого провайдера (table_update)."

MODEL_SOURCE_FAILED:
  class: server_recoverable
  message_template: "Источник весов «{host}» отказал: ответ {status}."
  recovery:
    suggested_tool: media_models
    reason: "Источник не отдал часть весов, а повтором такой ответ не лечится (перегрузку и недоступность сервер уже повторил сам). Уже скачанное лежит остатком; проверь модель у источника или поставь другую из media_models (scope='local')."

MODEL_REVISION_UNKNOWN:
  class: server_recoverable
  message_template: "Состояние репозитория '{model}' у «{host}» не узнать: {status}."
  recovery:
    reason: "Без ревизии веса не тянутся: файлы одной модели могли бы приехать из разных состояний репозитория. Ничего не скачано, запрос сервер не повторял — повтори установку позже или проверь сеть сервера. Владелец может закрепить ревизию в config/providers.yaml → local.install.revisions: тогда источник о ней не спрашивается."

MODEL_SOURCE_FORBIDDEN:
  class: ai_recoverable
  message_template: "Источник весов «{source}» не объявлен разрешённым (разрешены: {allowed})."
  recovery:
    suggested_tool: media_models
    reason: "Веса — исполняемое содержимое, и брать их откуда попало сервер не станет. Выбери модель из разрешённого источника (media_models, scope='local'); список правит владелец в config/providers.yaml → local.install.allow_sources."

MODEL_TOO_LARGE:
  class: ai_recoverable
  message_template: "Модель '{model}' весит {mb} МБ при объявленном пределе {limit_mb} МБ."
  recovery:
    suggested_tool: media_models
    reason: "Возьми модель полегче (media_models, scope='local', fits=true); если такой размер осмыслен на этой машине, владелец поднимет local.install.max_total_mb в config/providers.yaml."

MODEL_NOT_IN_CATALOG:
  class: ai_recoverable
  message_template: "Модели '{model}' нет в каталоге {source}."
  recovery:
    suggested_tool: media_models
    reason: "Имя не из каталога источника. Посмотри доступные: media_models(scope='local') или python scripts/models.py local --kind <вид>."

MODEL_NAME_TAKEN:
  class: human_required
  message_template: "Имя '{model}' ({kind}) уже занято моделью {held_by}: веса двух репозиториев легли бы в один каталог."
  recovery:
    suggested_tool: media_models
    reason: "Модель ищется по короткому имени (столбец model строки канала), а у этой оно совпало с уже поставленной из другого репозитория — вторая перезаписала бы первую. Поставить её можно, только если владелец уберёт поставленную; другую модель посмотри в media_models(scope='local')."

MODEL_GATED:
  class: ai_recoverable
  message_template: "Модель '{model}' закрыта автором (gated): ставится только с доступом, выданным автором."
  recovery:
    suggested_tool: media_models
    reason: "Выбери открытую модель того же вида: media_models(scope='local')."

MODEL_FORMAT_MISSING:
  class: ai_recoverable
  message_template: "У модели '{model}' нет файла нужного формата ({formats})."
  recovery:
    suggested_tool: media_models
    reason: "Модель этого вида ставится одним файлом графа объявленного формата. Выбери другую: media_models(scope='local')."

MODEL_UNLOADABLE:
  class: ai_recoverable
  message_template: "Веса модели '{model}' лежат, но не поднимаются в процесс."
  recovery:
    suggested_tool: media_model_install
    reason: "Библиотека расчёта не читает файлы: веса битые, неполные или чужого формата. Перекачай модель тем же именем (media_model_install или python scripts/models.py pull <id>); причина — в журнале сервера."

MODEL_INCOMPLETE:
  class: human_required
  message_template: "Веса локальной модели лежат не целиком."
  recovery:
    suggested_tool: media_models
    reason: "Части из состава модели нет на диске или она короче объявленной — загрузка оборвалась. python scripts/models.py pull <id> идёт по плану разницы и тянет только недостающее; либо переключи строку канала на другого провайдера (table_update)."

MODEL_CORRUPT:
  class: integrity
  message_template: "Веса локальной модели расходятся с объявленным составом."
  recovery:
    suggested_tool: media_models
    reason: "Длина или отпечаток части не совпали с составом, снятым с источника: файл испорчен или подменён, и поднимать его нельзя. python scripts/models.py pull <id> заменит расходящиеся части."

MODEL_UNVERIFIED:
  class: human_required
  message_template: "Целость весов локальной модели судить нечем."
  recovery:
    suggested_tool: media_models
    reason: "Запись описи сделана до состава модели (или веса положены руками, а local.hand_placed в config/providers.yaml их не пускает). python scripts/models.py pull <id> снимет состав с источника и сверит диск."

USAGE_UNIT_UNKNOWN:
  class: human_required
  message_template: "Единица расхода из строки провайдера не объявлена."
  recovery:
    reason: "Объяви единицу в config/providers.yaml → usage.units. Неизвестная единица не считается нулём намеренно: тихий ноль означал бы, что лимит не наступит никогда."

RECALC_UNAVAILABLE:
  class: human_required
  message_template: "Движок пересчёта формул (LibreOffice) недоступен."
  recovery:
    reason: "Установи libreoffice-calc в окружении сервера — валидация формул требует реального пересчёта."

# ═══ Структура: реестр связей / ORPHAN ═══

ENTITY_NOT_FOUND:
  class: ai_recoverable
  message_template: "Сущность не найдена в реестре связей."
  recovery:
    suggested_tool: "structure_status"
    reason: "Проверь имя/тип через structure_status; при необходимости создай через structure_create."

RECONCILE_ROLLED_BACK:
  class: ai_recoverable
  message_template: "Reconcile откачен целиком: ни одна сущность не сдвинута."
  recovery:
    suggested_tool: "structure_status"
    reason: "Помеха на одном из переносов (путь занят, каталога нет) откатывает весь пакет —
      половина reconcile хуже отсутствия. Устрани помеху из сообщения и повтори."

# ═══ Поиск (core/search) ═══

QUERY_NOT_FOUND:
  class: ai_recoverable
  message_template: "Файл запроса не найден."
  recovery:
    reason: "Проверь путь к .yaml-запросу внутри workspace или создай его."

PATH_NOT_FOUND:
  class: ai_recoverable
  message_template: "Путь не найден."
  recovery:
    reason: "Проверь путь внутри workspace (регистр важен)."

# ═══ Анализ данных ═══

SCHEMA_INVALID:
  class: human_required
  message_template: "Декларация таблицы некорректна: {details}"
  recovery:
    reason: "Схема книги (config/templates/tables/*.schema.yaml) не соответствует формату spec/TABLE_SCHEMA_FORMAT.md — правит человек, автоматически не чинится."

DECLARATION_INVALID:
  class: human_required
  message_template: "Декларация {file} не прошла проверку схемы: {details}."
  recovery:
    reason: "Поправь config/{file}: каждое названное поле — по схеме декларации (ключ, тип, обязательность, связь с другими ключами). Значения в ответ не идут — смотри их в самом файле."

# ═══ Проверка целостности ═══

DUPLICATE_ID:
  class: ai_recoverable
  message_template: "ID '{id}' уже занят сущностью типа '{type}'"
  recovery:
    suggested_tool: "structure_check_integrity"
    reason: "Проверь реестр на дубликаты или сгенерируй новый ID."

DUPLICATE_PATH:
  class: ai_recoverable
  message_template: "Путь '{path}' уже принадлежит сущности {id}"
  recovery:
    suggested_tool: "structure_resolve"
    suggested_params: { path: "{path}" }
    reason: "Структура здесь уже создана — переиспользуй существующий ID, а не заводи второй. structure_resolve покажет, кто владеет каталогом."

CHAIN_UNRESOLVED:
  class: ai_recoverable
  message_template: "Каталоги-предки не зарегистрированы: {paths}"
  recovery:
    suggested_tool: "structure_resolve"
    suggested_params: { path: "{path}" }
    reason: "Структура на диске опережает реестр. Посмотри цепочку через structure_resolve и усынови предков (adopt=true) либо выбери другой каталог — сервер не выдумывает ID за существующие каталоги."

TEMPLATE_INVALID:
  class: human_required
  message_template: "Шаблон объявлен неверно: {reason}"
  recovery:
    reason: "Правится в config/templates/workspace/*.tpl.yaml (блок id: с prefix и ancestors) — это объявление, а не данные клиента."

ADVICE_INVALID:
  class: human_required
  message_template: "Декларация советов некорректна: {details}"
  recovery:
    reason: "Правится в config/recommendations.yaml (ключ → список советов) — это объявление сервера, а не данные клиента. Пока файл битый, успешные ответы идут без рекомендаций."

FOREIGN_WRITE:
  class: integrity
  message_template: "Артефакт подписан другим сервером или изменён извне: {path}"
  recovery:
    suggested_tool: "structure_check_integrity"
    suggested_params: { }
    reason: "Состояние НЕ изменено. Кто-то ещё пишет в этот workspace (второй сервер, другой агент, ручная правка). Проверь целостность, восстанови файл из бэкапа или подтверди присвоение запуском server.py --re-adopt."

MACHINE_MISMATCH:
  class: integrity
  message_template: "Рабочая область создана на другой машине (отпечаток не совпал)"
  recovery:
    suggested_tool: "structure_check_integrity"
    reason: "Чтение доступно, запись заблокирована. Если это ваш перенос — смена железа, переезд VM, восстановление из бэкапа — подтвердите его: server.py --re-adopt."

FILE_TYPE_FORBIDDEN:
  class: human_required
  message_template: "Запись файлов этого типа запрещена: {path}"
  recovery:
    reason: "Сервер материализует только объявленные типы (данные, книги, документы, ассеты, .py). Исполняемое и веб-содержимое (.sh/.html/.exe/.bat) не создаётся намеренно. Список — config/firewall.yaml → write_allowlist; менять его должен человек, а не диалог."

FILE_TOO_LARGE:
  class: ai_recoverable
  message_template: "Файл {path} больше объявленного предела: {size} байт при пределе {limit}."
  recovery:
    reason: "Предел проверяется до действия, файл на диске не тронут. Запись — раздели содержимое на несколько файлов; чтение целиком (память) — файл не читается частями, его разбирает человек; fs_read_file отдаёт голову такого файла с пометкой truncated. Пределы — config/firewall.yaml → file_limits."

FILE_NOT_TEXT:
  class: ai_recoverable
  message_template: "Файл {path} — не текст в UTF-8, текстом его не прочитать."
  recovery:
    suggested_tool: fs_get_directory_tree
    reason: "Это бинарный файл (картинка, звук, книга) или текст в другой кодировке. Текстовые инструменты читают только UTF-8; размер и место файла видны в дереве каталога."

NO_DISK_SPACE:
  class: human_required
  message_template: "Запись {path} не помещается на диск сервера: {size} байт при свободных {free}."
  recovery:
    reason: "Место проверено до записи, файл на диске не тронут. Освободить место на диске сервера может только человек: сервер чужое не удаляет."

CONFIRM_REQUIRED:
  class: ai_recoverable
  message_template: "Операция необратима и требует подтверждения: {path}"
  recovery:
    suggested_tool: "fs_delete"
    suggested_params: { force: true }
    reason: "Повтори вызов с force=true, если удаление действительно нужно. Подтверждение обязательно всегда: так инъекция в данных не превращается в тихую потерю файлов."

# ═══ Монтаж: сборка, запуск и приёмка рендера ═══

FFMPEG_MISSING:
  class: human_required
  message_template: "Нечем монтировать: ffmpeg не найден в PATH."
  recovery:
    reason: "ffmpeg — системный бинарь, а не пакет pip: поставь его пакетным менеджером (dnf/apt/brew) и повтори. Ни один инструмент монтажа без него не работает."

FILTER_UNKNOWN:
  class: ai_recoverable
  message_template: "Имя перехода или фильтра не объявлено: {name}"
  recovery:
    suggested_tool: "fs_read_file"
    suggested_params: { path: "config/ffmpeg_filters.yaml" }
    reason: "Словарь монтажа закрыт намеренно: незнакомое имя из книги в фильтрограф не уходит. Возьми имя из словаря или заведи его там."

RENDER_PROFILE_INVALID:
  class: ai_recoverable
  message_template: "Профиль рендера просит невозможное: {reason}"
  recovery:
    suggested_tool: "table_get_row"
    suggested_params: { sheet: "RENDER_CONFIG" }
    reason: "Кодек, разрешение или частота кадров в строке профиля не исполнимы этим ffmpeg. Почини строку профиля в книге канала."

RENDER_INPUT_UNPREPARED:
  class: ai_recoverable
  message_template: "Ассет не подготовлен к наложению: {path}"
  recovery:
    suggested_tool: "media_generate"
    reason: "Снятие фона нейросетью делает провайдер ДО монтажа: ffmpeg режет фон только по цвету. Подготовь ассет и подставь готовый файл."

VARIANT_INCOMPATIBLE:
  class: ai_recoverable
  message_template: "Вариант не годится в этот слот: {reason}"
  recovery:
    suggested_tool: "table_find_row"
    suggested_params: { sheet: "ASSET_VARIANTS" }
    reason: "Сочетаемость проверяется двумя ячейками: ключ оси (обычно ракурс) обязан совпасть с ключом вариантов родительского слота, а размер варианта — влезть в его рамку. Возьми подходящий вариант из каталога или сгенерируй недостающий и заведи строкой."

SCENE_EMPTY:
  class: ai_recoverable
  message_template: "В сцене нет ни одного элемента: {scene_id}"
  recovery:
    suggested_tool: "table_append"
    suggested_params: { sheet: "SCENE_ELEMENTS" }
    reason: "Рендерить нечего. Разложи фрагменты сцены по строкам листа элементов: строка = слой, в ней ассет, положение, размер и время появления."

RENDER_FAILED:
  class: human_required
  message_template: "ffmpeg отказался собирать: {reason}"
  recovery:
    reason: "Причину называет сам ffmpeg последней строкой. Смотри её: чаще всего это несовместимые параметры ассета и профиля."

RENDER_TIMEOUT:
  class: server_recoverable
  message_template: "Рендер не уложился в отведённое время ({timeout} с)."
  recovery:
    reason: "Процесс снят по таймауту, файл не готов. Раздели сцену, уменьши разрешение профиля или подними лимит времени вызова."

RENDER_UNVERIFIED:
  class: integrity
  message_template: "Файл собран, но приёмка его не подтверждает: {reason}"
  recovery:
    reason: "ffprobe не нашёл в результате того, что обещал профиль (поток, длительность, размер кадра). Файл есть, но считать его готовым нельзя — это немая потеря, поэтому отказ."

# ═══ Среда расчёта: пакеты (core/packages) ═══

PACKAGE_GROUP_UNKNOWN:
  class: human_required
  message_template: "Группы пакетов не объявлены в проекте: {groups}."
  recovery:
    reason: "Объявленные группы: {known}. Группа среды расчёта для карты задаётся в config/providers.yaml → local.gpu.drivers[<драйвер>].extras и обязана быть в pyproject.toml → project.optional-dependencies."

PACKAGE_INSTALL_FAILED:
  class: human_required
  message_template: "Установщик пакетов вернул {exit_code}, не поставив: {requirements}."
  recovery:
    reason: "Вывод установщика — в журнале сервера. Частые причины: индекс недоступен, нет колеса под эту платформу, конфликт версий. Повтор поставит только то, чего по-прежнему нет."

PACKAGE_INSTALL_INCOMPLETE:
  class: human_required
  message_template: "Установщик завершился успешно, но среда всё ещё не по требованиям: {requirements}."
  recovery:
    reason: "Суд после установки видит не то, что заказано (версия вне требования, пакет не появился). Сверь, в какой интерпретатор шла установка, и повтори."

# ═══ Fallback ═══

DEFAULT:
  class: unknown
  message_template: "Непредвиденная ошибка."
  recovery:
    reason: "Нет протокола реакции для этого кода — требуется решение человека."
