# server_reactions.yaml — реестр реакций сервера
#
# Движок (core/engine) при ошибке смотрит сюда по `code` и собирает ErrorDetail.
# Добавить реакцию = строка здесь, не код. Формат читается core/reactions/reactions.py:
#   <CODE>:
#     class: ai_recoverable | server_recoverable | human_required | integrity | unknown
#     message_template: "текст по умолчанию"
#     recovery: { suggested_tool, suggested_params, reason, owner }
# reason — читает ИИ-клиент: его действия и «сообщи владельцу», без адресов объявлений и команд хоста (их он не откроет);
# owner — читает владелец у консоли (cli_text): команда хоста, адрес объявления. Клиенту сервера owner не уходит.

# ═══ Ошибки движка/транспорта ═══

TOOL_NOT_FOUND:
  class: ai_recoverable
  message_template: "Инструмента «{tool}» на сервере нет."
  recovery:
    reason: "Вызови инструмент из списка инструментов сервера."

VALIDATION_ERROR:
  class: ai_recoverable
  message_template: "Вызов не принят: что и где не так — в errors."
  recovery:
    reason: "Поправь названное в errors и повтори вызов."

BOOK_ROW_INVALID:
  class: ai_recoverable
  message_template: "Строка {row} листа {sheet} книги канала не принята: какое поле и какое правило нарушено — в errors."
  recovery:
    suggested_tool: table_update
    reason: "Это данные канала, а не вызов инструмента: поправь ячейки этой строки (table_update) и повтори."

INTERNAL_ERROR:
  class: human_required
  message_template: "Внутренняя ошибка сервера."
  recovery:
    reason: "Непредвиденный сбой в хендлере. Нужна диагностика человеком."

# ═══ Файловая система (safe-join) ═══

PATH_ESCAPE:
  class: ai_recoverable
  message_template: "Путь «{path}» выходит за пределы своего корня."
  recovery:
    reason: "Путь задаётся внутри своего корня — рабочей области или каталога весов, — без '..' и абсолютных путей."

FILE_NOT_FOUND:
  class: ai_recoverable
  message_template: "Файла или каталога «{path}» нет."
  recovery:
    suggested_tool: "fs_get_directory_tree"
    reason: "Проверь путь: что лежит в каталоге — fs_get_directory_tree."

TABLE_NOT_FOUND:
  class: ai_recoverable
  message_template: "Таблицы «{table}» нет."
  recovery:
    suggested_tool: "fs_create_project_structure"
    reason: "Создай структуру проекта."

FILE_EXISTS:
  class: ai_recoverable
  message_template: "Файл или каталог уже существует: {path}"
  recovery:
    reason: "Выбери другое имя: занятое не перезаписывается."

PLACE_UNWRITABLE:
  class: server_recoverable
  message_template: "Не удалось: {operation} «{path}» — диск отказал ({reason})."
  recovery:
    reason: "Повтори позже: путь мог держать другой процесс. Повторяется — сообщи владельцу причину из facts.reason."

TEMPLATE_NOT_FOUND:
  class: ai_recoverable
  message_template: "Шаблона «{template}» нет."
  recovery:
    reason: "Проверь имя: какие есть — в facts.known или в описании инструмента."

NO_FRAGMENTS:
  class: ai_recoverable
  message_template: "Нет фрагментов для создания."
  recovery:
    reason: "Укажи template или fragments."

INVALID_EXTENSION:
  class: ai_recoverable
  message_template: "Неверное расширение файла: {path}"
  recovery:
    reason: "Используй расширение .py для Python-скриптов."

PROVIDER_FAILED:
  class: server_recoverable
  message_template: "Внешний провайдер не дал годного ответа."
  recovery:
    reason: "Что можно было повторить, сервер уже повторил. Задачу, которая могла создаться, проверь у провайдера; повтор — не раньше retry_after_sec из фактов, иначе — fallback_provider канала; цепочка исчерпана — к владельцу."

CONTENT_REJECTED:
  class: ai_recoverable
  message_template: "Провайдер отклонил контент (модерация)."
  recovery:
    reason: "Переформулируй промпт — повтор того же промпта даст тот же отказ."

LOCAL_INFERENCE_FAILED:
  class: server_recoverable
  message_template: "Сбой локального инференса."
  recovery:
    reason: "Возьми модель полегче или повтори позже; повторяется — сообщи владельцу номер события."
    owner: "Среда расчёта ставится под карту машины: python3 scripts/configure.py → «Среда расчёта»; голое pip install -e \".[local]\" даёт библиотеки моделей без torch."

# ═══ Аутентификация ═══

AUTH_REQUIRED:
  class: human_required
  message_template: "Требуется аутентификация: ключа нет ни в Authorization, ни в X-Api-Key."
  recovery:
    reason: "Передай ключ заголовком Authorization: Bearer <ключ> или X-Api-Key: <ключ>."

AUTH_FAILED:
  class: human_required
  message_template: "Аутентификация не пройдена: ключ не совпал с ключом сервера."
  recovery:
    reason: "Сверь ключ в заголовках коннектора; потерянный ключ владелец перевыпускает: server.py --rotate-key."

# ═══ Периметр: отказ до разбора запроса как MCP ═══
# Факты здесь — только имена и числа сервера: пришедшие значения (Host, Origin, тело, адрес клиента) в ответ не идут.

HOST_FORBIDDEN:
  class: human_required
  message_template: "Имя хоста запроса не из списка сервера — запрос отклонён до разбора."
  recovery:
    reason: "Обращайся к серверу по его имени: петля или объявленный хост туннеля. Чужое имя хоста — признак обхода через браузер (DNS rebinding)."

ORIGIN_FORBIDDEN:
  class: human_required
  message_template: "Origin запроса не из разрешённых — запрос из чужой вкладки браузера отклонён."
  recovery:
    reason: "Разрешённые Origin объявляет владелец (MCP_ALLOWED_ORIGINS); клиент не из браузера Origin не шлёт."

MEDIA_TYPE_UNSUPPORTED:
  class: human_required
  message_template: "Тело запроса принимается только с Content-Type: {required}."
  recovery:
    reason: "Пошли тело JSON-RPC с заголовком Content-Type: {required}."

REQUEST_UNREADABLE:
  class: human_required
  message_template: "Тело запроса не прочитано: соединение оборвалось или байты не в кодировке тела."
  recovery:
    reason: "Пошли тело JSON-RPC целиком в UTF-8."

REQUEST_MALFORMED:
  class: human_required
  message_template: "Тело запроса — не JSON: разбор встал на строке {line}, столбце {column}."
  recovery:
    reason: "Пошли одно сообщение JSON-RPC 2.0 корректным JSON."

FIREWALL_UNAVAILABLE:
  class: server_recoverable
  message_template: "Проверка запроса файрволом не удалась — запрос отклонён, а не пропущен; причина в консоли сервера."
  recovery:
    reason: "Повтори позже; повторяется — сообщи владельцу."
    owner: "Причина — в консоли сервера; политика — firewall.yaml."

REQUEST_BLOCKED:
  class: human_required
  message_template: "Запрос отклонён файрволом: сработало правило {rule}."
  recovery:
    reason: "Повтор не поможет; если срабатывание ложное — сообщи владельцу правило {rule}."
    owner: "Ложное срабатывание правила {rule} снимается в firewall.yaml и разблокировкой адреса."

RATE_LIMITED:
  class: ai_recoverable
  message_template: "Превышена частота запросов — повтори через {retry_after_sec} с."
  recovery:
    reason: "Подожди {retry_after_sec} с и повтори; повторные превышения подряд блокируют адрес целиком."

# ═══ Таблицы: данные (Категория 3) ═══

SHEET_NOT_FOUND:
  class: ai_recoverable
  message_template: "Лист не найден в таблице."
  recovery:
    suggested_tool: "json_read_snapshot"
    reason: "Проверь имя листа (регистр важен) или создай через excel_add_sheet."

COLUMN_NOT_FOUND:
  class: ai_recoverable
  message_template: "Столбец не найден в листе."
  recovery:
    reason: "Сверь имя столбца со схемой (json_read_snapshot) или добавь через excel_add_column."

ROW_NOT_FOUND:
  class: ai_recoverable
  message_template: "Строка с таким ID не найдена."
  recovery:
    suggested_tool: table_find_row
    reason: "Если известно ЗНАЧЕНИЕ, а не ID — найди ID через table_find_row(where={{столбец: значение}}); иначе создай строку через table_append."

COMPUTED_READONLY:
  class: ai_recoverable
  message_template: "Столбец вычисляемый (формула) — запись данных запрещена."
  recovery:
    reason: "Формулы не перезаписываются. Меняй исходные столбцы, из которых считается формула."

ENUM_VIOLATION:
  class: ai_recoverable
  message_template: "Значение вне допустимого enum столбца."
  recovery:
    reason: "Используй одно из значений enum из схемы столбца."

INVALID_ACTION:
  class: ai_recoverable
  message_template: "Недопустимое действие для очереди."
  recovery:
    reason: "В очередь идут только set/append/delete; чтения (get_column/get_row) выполняются сразу."

# ═══ Таблицы: структура (Категория 2, excel_*) ═══

WORKBOOK_NOT_FOUND:
  class: ai_recoverable
  message_template: "Книга .xlsx не найдена."
  recovery:
    suggested_tool: "excel_create_workbook"
    reason: "Создай книгу через excel_create_workbook или проверь путь."

SHEET_EXISTS:
  class: ai_recoverable
  message_template: "Лист с таким именем уже существует."
  recovery:
    reason: "Выбери свободное имя или переименуй существующий через excel_rename_sheet."

SHEET_NAME_INVALID:
  class: ai_recoverable
  message_template: "Имя листа не принято книгой."
  recovery:
    reason: "Имя листа — непустое и без символов \\ / ? * [ ] :, а длиннее 31 символа его не прочтут другие программы."

LAST_SHEET:
  class: ai_recoverable
  message_template: "Нельзя удалить последний лист книги."
  recovery:
    reason: "В книге всегда должен оставаться хотя бы один лист."

COLUMN_EXISTS:
  class: ai_recoverable
  message_template: "Столбец с таким заголовком уже существует."
  recovery:
    reason: "Используй другое имя или удали существующий через excel_delete_column."

FORMULA_PROTECTED:
  class: ai_recoverable
  message_template: "В ячейке уже есть формула — тихая перезапись запрещена."
  recovery:
    reason: "Перезапись критической формулы недопустима молча. Передай overwrite=true осознанно."

COLUMN_HAS_DEPENDENTS:
  class: ai_recoverable
  message_template: "На столбец ссылаются формулы — удаление/перенос сломает их молча."
  recovery:
    suggested_tool: excel_validate_formulas
    reason: "Перечисленные формулы съедут в #REF!. Сначала перепиши их (excel_insert_formula) или убери; если ссылки уже не нужны — передай force=true осознанно."

PROVIDER_NOT_CONFIGURED:
  class: ai_recoverable
  message_template: "Для этого вида ресурса не объявлен ни один провайдер."
  recovery:
    suggested_tool: table_append
    reason: "Провайдер живёт в данных канала, а не в коде: добавь строку в лист RESOURCE_LIMITS — провайдер, модель, лимит, fallback."

PROVIDER_EXHAUSTED:
  class: human_required
  message_template: "Все объявленные провайдеры исчерпали дневной лимит."
  recovery:
    suggested_tool: table_update
    reason: "Подними daily_limit, обнули current_usage или добавь ещё одного провайдера строкой — это данные канала, правятся без перезапуска сервера."

RESOURCE_BUSY:
  class: server_recoverable
  message_template: "Класс ресурса «{klass}» занят: свободных мест нет, повтор не раньше чем через {retry_after_sec} с."
  recovery:
    reason: "Займись другой задачей и повтори после срока; ждать внутри вызова нельзя."

WORKER_UNAVAILABLE:
  class: server_recoverable
  message_template: "Система не дала поток под работу «{work}»: работа не запускалась."
  recovery:
    reason: "Работа не запускалась — повтор безопасен; повторяется — сообщи владельцу."
    owner: "Предел задач процесса (cgroup pids.max, ulimit -u) ниже мест, объявленных в config/resources.yaml: подними предел машины или убавь места классов; класс места и число потоков пула — в фактах отказа."

PROVIDER_TIMEOUT:
  class: server_recoverable
  message_template: "Провайдер не ответил за отведённое время."
  recovery:
    reason: "Какой предел истёк — в фактах отказа. Вызов, оборванный по сроку после отправки, мог выполниться: проверь задачу у провайдера. Повтор без изменения предела даст то же; работа штатно дольше — подними столбец timeout строки канала (table_update) или сообщи владельцу."
    owner: "Ожидание задачи — poll.timeout_sec/max_attempts в config/media_tasks.yaml; вызов провайдера — timeout_sec (фаза) и deadline_sec (весь вызов) в config/providers.yaml → online.call или в блоке call провайдера."

DOWNLOAD_INCOMPLETE:
  class: server_recoverable
  message_template: "Ответ «{host}» принят не полностью: {got} байт из {expected}."
  recovery:
    reason: "Ответ 200 не означает загрузку — тело оборвалось или короче обещанного. Загрузка файла по ссылке (веса, результат): оборванная часть лежит остатком, повтор той же загрузки докачает её с места обрыва; проверь ссылку и место на диске. Ответ на вызов провайдера (создание задачи, файл телом ответа): остатка нет, а запрос мог выполниться и списаться — сначала проверь задачу у провайдера, потом повторяй."

PROVIDER_OUTCOME_UNKNOWN:
  class: human_required
  message_template: "Исход вызова «{host}» неизвестен: ответ оборван после отправки ({got} байт из {expected})."
  recovery:
    reason: "Запрос мог исполниться и списаться. Проверь задачу у провайдера; повтор вслепую спишет второй раз. Когда появится ключ операции (AD-21), повтор — с ним."

REQUEST_HEADER_INVALID:
  class: human_required
  message_template: "Заголовок «{header}» для «{host}» не отправлен: в значении есть символы, которых HTTP не несёт (не ASCII, перевод строки, NUL). Значение не показано — это может быть секрет."
  recovery:
    reason: "Запрос не ушёл, задачи у провайдера нет. Если «{header}» — токен раннера, перезапусти раннер (media_runner): он выдаст новый; иначе сообщи владельцу."
    owner: "Ключ провайдера вносится заново: python scripts/set_provider_key.py; заголовок из объявления — config/providers.yaml."

DOWNLOAD_RANGE_INVALID:
  class: server_recoverable
  message_template: "«{host}» ответил на докачку не с того места: ждали байт {expected}, пришло «{got}»."
  recovery:
    reason: "Сервер прислал часть файла не с той позиции, и дописать её к остатку значило бы испортить файл. Остаток не тронут; повтор начнёт заново, если сервер ответит целиком."

DOWNLOAD_TOO_LARGE:
  class: integrity
  message_template: "Ответ больше объявленного предела {limit_mb} МБ — чтение оборвано, недописанное убрано."
  recovery:
    reason: "Предел считается по ходу потока, а не после записи. Если такой размер штатный — сообщи владельцу предел {key}."
    owner: "Подними предел {key}, если такой размер штатный."

DOWNLOAD_TOO_SLOW:
  class: server_recoverable
  message_template: "Источник «{host}» отдаёт медленнее объявленного: {got} байт за {window_sec} с при пределе {floor} байт/с."
  recovery:
    reason: "Попытка потрачена: веса модели докачаются повтором с принятого, файл результата поставщика качается с начала. Повтори позже; такая скорость штатна — сообщи владельцу."
    owner: "Порог — speed_floor_bytes_per_sec политики загрузки: config/providers.yaml → local.install.fetch, config/media_tasks.yaml → download.fetch."

SECRET_ACCESS_DENIED:
  class: integrity
  message_template: "Каталог секретов закрыт: ключи провайдеров не читаются инструментами."
  recovery:
    reason: "Ключи канала инструментам недоступны: вносит их владелец. Что стоит — media_provider_status (отпечаток и дата, не значение)."

PROVIDER_KEY_MISSING:
  class: human_required
  message_template: "У провайдера «{provider}» нет ключа доступа для этого канала."
  recovery:
    suggested_tool: media_provider_status
    reason: "Ключ вносит владелец; что стоит — media_provider_status (отпечаток и дата, не значение). Пока ключа нет — поставь в строке канала провайдера без ключа (table_update)."

SECRET_UNREADABLE:
  class: human_required
  message_template: "Файл ключей канала не расшифровывается."
  recovery:
    reason: "Ключи канала не прочесть: сообщи владельцу — он внесёт их заново."
    owner: "Файл зашифрован ключом другого инстанса (чужой бэкап или утерян instance_secret.key): внеси ключи заново — python scripts/set_provider_key.py."

SECRET_ENCRYPTION_UNAVAILABLE:
  class: human_required
  message_template: "Шифрование недоступно: нет библиотеки cryptography."
  recovery:
    reason: "Сообщи владельцу: без шифрования ключи провайдеров сервер не хранит."
    owner: "Поставь зависимости сервера: pip install -e ."

DOWNLOAD_FORBIDDEN:
  class: integrity
  message_template: "Адрес «{host}» не пропущен: туда не уходят ни ключ, ни запрос (разрешён: {allowed})."
  recovery:
    reason: "Ключ и запрос уходят только на объявленные хосты, даже если адрес назвал сам провайдер. Проверь, что вернул провайдер, и столбец model строки канала — он подставляется в адрес вызова."
    owner: "Хосты: ключ — config/providers.yaml → online.http; результаты — config/media_tasks.yaml → download.fetch; веса — config/providers.yaml → local.install.fetch; колёса — config/packages.yaml → index.fetch."

PROVIDER_ADAPTER_MISSING:
  class: human_required
  message_template: "Для провайдера «{provider}» нет годного адаптера."
  recovery:
    suggested_tool: media_provider_status
    reason: "Поставь в строке канала провайдера, которого сервер умеет исполнять (что есть — media_provider_status), или сообщи владельцу."

RUNNER_NOT_RUNNING:
  class: ai_recoverable
  message_template: "Раннер локальных моделей не отвечает."
  recovery:
    suggested_tool: media_runner
    suggested_params: {action: start}
    reason: "Подними раннер: media_runner(action='start'); или переключи строку канала на провайдера, который считает в самом сервере (table_update)."

RUNNER_EXITED:
  class: human_required
  message_template: "Раннер вышел при подъёме: код {exit_code}."
  recovery:
    reason: "Причина — в журнале сервера под номером события: сообщи его владельцу. Пока раннер не поднимается, строку канала можно переключить на провайдера, который считает в самом сервере (table_update)."

RUNNER_PORT_TAKEN:
  class: human_required
  message_template: "Порт раннера «{url}» занят посторонним процессом: на /health отвечают, а наш раннер не запущен."
  recovery:
    reason: "Второй раннер на тот же порт не встанет: сообщи владельцу."
    owner: "Останови процесс, который слушает «{url}», или смени адрес раннера в config/providers.yaml → online.http (адрес Local_runner)."

RUNNER_TOKEN_REJECTED:
  class: server_recoverable
  message_template: "Раннер не принял токен сервера в заголовке «{header}»."
  recovery:
    suggested_tool: media_runner
    suggested_params: {action: stop}
    reason: "Токен в файле состояния сервера не совпал с токеном раннера: раннер поднят не этим сервером или файл состояния переписан. Останови раннер (media_runner, action=stop) и подними снова (action=start) — сервер выдаст и запишет новый токен."

DISK_SPACE_UNKNOWN:
  class: human_required
  message_template: "Хватит ли места под веса '{model}', не определить: свободное место на диске весов не прочитано."
  recovery:
    reason: "Вслепую сервер не качает, другая модель не поможет: сообщи владельцу — он проверяет диск весов."

MODEL_SIZE_UNKNOWN:
  class: human_required
  message_template: "Хватит ли места под веса '{model}', не определить: источник не назвал длину частей — {parts}. Спрошено: {asked}."
  recovery:
    suggested_tool: media_models
    reason: "Без длины каждой части место не проверить, а качать вслепую сервер не станет. Выбери модель, размер которой источник называет (media_models, scope='local'); иначе решает владелец — проверяет место сам и ставит модель вручную."

TASK_NOT_FOUND:
  class: ai_recoverable
  message_template: "Задание «{task_id}» не найдено."
  recovery:
    suggested_tool: task_status
    reason: "Идентификатор задания выдаёт его запуск (task_id в ответе). task_status без параметров покажет все живые и недавние задания."

TASK_INTERRUPTED:
  class: server_recoverable
  message_template: "Задание «{task_id}» ({tool}) прервано: итог работы не записан, исполнитель задание больше не держит."
  recovery:
    reason: "Повтори вызов {tool} с теми же параметрами — задание начнётся заново."

TASK_RECORD_INVALID:
  class: integrity
  message_template: "Запись задания «{path}» повреждена — не читается как запись задания."
  recovery:
    reason: "Это порча файла сервера, а не ошибка вызова: задание не восстановить. Повтори вызов; файл назван владельцу сервера, содержимое не показано."

TASK_CANCELLED:
  class: ai_recoverable
  message_template: "Задание «{task_id}» ({tool}) снято вызовом task_cancel."
  recovery:
    reason: "Снятие — решение вызывающего, а не сбой. Работа ещё нужна — повтори вызов {tool} с теми же параметрами."

TASK_FINISHED:
  class: ai_recoverable
  message_template: "Задание «{task_id}» уже кончилось ({status}) — снимать нечего."
  recovery:
    suggested_tool: task_status
    reason: "Исход задания — в task_status. Снятие действует только на задание, которое ждёт места или идёт."

TASK_FOREIGN:
  class: ai_recoverable
  message_template: "Задание «{task_id}» исполняет другой процесс — этот сервер его не снимет."
  recovery:
    suggested_tool: task_status
    reason: "Снять его может только исполнитель — другой сервер или скрипт владельца. Дождись исхода в task_status."

MODEL_NO_DISK_SPACE:
  class: human_required
  message_template: "Весам '{model}' нужно {need_mb} МБ, а на диске под веса свободно {free_mb} МБ."
  recovery:
    suggested_tool: media_models
    reason: "Освободи место либо выбери модель меньше: media_models(scope='local', fits=true) отдаёт только те, что влезают на эту машину."

LOCAL_MODEL_MISSING:
  class: human_required
  message_template: "Веса локальной модели '{model}' не найдены (ожидались в {path})."
  recovery:
    suggested_tool: media_models
    reason: "Веса не поставлены: что можно поставить — media_models (scope='local'), поставить — media_model_install; или переключи строку канала на другого провайдера (table_update)."
    owner: "Из терминала: python scripts/models.py install <id> --kind <вид>; поставленное по описи на другой машине вернёт python scripts/models.py pull."

MODEL_SOURCE_FAILED:
  class: server_recoverable
  message_template: "Источник весов «{host}» отказал: ответ {status}."
  recovery:
    suggested_tool: media_models
    reason: "Источник не отдал часть весов, а повтором такой ответ не лечится (перегрузку и недоступность сервер уже повторил сам). Уже скачанное лежит остатком; проверь модель у источника или поставь другую из media_models (scope='local')."

MODEL_REVISION_UNKNOWN:
  class: server_recoverable
  message_template: "Состояние репозитория '{model}' у «{host}» не узнать: ответ {status}."
  recovery:
    reason: "Ничего не скачано: без ревизии веса не тянутся. Повтори установку позже."
    owner: "Закрепи ревизию в config/providers.yaml → local.install.revisions — тогда источник о ней не спрашивается; повторяется — проверь сеть сервера."

MODEL_SOURCE_UNREACHABLE:
  class: server_recoverable
  message_template: "Источник «{host}» не ответил: состояние репозитория '{model}' не узнать."
  recovery:
    reason: "Ничего не скачано: повтори установку позже."

MODEL_SOURCE_FORBIDDEN:
  class: ai_recoverable
  message_template: "Источник весов «{source}» не объявлен разрешённым (разрешены: {allowed})."
  recovery:
    suggested_tool: media_models
    reason: "Веса — исполняемое содержимое: ставятся только из разрешённых источников. Выбери модель оттуда — media_models (scope='local')."
    owner: "Разрешённые источники — config/providers.yaml → local.install.allow_sources."

MODEL_TOO_LARGE:
  class: ai_recoverable
  message_template: "Модель '{model}' весит {mb} МБ при объявленном пределе {limit_mb} МБ."
  recovery:
    suggested_tool: media_models
    reason: "Возьми модель полегче: media_models (scope='local', fits=true)."
    owner: "Предел — local.install.max_total_mb в config/providers.yaml."

MODEL_NOT_IN_CATALOG:
  class: ai_recoverable
  message_template: "Модели '{model}' нет в каталоге {source}."
  recovery:
    suggested_tool: media_models
    reason: "Имя не из каталога источника. Посмотри доступные: media_models (scope='local')."
    owner: "Из терминала: python scripts/models.py local --kind <вид>."

MODEL_NAME_TAKEN:
  class: human_required
  message_template: "Имя '{model}' ({kind}) уже занято моделью {held_by}: веса двух репозиториев легли бы в один каталог."
  recovery:
    suggested_tool: media_models
    reason: "Модель ищется по короткому имени (столбец model строки канала), а у этой оно совпало с уже поставленной из другого репозитория — вторая перезаписала бы первую. Поставить её можно, только если владелец уберёт поставленную; другую модель посмотри в media_models(scope='local')."

MODEL_GATED:
  class: ai_recoverable
  message_template: "Модель '{model}' закрыта автором (gated): ставится только с доступом, выданным автором."
  recovery:
    suggested_tool: media_models
    reason: "Выбери открытую модель того же вида: media_models(scope='local')."

MODEL_FORMAT_MISSING:
  class: ai_recoverable
  message_template: "У модели '{model}' нет файла нужного формата ({formats})."
  recovery:
    suggested_tool: media_models
    reason: "Модель этого вида ставится одним файлом графа объявленного формата. Выбери другую: media_models(scope='local')."

MODEL_UNLOADABLE:
  class: ai_recoverable
  message_template: "Веса модели '{model}' лежат, но не поднимаются в процесс."
  recovery:
    suggested_tool: media_model_install
    reason: "Веса битые, неполные или чужого формата: перекачай модель тем же именем (media_model_install); причина — в журнале сервера под номером события."
    owner: "Из терминала: python scripts/models.py pull <id>."

MODEL_INCOMPLETE:
  class: human_required
  message_template: "Веса локальной модели лежат не целиком."
  recovery:
    suggested_tool: media_models
    reason: "Загрузка оборвалась: повтори установку (media_model_install) — докачается недостающее; или переключи строку канала на другого провайдера (table_update)."
    owner: "Из терминала: python scripts/models.py pull <id> — по плану разницы, только недостающее."

MODEL_CORRUPT:
  class: integrity
  message_template: "Веса локальной модели расходятся с объявленным составом."
  recovery:
    suggested_tool: media_models
    reason: "Файл испорчен или подменён — поднимать его нельзя: перекачай модель (media_model_install, force=true)."
    owner: "Из терминала: python scripts/models.py pull <id> заменит расходящиеся части."

MODEL_UNVERIFIED:
  class: human_required
  message_template: "Целость весов локальной модели судить нечем."
  recovery:
    suggested_tool: media_models
    reason: "Состав модели не снят — сверить диск не с чем: сообщи владельцу."
    owner: "python scripts/models.py pull <id> снимет состав с источника и сверит диск; веса, положенные руками, пускает local.hand_placed в config/providers.yaml."

USAGE_UNIT_UNKNOWN:
  class: human_required
  message_template: "Единица расхода из строки провайдера не объявлена."
  recovery:
    reason: "Сообщи владельцу: неизвестная единица расхода нулём не считается — иначе лимит не наступил бы никогда."
    owner: "Объяви единицу в config/providers.yaml → usage.units."

RECALC_UNAVAILABLE:
  class: human_required
  message_template: "Движок пересчёта формул (LibreOffice) на сервере не найден."
  recovery:
    reason: "Сообщи владельцу: проверка формул идёт только реальным пересчётом, без LibreOffice её нет."

RECALC_TIMEOUT:
  class: ai_recoverable
  message_template: "Пересчёт формул не уложился в {timeout_sec} с."
  recovery:
    reason: "Повтор той же книги упрётся в тот же срок: раздели книгу на части и проверь их по отдельности."

RECALC_FAILED:
  class: ai_recoverable
  message_template: "Движок пересчёта не вернул вычисленную книгу (код выхода {exit_code})."
  recovery:
    reason: "Повтор без правки книги даст то же: проверь, что книга открывается; открывается — передай владельцу номер события."

# ═══ Структура: реестр связей / ORPHAN ═══

ENTITY_NOT_FOUND:
  class: ai_recoverable
  message_template: "Сущность не найдена в реестре связей."
  recovery:
    suggested_tool: "structure_status"
    reason: "Проверь имя/тип через structure_status; при необходимости создай через structure_create."

RECONCILE_ROLLED_BACK:
  class: ai_recoverable
  message_template: "Reconcile откачен целиком: ни одна сущность не сдвинута."
  recovery:
    suggested_tool: "structure_status"
    reason: "Помеха — в facts.path (путь занят или каталога нет): убери её и повтори."

# ═══ Поиск (core/search) ═══

QUERY_NOT_FOUND:
  class: ai_recoverable
  message_template: "Файл запроса не найден."
  recovery:
    reason: "Проверь путь к .yaml-запросу внутри workspace или создай его."

PATH_NOT_FOUND:
  class: ai_recoverable
  message_template: "Каталога «{path}» нет."
  recovery:
    reason: "Проверь путь внутри workspace (регистр важен)."

# ═══ Анализ данных ═══

SCHEMA_INVALID:
  class: human_required
  message_template: "Декларация таблицы некорректна: {details}"
  recovery:
    reason: "Сообщи владельцу: схема книги нарушает формат и автоматически не чинится."
    owner: "Схема книги — config/templates/tables/*.schema.yaml, формат — spec/TABLE_SCHEMA_FORMAT.md."

DECLARATION_MISSING:
  class: human_required
  message_template: "Нет объявления {subject}: «{file}»."
  recovery:
    reason: "Сообщи владельцу: без этого объявления операция не идёт."
    owner: "Заведи «{file}» в каталоге деклараций (MCP_CONFIG, иначе config/ сервера)."

DECLARATION_INVALID:
  class: human_required
  message_template: "Декларация {file} не прошла проверку схемы: {details}."
  recovery:
    reason: "Сообщи владельцу: объявление сервера нарушает свою схему — что и где, в errors."
    owner: "Поправь {file} в каталоге деклараций (MCP_CONFIG, иначе config/ сервера): каждое названное поле — по схеме декларации (ключ, тип, обязательность, связь с другими ключами); значения в ответ не идут — смотри их в самом файле."

# ═══ Проверка целостности ═══

DUPLICATE_ID:
  class: ai_recoverable
  message_template: "ID '{id}' уже занят сущностью типа '{type}'"
  recovery:
    suggested_tool: "structure_check_integrity"
    reason: "Проверь реестр на дубликаты или сгенерируй новый ID."

DUPLICATE_PATH:
  class: ai_recoverable
  message_template: "Путь '{path}' уже принадлежит сущности {id}"
  recovery:
    suggested_tool: "structure_resolve"
    suggested_params: { path: "{path}" }
    reason: "Структура здесь уже создана — переиспользуй существующий ID, а не заводи второй. structure_resolve покажет, кто владеет каталогом."

CHAIN_UNRESOLVED:
  class: ai_recoverable
  message_template: "Каталоги-предки не зарегистрированы: {paths}"
  recovery:
    suggested_tool: "structure_resolve"
    suggested_params: { path: "{path}" }
    reason: "Структура на диске опережает реестр. Посмотри цепочку через structure_resolve и усынови предков (adopt=true) либо выбери другой каталог — сервер не выдумывает ID за существующие каталоги."

TEMPLATE_INVALID:
  class: human_required
  message_template: "Шаблон объявлен неверно: {reason}"
  recovery:
    reason: "Сообщи владельцу: шаблон сервера объявлен неверно — данные клиента тут ни при чём."
    owner: "Правится в config/templates/workspace/*.tpl.yaml (блок id: с prefix и ancestors)."

FOREIGN_WRITE:
  class: integrity
  message_template: "Артефакт подписан другим сервером или изменён извне: {path}"
  recovery:
    suggested_tool: "structure_check_integrity"
    suggested_params: { }
    reason: "Состояние НЕ изменено. Кто-то ещё пишет в этот workspace (второй сервер, другой агент, ручная правка). Проверь целостность, восстанови файл из бэкапа или подтверди присвоение запуском server.py --re-adopt."

MACHINE_MISMATCH:
  class: integrity
  message_template: "Рабочая область создана на другой машине (отпечаток не совпал)"
  recovery:
    suggested_tool: "structure_check_integrity"
    reason: "Чтение доступно, запись заблокирована. Если это ваш перенос — смена железа, переезд VM, восстановление из бэкапа — подтвердите его: server.py --re-adopt."

FILE_TYPE_FORBIDDEN:
  class: human_required
  message_template: "Запись файлов этого типа запрещена: {path}"
  recovery:
    reason: "Исполняемое и веб-содержимое (.sh/.html/.exe/.bat) сервер не создаёт: выбери объявленный тип — данные, книги, документы, ассеты, .py."
    owner: "Список типов — config/firewall.yaml → write_allowlist."

FILE_TOO_LARGE:
  class: ai_recoverable
  message_template: "Файл {path} больше объявленного предела: {size} байт при пределе {limit}."
  recovery:
    reason: "Файл на диске не тронут. Запись — раздели содержимое на несколько файлов; чтение целиком (память) — такой файл разбирает человек; fs_read_file отдаёт его голову с пометкой truncated."
    owner: "Пределы — config/firewall.yaml → file_limits."

RESULT_TOO_LARGE:
  class: ai_recoverable
  message_template: "Ответ {tool} — {chars} знаков ({bytes} байт UTF-8) — {load}% бюджета ответа клиентов этой установки: целиком клиент его не примет."
  recovery:
    reason: "Работа сделана, не доставлен только ответ. Сузь запрос: каталог глубже, меньше строк, поиск точнее; файл — страницами: fs_read_file с offset из next_offset прошлого ответа."
    owner: "Пределы клиентов — config/transport.yaml → clients; какие клиенты у установки — install.yaml."

LINE_TOO_LONG:
  class: ai_recoverable
  message_template: "Строка {line} файла {path} длиннее {limit} символов — столько сервер держит в памяти разом."
  recovery:
    reason: "Сплошной текст без переводов строки (минифицированный JSON и подобное) читается страницами — fs_read_file с offset; формат со структурой — по разделу."
    owner: "Предел — память процесса на одно место поиска: config/resources.yaml → work.search."

FILE_NOT_TEXT:
  class: ai_recoverable
  message_template: "Файл {path} — не текст в UTF-8, текстом его не прочитать."
  recovery:
    suggested_tool: fs_get_directory_tree
    reason: "Это бинарный файл (картинка, звук, книга) или текст в другой кодировке. Текстовые инструменты читают только UTF-8; размер и место файла видны в дереве каталога."

NO_DISK_SPACE:
  class: human_required
  message_template: "Запись {path} не помещается на диск сервера: {size} байт при свободных {free}."
  recovery:
    reason: "Место проверено до записи, файл на диске не тронут. Освободить место на диске сервера может только человек: сервер чужое не удаляет."

CONFIRM_REQUIRED:
  class: ai_recoverable
  message_template: "Действие не отменить — {operation} «{target}»: нужно подтверждение."
  recovery:
    reason: "Повтори тот же вызов с {param}=true, если это действительно нужно."

# ═══ Монтаж: сборка, запуск и приёмка рендера ═══

FFMPEG_MISSING:
  class: human_required
  message_template: "Нечем монтировать: ffmpeg не найден в PATH."
  recovery:
    reason: "Сообщи владельцу: без ffmpeg ни один инструмент монтажа не работает."
    owner: "ffmpeg — системный бинарь, а не пакет pip: поставь его пакетным менеджером (dnf/apt/brew)."

FILTER_UNKNOWN:
  class: ai_recoverable
  message_template: "Имя перехода или фильтра не объявлено: {name}"
  recovery:
    suggested_tool: "fs_read_file"
    suggested_params: { path: "config/ffmpeg_filters.yaml" }
    reason: "Словарь монтажа закрыт намеренно: незнакомое имя из книги в фильтрограф не уходит. Возьми имя из словаря или заведи его там."

RENDER_PROFILE_INVALID:
  class: ai_recoverable
  message_template: "Профиль рендера просит невозможное: {reason}"
  recovery:
    suggested_tool: "table_get_row"
    suggested_params: { sheet: "RENDER_CONFIG" }
    reason: "Кодек, разрешение или частота кадров в строке профиля не исполнимы этим ffmpeg. Почини строку профиля в книге канала."

RENDER_INPUT_UNPREPARED:
  class: ai_recoverable
  message_template: "Ассет не подготовлен к наложению: {path}"
  recovery:
    suggested_tool: "media_generate"
    reason: "Снятие фона нейросетью делает провайдер ДО монтажа: ffmpeg режет фон только по цвету. Подготовь ассет и подставь готовый файл."

VARIANT_INCOMPATIBLE:
  class: ai_recoverable
  message_template: "Вариант не годится в этот слот: {reason}"
  recovery:
    suggested_tool: "table_find_row"
    suggested_params: { sheet: "ASSET_VARIANTS" }
    reason: "Сочетаемость проверяется двумя ячейками: ключ оси (обычно ракурс) обязан совпасть с ключом вариантов родительского слота, а размер варианта — влезть в его рамку. Возьми подходящий вариант из каталога или сгенерируй недостающий и заведи строкой."

SCENE_EMPTY:
  class: ai_recoverable
  message_template: "В сцене нет ни одного элемента: {scene_id}"
  recovery:
    suggested_tool: "table_append"
    suggested_params: { sheet: "SCENE_ELEMENTS" }
    reason: "Рендерить нечего. Разложи фрагменты сцены по строкам листа элементов: строка = слой, в ней ассет, положение, размер и время появления."

RENDER_FAILED:
  class: human_required
  message_template: "ffmpeg отказался собирать: {reason}"
  recovery:
    reason: "Причину называет сам ffmpeg последней строкой. Смотри её: чаще всего это несовместимые параметры ассета и профиля."

RENDER_UNVERIFIED:
  class: integrity
  message_template: "Файл собран, но приёмка его не подтверждает: {reason}"
  recovery:
    reason: "ffprobe не нашёл в результате того, что обещал профиль (поток, длительность, размер кадра). Файл есть, но считать его готовым нельзя — это немая потеря, поэтому отказ."

# ═══ Среда расчёта: пакеты (core/packages) ═══

PACKAGE_GROUP_UNKNOWN:
  class: human_required
  message_template: "Группы пакетов не объявлены в проекте: {groups}."
  recovery:
    reason: "Объявленные группы: {known}. Нужна другая — сообщи владельцу."
    owner: "Группа среды расчёта для карты — config/providers.yaml → local.gpu.drivers[<драйвер>].extras; обязана быть в pyproject.toml → project.optional-dependencies."

PACKAGE_INSTALL_FAILED:
  class: human_required
  message_template: "Установщик пакетов вернул {exit_code}, не поставив: {requirements}."
  recovery:
    reason: "Вывод установщика — в журнале сервера. Частые причины: индекс недоступен, нет колеса под эту платформу, конфликт версий. Повтор поставит только то, чего по-прежнему нет."

PACKAGE_INSTALL_INCOMPLETE:
  class: human_required
  message_template: "Установщик завершился успешно, но среда всё ещё не по требованиям: {requirements}."
  recovery:
    reason: "Суд после установки видит не то, что заказано (версия вне требования, пакет не появился). Сверь, в какой интерпретатор шла установка, и повтори."

PACKAGE_INDEX_FAILED:
  class: server_recoverable
  message_template: "Индекс пакетов «{host}» не назвал длину колеса: {status}."
  recovery:
    reason: "Колесо вошло в цену установки без размера — итог больше посчитанного."
    owner: "Адрес колеса дал отчёт pip (PyPI или index драйвера в config/providers.yaml → local.gpu.drivers); как спрашивается индекс — config/packages.yaml → index.fetch."

# ═══ Туннель: бинарь клиентского конца (установщик, scripts/fetch_tunnel_binary.py) ═══

TUNNEL_BINARY_UNAVAILABLE:
  class: human_required
  message_template: "Для системы {system} и архитектуры {arch} готового бинаря туннеля нет."
  recovery:
    reason: "Готового бинаря нет: выбери роль без туннеля (клиент консоль на этой машине) или сообщи владельцу."
    owner: "Поставь бинарь туннеля вручную по пути каталога: config/tunnel_diagnostics.yaml → бинари."

TUNNEL_BINARY_SOURCE_FAILED:
  class: server_recoverable
  message_template: "Источник бинаря туннеля «{host}» отказал: {status}."
  recovery:
    reason: "Повтори установку позже: оборванная загрузка докачается с места обрыва."
    owner: "Повторяется — проверь связь машины с источником или поставь бинарь вручную по пути каталога (config/tunnel_diagnostics.yaml → бинари)."

TUNNEL_BINARY_CORRUPT:
  class: integrity
  message_template: "Бинарь туннеля принят не полностью: {got} байт из {expected}."
  recovery:
    reason: "Остаток снят — повтор установки начнёт загрузку заново. Повторяется — источник отдаёт не тот файл: поставь бинарь вручную."

# ═══ Fallback: код, которого нет в реестре, приезжает клиенту этой записью и этим кодом ═══

UNKNOWN_ERROR:
  class: unknown
  message_template: "Непредвиденная ошибка."
  recovery:
    reason: "Нет протокола реакции для этого кода — требуется решение человека."
