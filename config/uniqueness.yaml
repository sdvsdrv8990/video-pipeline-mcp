# uniqueness.yaml — параметры расчёта уникальности (воркстрим A7.2, doc `10 §2`).
#
# Решение владельца S15: совпадение слов/предложений считает ЛОКАЛЬНЫЙ скрипт (n-gram/shingling,
# без внешнего API — как STT), управляемый этим `.yaml`, который ИИ настраивает сам. Здесь живут
# ВСЕ числа и имена: в коде расчёта не должно быть ни одного типа фрагмента, веса или порога.
#
# Per-project override: копия этого файла в `<проект>/.templates/` перекрывает серверный дефолт
# (тот же механизм, что у шаблонов структуры — `core/engine/template_resolver.py`).

ngram:
  size: 4                     # окно шингла В СЛОВАХ: 4 — фраза, а не отдельное слово
  metric: jaccard             # jaccard (симметрично) | containment (сколько нового текста)
  lowercase: true
  strip_punctuation: true

thresholds:
  alert_below: 0.60           # ниже — сигнал в петлю решений (`10 §3`)
  critical_below: 0.40        # ниже — приоритетный сигнал

# Что ТРЕБУЕТСЯ для каждой оценки. Нет входа → расчёт не выдумывается, а честно неполон:
# в ответе перечисляется, чего не хватает. Это и есть «все данные есть» vs «чего-то нет».
scores:
  script_score:
    label: "уникальность живого текста патерна"
    needs: [text, corpus]     # текст применения + прошлые применения той же структуры
  scene_score:
    label: "уникальность сцены по составу фрагментов"
    needs: [fragments, profile]
    # Активные типы фрагментов и их веса берутся ИЗ ДАННЫХ канала, а не отсюда:
    # лист профиля перечисляет типы, «тихий столбец» enabled гасит поведение, не структуру.
    profile:
      sheet: SCENE_PROFILE
      type_column: fragment_type
      enabled_column: enabled
      weight_column: niche_weight

# Итоговая композиция. Слагаемые — имена оценок выше; добавить оценку = строка здесь, не ветка в коде.
composition:
  full_scene_uniqueness:
    script_score: 0.5
    scene_score: 0.5

# Нечего мерить — честный ноль, а не «100% уникально»: пустой вход не является достижением
# (`10 §7`: меряем и заглушки, честно нулём при пустом входе).
empty_input: 0.0

# ОТКУДА брать входы в данных проекта (`read.json` — источник правды, OQ-B3). Инструмент
# читает объявленное; нет листа или столбца → вход считается ОТСУТСТВУЮЩИМ и называется поимённо,
# а не подставляется пустой строкой. Так «всё есть» отличается от «чего-то нет» по факту, а не на глаз.
sources:
  text:
    sheet: SCRIPT_PATTERNS_USED     # применение структуры, которое меряем
    column: pattern_description
    row_id: null                    # задаёт вызывающий; пусто → берём все строки листа
  corpus:
    sheet: SCRIPT_PATTERNS_USED     # прошлые применения ТОЙ ЖЕ структуры
    column: pattern_description
    exclude_current: true
  fragments:
    sheet: ASSETS_USED              # что использовано в сцене
    type_column: asset_type
    id_column: asset_id
  profile:
    sheet: SCENE_PROFILE            # лист конфига канала (S22): типы, тумблер, веса
    # Профиля может не быть в данных проекта, пока книга не заполнена. Тогда берём дефолт
    # из декларации книги — и ГОВОРИМ об этом (`profile_source`), а не выдаём за данные канала.
    fallback_book: channel_data

# Куда писать результат (`10 §2`: число живёт в данных, не в формуле Excel).
target:
  sheet: UNIQUENESS
  column: script_score
  composed_column: full_scene_uniqueness
