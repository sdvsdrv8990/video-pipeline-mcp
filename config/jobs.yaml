# jobs.yaml — узел заданий сервера: долгая работа инструмента идёт заданием со своим id и статусом.
#
# id задания выдаёт и судит одна точка (`core/jobs.py`) по форме ниже: установщик моделей и любой другой потребитель
# не держат свою длину и свой алфавит. id становится именем файла записи задания; путь судит слой файлов
# (`Files.place`), а не эта форма. Длина 12 по 16 знакам — 48 бит случайности: чужой id перебором не угадать.

id:
  alphabet: "0123456789abcdef"
  length: 12

# Записи заданий — каталог от дома инстанса (`MCP_HOME` или родитель каталога деклараций), вне рабочей области ИИ
# (не в git): файл `<id>.json` на задание.
store: vendor/tasks
# Сколько хранится задание после конца (completed, failed); старше — запись убирается при чтении списка.
# 24 ч — нижняя граница хранения статуса операции у Azure (vNext guidelines, Long-running operations).
retain_sec: 86400
# Живой исполнитель, который не подаёт признака работы дольше, — простой (TASK_STALLED); тот же срок ждёт работа
# чужой замок (установка той же модели) и установка из CLI — один ключ простоя на сервер. Обязан быть длиннее законной
# тишины загрузчика весов (providers.yaml local.install.fetch); связь двух деклараций судит дверь — открытый пункт 4b.
stale_after_sec: 300
# Повтор того же вызова (инструмент, аргументы, решение строки канала; секреты не в счёт) в этом окне от запуска —
# тот же id задания: идущее или готовое не заводится второй раз, а платная задача у провайдера остаётся одна.
# Кончившееся отказом заводится заново. Окно не длиннее retain_sec: запись должна дожить до конца окна.
# 600 с — своя политика: повтор клиента после обрыва связи; замера нет.
dedupe_window_sec: 600
