# resources.yaml — чем занят вызов и можно ли снимать его с цикла событий.
#
# Хендлеры объявлены `async`, но работу делают синхронно, и тяжёлый вызов замораживает ВЕСЬ сервер:
# создание дерева идёт ~37 с, и `tools/list` рядом ждёт столько же. Снятие с цикла объявляется здесь,
# а не ветками в коде: новый тяжёлый инструмент — строка тут, а не правка движка.
#
# `offload: true` — вызов уходит в отдельный поток со своим циклом. Безопасно, пока общее состояние под
# замками: тела хендлеров синхронны (ни одного `await` внутри); очередь `StateManager` — его замок,
# чтение—правка—запись снимка — только `StateManager.edit_snapshot` (замок пути снимка на процесс), у
# `LinkRegistry` — свой замок. Писатель снимка мимо `edit_snapshot` теряет запись соседа в соседнем потоке.
# `max_concurrent` — сколько вызовов класса идут одновременно. Перебор НЕ ждёт: ожидание внутри
# вызова за пределом клиента даёт отказ без кода и без рецепта, то есть немой отказ; вместо этого
# приходит `RESOURCE_BUSY` и `retry_after_sec` в фактах — решение о повторе принимает вызывающий.

default: inline

classes:
  inline:                 # считаные миллисекунды: поток дороже самой работы
    offload: false
  cpu_heavy:              # внешний бинарь, материализация книг, обход диска с чтением
    offload: true
    max_concurrent: 4
    retry_after_sec: 30   # столько идёт типовая тяжёлая работа — раньше повторять незачем
  network:                # ожидание ответа источника моделей (huggingface.co) и снимок железа (nvidia-smi до 10 с)
    offload: true
    max_concurrent: 2     # клиент зовёт инструменты по одному; два места — список рядом с запуском установки
    # media_models со списком и описаниями — до ~60 запросов (список, model_info и README на строку при limit 20),
    # ответ huggingface.co 0,46–1,37 с (замер 2026-10-05) — около 30 с на вызов; раньше место не освободится.
    retry_after_sec: 30
  control:                # снятие заданий: запись статуса со сбросом каталога и сигнал работе — с цикла событий снято
    offload: true
    max_concurrent: 2     # свои места: снятие не ждёт за тяжёлыми вызовами cpu_heavy
    retry_after_sec: 1    # не мерено: снятие — запись одного файла и сигнал

tools:
  # ── Монтаж: рендер через внешний бинарь и сборка сцены ──
  montage_render_scene: cpu_heavy
  montage_generate_scene: cpu_heavy
  montage_scene_script: cpu_heavy

  # ── Структура: материализация деревьев и книг ──
  structure_create: cpu_heavy
  structure_migrate: cpu_heavy
  structure_reconcile: cpu_heavy
  structure_check_integrity: cpu_heavy

  # ── Таблицы и книги: пересчёт формул и запись xlsx ──
  json_execute_queue: cpu_heavy
  excel_create_workbook: cpu_heavy
  excel_validate_formulas: cpu_heavy

  # ── Поиск: обход диска с чтением содержимого ──
  fs_search_yaml: cpu_heavy
  fs_search_multi: cpu_heavy
  search_tables: cpu_heavy
  search_multi: cpu_heavy
  search_quick: cpu_heavy           # та же работа (QueryPlanner.execute_plan, пул поиска): без строки шла на цикле событий

  # ── Медиа: генерация — задание узла (AD-20 б): вызов только ставит его, работа ждёт место work.generate ──
  media_generate: control
  media_runner: control             # статус, стоп, постановка подъёма — управление; подъём — задание без места (AD-20 б)

  # ── Медиа: каталог и установка моделей — сеть источника и снимок железа ──
  media_models: network
  media_model_install: network      # сам вызов: манифест источника и место на диске; загрузка — задание, класс model_download
  media_install_status: cpu_heavy   # сети нет: обход хранилища заданий с чтением записей

  # ── Задания: статус и ожидание его смены — без мест (ожидание не работа: событие узла, записи — в потоке пула);
  #    снятие — свои места control ──
  task_status: inline
  task_cancel: control

# Места внутренней работы сервера — внутри одного вызова инструмента или задания узла; читает их узел ёмкости
# (core/capacity.py). Клиенту «занято» они не отвечают: задание ждёт место в очереди со статусом pending.
work:
  describe:               # описания строк каталога: model_info и README на строку (ModelCatalog._enrich)
    max_concurrent: 8     # не мерено: прежнее значение catalog.py `or 8`; замер — одновременных запросов до 429 хаба
  search:                 # параллельный поиск по диску и таблицам (FsSearcher, QueryPlanner)
    max_concurrent: 4     # не мерено: прежнее умолчание сигнатур max_workers=4; замер — время поиска от числа потоков
  render:                 # рендер сцены заданием узла (montage_render_scene): ffmpeg минутами, упирается в ядра
    max_concurrent: 1     # не мерено: один рендер берёт все ядра процесса (-threads — доля Capacity.share); два делят
                          # их без выигрыша, второй ждёт (pending), а места cpu_heavy остаются вызовам
  generate:               # генерация заданием узла (media_generate): локальная модель на карте или задача провайдера
    max_concurrent: 1     # карта одна: второй расчёт на ней — CUDA OOM, а не очередь; вторая генерация ждёт (pending).
                          # Онлайн-провайдеры идут той же очередью — разделение не мерено
  model_download:         # загрузка весов заданием установки (ModelInstaller): минуты, упирается в полосу источника
    max_concurrent: 1     # две загрузки делят одну полосу без выигрыша; вторая установка ждёт (pending), а места
                          # network остаются вызовам: установка на network держала бы их минутами (capacity.py take)
