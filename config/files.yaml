# files.yaml — слой файлов сервера (`core/paths.py`, экспертиза fs-layer): объявленная политика двери к диску.

# Замена файла (`os.replace` остатка на место, FS-06) на Windows бывает отказана временно: свежезаписанный файл держит
# антивирус (Defender открывает его на проверку) или читатель без FILE_SHARE_DELETE — ERROR_ACCESS_DENIED (5),
# ERROR_SHARING_VIOLATION (32). Тогда замена повторяется циклом сервера (`core/retry.py`) в пределах срока; на прочих ОС
# отказ доступа — настоящий запрет прав, без повтора. Замер 21.10 на Windows Server 2025 Evaluation (test_jobs, без
# повтора): с Defender — 10 отказов замены записи задания за прогон, без Defender — 2.
# Числа — у pip 26.2.2 (`src/pip/_internal/utils/filesystem.py:71`: `retry(stop_after_delay=1, wait=0.25)(os.replace)`):
# срок 1 с, пауза 0,25 с без роста (потолок паузы равен ей). Добавка 0,2 — разброс gRPC (gRFC A6), чтобы повторы
# соседних писателей не совпадали (WC-03). Попыток — сколько уложится в срок: 5 — защита от мгновенных отказов (WC-01).
замена:
  within_sec: 1.0
  attempts: 5
  backoff_sec: 0.25
  backoff_max_sec: 0.25
  jitter: 0.2
