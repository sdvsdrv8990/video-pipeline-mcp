# tunnel_diagnostics.yaml — каталог проверок туннеля. Читатель — core/transport/diagnostics.
#
# Диагностика по умолчанию ВЫКЛЮЧЕНА и включается на время прогона: постоянного наблюдения за
# трафиком нет, обычной нагрузки туннеля она не добавляет.
#
# Режимы:
#   быстрая — не создаёт трафика сверх одного запроса по публичному адресу
#   полная  — гоняет объявленный ниже тестовый поток и убирает за собой

# Тестовый поток. Метка делает его однозначно отличимым от пользовательского трафика; больше в
# потоке ничего нет по устройству — ни пользовательских данных, ни ключей, ни секретов.
поток:
  метка: VP-MCP-DIAGNOSTIC-TEST
  поля: [метка, id, время, сумма]

# Порядок здесь И ЕСТЬ порядок прогона: соединение спрашивают после того, как доказаны
# конфигурация и компоненты, иначе отказ назовёт следствие вместо причины.
проверки:
  - id: конфигурация
    что: Конфигурация
    доказывает: объявление туннеля читается, режим и порт известны
    режим: быстрая
  - id: компоненты
    что: Компоненты туннеля
    доказывает: бинарь объявленного конца на месте и отвечает своей версией
    режим: быстрая
  - id: служба
    что: Служба
    доказывает: процесс туннеля жив и рёбра зарегистрированы
    режим: быстрая
  - id: соединение
    что: Соединение
    доказывает: запрос по публичному адресу доходит до нашего процесса, а не гаснет на краю
    режим: быстрая
  - id: поток_до
    что: Поток до серверной обработки
    доказывает: тестовый поток собран, метка и сумма сняты на выходе клиента
    режим: полная
  - id: поток_после
    что: Поток после серверной обработки
    доказывает: на приёме тот же поток — сумма сошлась, обработка ничего не потеряла
    режим: полная
  - id: уборка
    что: Уборка
    доказывает: временные файлы прогона снесены, диагностика выключена
    режим: полная

# Прозвонка публичного адреса (проверка «соединение», core/transport/tunnel.py probe) — загрузчиком сервера
# (Fetcher.status: код и заголовки без тела). Хоста здесь нет: он один — хост своего публичного адреса туннеля
# (named — объявленный hostname, quick — разобранный хост целиком в зоне quick-туннеля). Запрос идёт на публичный
# край Cloudflare, и тот возвращает его через туннель: внутренняя сеть закрыта (block_private), со своей петлёй
# сервер не соединяется. Здесь, а не в tunnel.yaml: тот лежит в .gitignore (секреты) и с репозиторием не едет.
прозвонка:
  schemes: [https]
  block_private: true
  timeout_sec: 8                # одна фаза запроса — как было в коде прозвонки
  deadline_sec: 16              # вся прозвонка — прежнее худшее время (2 × 8 с)
  redirects: 0                  # ответ перехода — тоже улика, кто ответил: по переходу не идём
  attempts: 1                   # одна улика: повтор спрятал бы мигание пути
  backoff_sec: 0.5              # при attempts 1 пауз нет
  backoff_max_sec: 8
  retry_after_max_sec: 120
  jitter: 0.25
  retry_on: []                  # код ответа — улика (кто ответил: край или наш процесс), а не повод повторять
  codes: {failed: PROVIDER_FAILED}

# Какой бинарь доказывает объявленный конец туннеля. Ключ — значение `tunnel` из install.yaml.
концы:
  client: [cloudflared]
  server: [xray]
  both: [cloudflared, xray]
  none: []

# Где искать бинарь и чем спросить его версию. Путь в дереве проверяется до PATH.
бинари:
  cloudflared:
    в_дереве: bin/cloudflared
    версия: ["--version"]
  xray:
    в_дереве: /opt/vpm-tunnel/xray
    версия: ["version"]
