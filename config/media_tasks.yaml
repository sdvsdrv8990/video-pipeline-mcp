# media_tasks.yaml — цикл ожидания асинхронной задачи провайдера: ЧТО, ПОЧЕМУ и ЗАЧЕМ.
#
# ЧТО. Часть провайдеров отвечает не результатом, а идентификатором задачи (`sync_mode: false`
# в строке провайдера): trigger → task_id → poll → download. Здесь объявлено, как сервер ждёт.
#
# ПОЧЕМУ ЗДЕСЬ, А НЕ В КОДЕ. Интервалы и терпение у провайдеров разные, и меняются они чаще, чем
# код: у картинок ожидание секунды, у длинной озвучки — минуты. Правка числа не должна быть
# правкой Python и перезапуском сервера.
#
# ЗАЧЕМ ВООБЩЕ. Цикл прозванивает статус — локальную модель или API провайдера, смотря чем
# исполняется ресурс. Главное здесь не «дождаться готового», а ПОЙМАТЬ ОТКАЗ: онлайн-модель
# заворачивает запрос по десятку причин (модерация, лимит на стороне провайдера, недоступность,
# невалидный вход), и без прозвонки это молчание. Цикл ловит причину и отдаёт её ИИ — анализировать
# и решать, что делать дальше. Побочно уходят лишние round-trip'ы через туннель.
#
# ⚠️ ЭТО НЕ ПЛАНИРОВЩИК. Решение владельца в силе: демона на сервере нет. Цикл — часть вызова,
# в фоне между запросами клиента ничего не «тикает». Отсюда честная граница: если клиент отвалился,
# задача НЕ подхватывается — она остаётся на стороне провайдера, и её статус надо прозвонить заново.

poll:
  interval_sec: 3             # пауза между опросами
  backoff: 1.5                # множитель паузы: провайдер под нагрузкой не любит частый опрос
  max_interval_sec: 30        # выше не поднимаемся — иначе готовый результат ждёт впустую
  timeout_sec: 300            # общий предел ожидания; дальше — честный отказ, не бесконечность
  max_attempts: 60            # второй предел: защита от провайдера, который отвечает мгновенно

# Какие ответы провайдера чем считать. Имена статусов у провайдеров разные — поэтому список,
# а не ветка в коде: новый провайдер = новые слова здесь.
statuses:
  done: [completed, succeeded, success, finished, ready]
  failed: [failed, error, cancelled, canceled, rejected]
  # всё остальное считается «ещё выполняется» — неизвестный статус не обрывает ожидание молча,
  # но и не выдаётся за успех: он попадает в отчёт как `unknown_status`.

# ЗАГРУЗКА РЕЗУЛЬТАТА. Провайдер отдаёт ссылку — файл надо положить в рабочую область и убедиться,
# что он ДЕЙСТВИТЕЛЬНО там. «Скачали» без проверки — самый частый способ получить пустой файл.
download:
  # Путь считается годным только внутри workspace: ссылка приходит извне и адресом доверять
  # нельзя. Имя и содержимое проходят тот же allowlist, что и любая запись.
  verify:
    exists: true              # файл появился на диске
    min_bytes: 1              # нулевой размер = загрузки не было, даже если код ответа 200
    match_declared_size: true # если провайдер назвал размер — сверяем с фактическим
  # Расширение берётся из строки провайдера (`response_format`), а не угадывается из URL:
  # ссылка может не иметь расширения вовсе.
  format_column: response_format
  # Сама загрузка. Ссылку даёт провайдер — значит она приходит извне, и сервер идёт по ней
  # с той же опаской, что и по любому чужому вводу. Тянет один загрузчик сервера
  # (core/providers/download.py, Fetcher) — политика той же формы, что у весов (providers.yaml →
  # local.install.fetch): адрес судится на каждом переходе, предел — по ходу записи, ключ поставщика
  # по ссылке на файл не уходит.
  fetch:
    # Где в ответе задачи лежит ссылка: у каждого провайдера поле называется по-своему,
    # поэтому список, а не ветка в коде. Берётся первое найденное.
    url_fields: [url, result_url, output_url, file_url, audio_url, image_url]
    schemes: [https]            # http без шифрования = ссылку и файл видит любой посредник
    hosts: []                   # CDN поставщика заранее не известен: любой публичный хост
    block_private: true         # ссылка во внутреннюю сеть достала бы то, до чего клиент не дотягивается
    max_bytes: 104857600        # 100 МБ: предел считается ПО ХОДУ записи, а не после
    timeout_sec: 120            # тишина передачи дольше — обрыв (не путать с poll.timeout_sec)
    redirects: 5                # CDN отдаёт файл одним-двумя переходами; больше пяти — петля
    attempts: 3                 # обрыв передачи — повтор; с места обрыва, если сервер дал валидатор
    backoff_sec: 2              # пауза перед повтором растёт вдвое до потолка
    backoff_max_sec: 30
    retry_after_max_sec: 60     # срок, названный сервером (Retry-After), ждём до этого; длиннее — повтора нет, срок в фактах
    jitter: 0.1
    # Мера работы тела (NI-01): меньше предела байт/с за окно — обрыв попытки. 0 — мера выключена, работа — любой рост.
    speed_floor_bytes_per_sec: 0
    speed_window_sec: 30          # окно меры, как curl --speed-time по умолчанию
    retry_on: [429, 500, 502, 503, 504]   # перегрузка и временная недоступность; иное повтором не лечится
    # Длины и отпечатка файла поставщик не объявляет — `corrupt` у результата не наступает; размер
    # сверяет приёмка (verify.match_declared_size).
    codes: {failed: PROVIDER_FAILED, corrupt: DOWNLOAD_INCOMPLETE}
  # Ответ статуса задачи и адреса результата — JSON с объявленного хоста поставщика (с ключом): мал по
  # природе. Тянет тот же загрузчик (Fetcher.answer): тело по ходу и не больше предела, адрес судится, соединение — на
  # судимый IP. Хоста здесь нет: он один — хост адреса провайдера (providers.yaml → online.http), ключ уходит только ему.
  # Повтор — как у официального клиента API той же формы (openai 2.54.0 в .venv: _constants.py:10-15 — 2 повтора,
  # пауза 0.5 с вдвое до 8 с; _base_client.py:817 — разброс четверть, :843-858 — коды). Срок сервера (Retry-After) —
  # до retry_after_max_sec (у openai — 120 с); длиннее или не влезает в срок обращения — повтора нет, срок в фактах.
  # Повтор — в одном месте стека (дверь), а срок идёт вниз: цикл ожидания отдаёт опросу остаток poll.timeout_sec.
  answer:
    schemes: [https]            # ключ в открытом канале виден любому посреднику
    block_private: true         # имя поставщика, ведущее во внутреннюю сеть, — отказ до запроса
    max_bytes: 1048576          # 1 МБ: ответ статуса больше — не ответ, а чужое тело
    timeout_sec: 60             # одна фаза запроса (соединение, ответ); общее ожидание задачи — poll.timeout_sec
    deadline_sec: 120           # весь опрос с повторами — прежнее худшее время одного опроса (2 × 60 с)
    redirects: 0                # по переходу с ключом не идём: адрес назвал бы ответ (переходов у статуса нет, замер 2026-10-10)
    attempts: 3                 # сбой сети на одном опросе — повтор дверью, а не обрыв всего ожидания задачи
    backoff_sec: 0.5
    backoff_max_sec: 8
    retry_after_max_sec: 120
    jitter: 0.25
    speed_floor_bytes_per_sec: 0  # мера работы тела (NI-01) выключена: ответ мал, срок — timeout_sec
    speed_window_sec: 30
    retry_on: [408, 409, 429, 500, 502, 503, 504]
    # Ответ в память состава не имеет — `corrupt` у него не наступает; обрыв и отказ — `failed`.
    codes: {failed: PROVIDER_FAILED, corrupt: DOWNLOAD_INCOMPLETE}
