# Сценарии приёмки правки: по РОДУ УЛИКИ выбирается набор, и каждый сценарий говорит, что здесь
# ломается, почему и ЧЕМ это доказать. Читатели — scripts/guards/acceptance_studio.py (--совет) и ось
# «сценарий эксперта зовёт несуществующего исполнителя» в scripts/guards/invariants.py.
#
# Состояние сценария честное и проверяемое:
#   судится — есть исполнитель (набор + метка проверки), и он обязан существовать;
#   совет   — исполнителя ещё нет; тогда обязано стоять `станет-судимым`, а сценарий числится
#             долгом с потолком, который закрывается только вниз.
роды:
  правка-компонента:
    про: тронут файл компонента или экрана студии
    когда:
    - '*.tsx'
    - '*.jsx'
  правка-токенов:
    про: тронуто объявление общего стиля — это правка ВСЕГО приложения, а не одного места
    когда:
    - '*/tokens.ts'
    - '*/tokens.js'
    - tokens.ts
  правка-доступа:
    про: тронут слой обращения к серверу — единственная дверь наружу
    когда:
    - '*/mcp/*.ts'
    - '*/mcp/*.tsx'
  задание-react:
    про: ИИ получил задание на React-функцию или интерфейс — спрашивают ДО кода
    когда: []
  красный-суд:
    про: сторож приёмки отказал, и надо понять, что именно сломано
    когда: []
сценарии:
- имя: снесённый-импорт-или-переименованный-экспорт
  улики:
  - правка-компонента
  - красный-суд
  состояние: судится
  больно: правка логики задевает соседнее чаще всего именно здесь
  ломается: тег остаётся в разметке, а импорт снесён — либо строка импорта цела, а в цели экспорт переименован;
    падает отрисовка, и питонный гейт об этом не узнаёт ничего
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --суд
  исполнитель:
    набор: tests/studio_emulation/test_studio_emulation.py
    метка: переименованный экспорт ловится у ИМПОРТЁРА, хотя строка импорта цела
  журнал: docs/roadmap/20_studio_plan.md
- имя: размер-или-шрифт-мимо-токена
  улики:
  - правка-компонента
  - правка-токенов
  состояние: судится
  больно: пять карточек с одинаковыми размерами — пять источников одной правды, и одна отстаёт
  ломается: значение стиля попадает в компонент литералом, «поменять размер карточки» перестаёт быть правкой
    ОДНОГО значения, и единый стиль держится только глазами
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --суд
  исполнитель:
    набор: tests/studio_emulation/test_studio_emulation.py
    метка: размер шрифта мимо токена назван файлом и строкой
  журнал: docs/roadmap/20_studio_plan.md
- имя: стёртая-анимация-или-цвет
  улики:
  - правка-компонента
  - правка-токенов
  - красный-суд
  состояние: судится
  больно: ИИ сносит анимацию из библиотеки и не может вернуть — ставит похожую вместо той же
  ломается: 'объявление стиля исчезает вместе с правкой, и восстановить его нечем: описание словами не
    даёт ни длительности, ни кривой, ни кадров, а бэкапа нет'
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --восстановить <компонент>
  исполнитель:
    набор: tests/studio_emulation/test_studio_emulation.py
    метка: стёртая анимация названа дословно — тем, чем она была
  журнал: docs/roadmap/21_acceptance_plan.md
- имя: незаявленная-смена-формы
  улики:
  - правка-компонента
  - правка-токенов
  - красный-суд
  состояние: судится
  больно: «стиль не трогал» — утверждение ИИ, которое до сих пор нечем было проверить
  ломается: параметры компонента, набор его токенов или значение самого токена меняются попутно с задачей;
    дизайн уезжает молча, и замечают это на скриншоте через неделю
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --суд
  исполнитель:
    набор: tests/studio_emulation/test_studio_emulation.py
    метка: смена параметров компонента расходится со снимком формы
  журнал: docs/roadmap/20_studio_plan.md
- имя: правка-вышла-за-рамки-задачи
  улики:
  - правка-компонента
  - задание-react
  состояние: судится
  больно: просили тронуть логику — задело иконки и меню
  ломается: тронутое лежит вне зоны задания, и приёмка по описанию этого не видит — описание говорит о
    намерении, а дифф о факте
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --суд --задача <id>
  исполнитель:
    набор: tests/studio_emulation/test_studio_emulation.py
    метка: тронутое вне зоны задачи названо
  журнал: docs/roadmap/20_studio_plan.md
- имя: мёртвое-после-правки
  улики:
  - правка-компонента
  - красный-суд
  состояние: судится
  больно: ИИ оставляет за собой вариант «на будущее», которого никто не рисует
  ломается: компонент без единого отрисовщика и проп без читателя выглядят живыми и вводят в заблуждение
    следующего, кто сюда придёт
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --суд
  исполнитель:
    набор: tests/studio_emulation/test_studio_emulation.py
    метка: проп без читателя — мёртвая половина
  журнал: docs/roadmap/20_studio_plan.md
- имя: непонятно-какой-компонент
  улики:
  - задание-react
  - правка-компонента
  состояние: судится
  больно: у отрисованного элемента нет подписи, ведущей к исходнику
  ломается: ИИ правит похожий компонент вместо нужного, и правка уезжает не туда целиком
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --кто Card
  исполнитель:
    набор: tests/studio_emulation/test_studio_emulation.py
    метка: один маркер на два файла — адресация перестала быть однозначной
  журнал: docs/roadmap/20_studio_plan.md
- имя: пятый-похожий-компонент-вместо-варианта
  улики:
  - задание-react
  - правка-компонента
  состояние: совет
  больно: карточки одного назначения расползаются по файлам
  ломается: новый компонент повторяет набор токенов и пропсов существующего примитива — это вариант, а
    не новая сущность; через месяц их пять, и правка идёт в пять мест
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --кто <имя>
  станет-судимым: когда поверхность научится сравнивать профили токенов и пропсов двух компонентов и называть
    пару, отличающуюся только именем
  журнал: docs/roadmap/20_studio_plan.md
- имя: эффект-вместо-готового-механизма
  улики:
  - правка-компонента
  состояние: совет
  больно: самый частый анти-паттерн ИИ-кода на React
  ломается: состояние синхронизируется руками там, где механизм уже есть; лишний проход рендера и рассинхрон,
    который воспроизводится через раз
  доказать: grep -rn useEffect tests/studio_emulation/app
  станет-судимым: когда станет ясно, какие эффекты законны — сегодня в дереве один, и любой потолок был
    бы выдуман, а не замерен
  журнал: docs/roadmap/20_studio_plan.md
- имя: запись-на-каждое-движение
  улики:
  - правка-компонента
  - правка-доступа
  состояние: совет
  больно: жест мышью превращается в поток правок на сервер
  ломается: перетаскивание шлёт правку на каждое движение вместо одной по отпусканию; сервер получает
    мусорную историю, а отмена перестаёт быть шагом
  доказать: grep -rn onPointerMove tests/studio_emulation/app
  станет-судимым: когда в эмуляции появится жест — тогда правило «одна запись по отпусканию» получает
    предмет и проверяется прогоном, а не чтением
  журнал: docs/roadmap/20_studio_plan.md
- имя: компонент-ходит-в-сеть-сам
  улики:
  - правка-компонента
  - правка-доступа
  состояние: совет
  больно: дверь наружу обязана быть одна
  ломается: вызов сети внутри компонента обходит слой доступа — отказ сервера перестаёт доезжать кодом
    реакции, а провенанс данных теряется до разметки
  доказать: grep -rn fetch( tests/studio_emulation/app
  станет-судимым: когда слой доступа станет обязательным по объявлению — тогда сетевой вызов вне него
    становится уликой, а не стилем
  журнал: docs/roadmap/20_studio_plan.md
- имя: код-в-подвернувшемся-файле
  улики:
  - правка-компонента
  - задание-react
  - красный-суд
  состояние: судится
  больно: ИИ дописывает в тот файл, что открыт, а не в тот, чья это зона
  ломается: примитив начинает ходить в сеть, экран — держать общий стиль; зона файла размывается, и следующая
    правка ищет логику в трёх местах вместо одного
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --суд
  исполнитель:
    набор: tests/studio_emulation/test_studio_emulation.py
    метка: 'сетевой вызов в примитиве: код лёг в подвернувшийся файл, а не в дверь наружу'
  журнал: docs/roadmap/21_acceptance_plan.md
- имя: файл-положен-мимо-дерева
  улики:
  - правка-компонента
  - задание-react
  состояние: судится
  больно: новый файл появляется там, где его никто не ищет
  ломается: каталог не объявлен структурой — значит у файла нет зоны ответственности вовсе, и правило
    «один примитив на файл» к нему не применяется ничем
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --суд
  исполнитель:
    набор: tests/studio_emulation/test_studio_emulation.py
    метка: 'файл в необъявленном каталоге: дерево нарушено, и это видно до ревью'
  журнал: docs/roadmap/21_acceptance_plan.md
- имя: имя-ни-о-чём
  улики:
  - правка-компонента
  - задание-react
  состояние: судится
  больно: utils, helpers, data — файл, в который потом сваливают всё подряд
  ломается: 'имя перестаёт называть содержимое: файл не находится поиском, компонент не находится по имени
    файла, а алиас на входе стирает и то, что было'
  доказать: .venv/bin/python scripts/guards/acceptance_studio.py --суд
  исполнитель:
    набор: tests/studio_emulation/test_studio_emulation.py
    метка: алиас стирает имя компонента на входе — по разметке его больше не найти
  журнал: docs/roadmap/21_acceptance_plan.md
