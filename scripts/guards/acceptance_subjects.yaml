# ПРИЁМКА ПО ПРЕДМЕТАМ — что мы обязались судить и судим ли на самом деле.
#
# Заказ владельца 2026-09-05: «приёмку надо адаптировать под каждый модуль и его задачи… написать
# адаптивную приёмку для каждого сторожа и всего тандема, и для каждого скила — сразу станет
# понятен вектор развития… разместить на гит и через парсер и улику проверять, что сделано, а что
# нет». Поэтому объявление лежит в репозитории, а не в памяти, и КАЖДОЕ состояние несёт улику —
# команду, которой оно доказывается. Состояние без улики парсер считает пожеланием.
#
# Двенадцать условий студии были прочитаны на сервер и дали ложную картину «у бэкенда приёмка
# меньше»: «не сломал компонент» и «не сменил шрифты» на сервере не значат ничего, а то, что там
# действительно судится — контракт инструмента, код отказа, этажность, маршрут потока, объявленный
# факт и его наблюдатель — в ту таблицу не попадало, потому что называется не «приёмкой».
#
# Состояние честное и только одно из трёх:
#   судится — есть исполнитель, вердикт падает exit-кодом;
#   совет   — исполнитель говорит, но не судит (вердикта нет);
#   нет     — механизма нет; обязано нести `ждёт`, иначе это пожелание, а не план.
# Читает `scripts/guards/invariants.py`: ось «состояние приёмки не доказано» (жёсткая, потолок 0),
# храповик «условие приёмки без механизма» и печать карты `--приёмка`. Имя файла отличается от
# `acceptance_scenarios.yaml`: там сценарии совета по роду улики, здесь — предметы и их условия.

предметы:

  сервер:
    про: дерево `core/`, `tools/`, `server.py` — предмет правок ИИ чаще прочего
    условия:
      С1:
        про: контракт инструмента не сломан молча
        механизм: опись инструментов ↔ сценарии, форма `ToolResult` в прогоне соответствия
        состояние: судится
        улика: .venv/bin/python tests/conformance/test_conformance.py
      С2:
        про: объявленные значения не сменены молча — код отказа, факт, ручка конфига
        механизм: «код отказа мимо реестра», «факт мимо реестра типов», «ручка без читателя»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      С3:
        про: не вышел за рамки задачи и не оставил мёртвого
        механизм: тронутое ↔ зона задания, мёртвое судит `ruff`
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_server.py --суд
      С4:
        про: файл объявляет СВОЮ зону — шапка модуля называет его самого
        механизм: шапка ↔ имя файла или пакета
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_server.py --суд
      С5:
        про: файл лежит в объявленном каталоге, а не в подвернувшемся
        механизм: объявленная структура ↔ фактические пути (`structure_server.yaml`)
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_server.py --суд
      С6:
        про: имена говорят — не из словаря «ни о чём», без звёздного импорта и стирающего алиаса
        механизм: файл ↔ его главный экспорт, алиас ↔ исходное имя, словарь пустых имён
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_server.py --суд
      С7:
        про: этажность и границы групп не нарушены
        механизм: контракты `import-linter` (инструменты над ядром, ядро о них не знает)
        состояние: судится
        улика: .venv/bin/lint-imports
      С8:
        про: поток данных к клиенту объявлен и покрыт прогоном
        механизм: маршрут в `tests/routes/routes.yaml` ↔ сценарий, читает `blast_radius --check-routes`
        состояние: судится
        улика: .venv/bin/python -m pytest tests/routes/test_routes.py -q
      С9:
        про: понятно без комментариев; комментарий обоснован ЦЕНОЙ
        механизм: комментарий ↔ слова соседней строки (пересказ), вопрос цены в момент правки
        состояние: судится
        улика: .venv/bin/python scripts/guards/comment_guard.py --check
      С10:
        про: типы сходятся во ВСЁМ, чем мы судим, а не только в дереве сервера
        механизм: гейт типов `mypy`
        состояние: нет
        ждёт: F234 — зона объявлена как core/tools/server.py; сторожа и хуки вне её, замер 44 ошибки
        улика: .venv/bin/python -m mypy scripts/guards/ .claude/hooks/
      С11:
        про: у нового факта есть наблюдатель, а у объявленного наблюдения — полнота
        механизм: «факт эмитится, а решения о наблюдении нет», «объявление наблюдения неполно»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      С12:
        про: вердикт уходит в общий журнал тандема, а задетый поток назван
        механизм: общий хвост `_verdict.close` + источник улики `_routes.py`
        состояние: судится
        улика: .venv/bin/python tests/quick/test_acceptance_server.py
      С13:
        про: радиус правки известен ДО неё
        механизм: "`blast_radius --query` (кто держит это место) и `--affected` (кого задело)"
        состояние: совет
        улика: .venv/bin/python scripts/guards/blast_radius.py --affected

  студия:
    про: дерево эмуляции `tests/studio_emulation/` — предмет правок ИИ по React/TS
    условия:
      П1:
        про: не сломал ни одного компонента
        механизм: тег ↔ импорт, импорт ↔ экспорт цели
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_studio.py --суд
      П2:
        про: не сменил стили, дизайн, параметры, шрифты, отступы
        механизм: значение ↔ токен того же рода, форма ↔ снимок
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_studio.py --суд
      П4:
        про: понятно, с каким компонентом работать
        механизм: "`data-component` ↔ имя, уникальность на дерево"
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_studio.py --суд
      П8:
        про: стилизация и анимация восстанавливаются ТОЧНО, без бэкапа
        механизм: снимок хранит точные объявления, `--восстановить` печатает исчезнувшее дословно
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_studio.py --восстановить
      П10:
        про: видит разъехавшуюся вёрстку — наложение, текст за границей, компонент не там
        механизм: статическая половина — композиция ↔ снимок; динамическая — геометрия в браузере
        состояние: судится
        улика: npm --prefix tests/studio_emulation run test:geometry
      П11:
        про: явные ошибки логики и синтаксиса
        механизм: "`tsc` + `eslint` (правило хуков, полнота зависимостей)"
        состояние: судится
        улика: npm --prefix tests/studio_emulation run typecheck

  тандем:
    про: сами сторожа — приёмка НЕ правки, а механизма, который правку судит
    условия:
      Т1:
        про: у сторожа объявлена зона ответственности и запас расширения
        механизм: ось «сторож мимо каталога зон» (`scripts/guards/CATALOG.md`)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Т2:
        про: сторожа судит набор-дом, иначе цикл не с чем сравнить
        механизм: ось «сторож без набора-дома» (`tests/CATALOG.md`)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Т3:
        про: вердикт доезжает до общего журнала — завтра его есть чем поднять
        механизм: ось «судья мимо общего журнала»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Т4:
        про: сторож поднимается по улике вручную, а не только событием
        механизм: роспись `evidence.yaml` + наряд `patrol.py`
        состояние: судится
        улика: .venv/bin/python tests/quick/test_patrol.py
      Т5:
        про: хук объявлен событием и стоит в росписи — иначе его факт никто не спросит
        механизм: оси «хук мимо объявления» и «роспись улик разошлась» (половина хуков)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Т6:
        про: ФАКТ срабатывания проверяем, а молчание объявленного — отказ
        механизм: след `_trace.py` + `patrol.py --факт`
        состояние: судится
        улика: .venv/bin/python scripts/guards/patrol.py --факт --улика редактирование
      Т7:
        про: у каждой оси сторожа ОБЕ стороны — ловит своё нарушение и молчит на чистом
        механизм: нет; держится дисциплиной набора и ручными мутациями
        состояние: нет
        ждёт: >
          мутационный прогон должен стать механическим — сегодня номера M### ставятся руками
          и доказывают ровно то, что автор решил проверить
        улика: grep -c '^| M' tests/CATALOG.md
      Т8:
        про: сторож не врёт — ложные срабатывания меряются, а не вспоминаются
        механизм: нет
        состояние: нет
        ждёт: >
          ложная тревога сегодня всплывает случайно (в эту сессию — дважды на своём же авторе);
          нужен счёт ложных срабатываний на прогоне, иначе «сторож точен» — самооценка
        улика: grep -rn "ложн" docs/roadmap/02_findings.md
      Т9:
        про: сторож не печатает в отказе, чем его выключить
        механизм: у сторожа остатков — дверь человека (`_permit.py`); у остальных четырёх выключатель оставлен владельцем осознанно
        состояние: судится
        улика: .venv/bin/python tests/quick/test_hooks.py

  скилы:
    про: библиотека `.claude/skills/` — правило, которое читает ИИ перед работой
    условия:
      К1:
        про: у скила объявлена зона и граница с соседями
        механизм: ось «скил без объявленной зоны» (`.claude/skills/CATALOG.md`)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      К2:
        про: правило скила имеет машинного ЧИТАТЕЛЯ, а не живёт текстом
        механизм: храповики «урок без механизма» и «урок без ключа улики»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      К3:
        про: скил назван в связке по типу задачи — иначе его не позовут
        механизм: раздел `задачи` в `evidence.yaml` ведёт в скил, и ось сверяет его существование
        состояние: судится
        улика: .venv/bin/python scripts/guards/patrol.py --задача правка-сервера
      К4:
        про: описание скила действительно поднимает его на нужном запросе
        механизм: нет
        состояние: нет
        ждёт: >
          триггер описания проверяется только живым запросом; официальный `skill-creator` умеет
          eval-петлю по описаниям — кандидат не разбирался в карантине
        улика: ls .claude/skills
      К5:
        про: скил не держит копию чужой таблицы
        механизм: нет
        состояние: нет
        ждёт: >
          дубли ловились дважды вручную (таблица связок в CLAUDE.md, роспись улик); нужна ось
          «две таблицы об одном» либо один хозяин факта, названный машинно
        улика: 'grep -rn "Связки" .claude/skills'

  провайдеры:
    про: "`core/providers/` — адаптеры к чужим движкам и облакам: ключи, деньги, железо, отказы"
    условия:
      Пр1:
        про: секрет не уезжает наружу ни телом ответа, ни текстом отказа
        механизм: санитайзер `raw_response` маскирует ключи и токены на входе в отказ
        состояние: судится
        улика: .venv/bin/python tests/quick/test_audit_fixes.py
      Пр2:
        про: зрелость объявлена честно — стаб не выдаётся за исполнителя
        механизм: ось «объявлено незавершённым» (потолок 0)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Пр3:
        про: рецепт восстановления зовёт только тех, у кого есть исполнитель
        механизм: оси «рецепт движка, который клиент не увидит» и «объявлено клиенту, но бросить некому»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Пр4:
        про: отказ провайдера доезжает КОДОМ реестра, а не текстом исключения
        механизм: ось «код отказа мимо реестра» + прогон соответствия
        состояние: судится
        улика: .venv/bin/python tests/conformance/test_conformance.py
      Пр5:
        про: расход и наблюдение объявлены полно — у факта есть наблюдатель
        механизм: оси «объявление наблюдения неполно» и «факт эмитится, а решения о наблюдении нет»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Пр6:
        про: каждый объявленный отказ провайдера проверен сценарием, а не только объявлен
        механизм: нет — поимённо за коды не отвечает никто
        состояние: нет
        ждёт: >
          замер 2026-09-06: из шести кодов (`PROVIDER_ADAPTER_MISSING`, `EXHAUSTED`, `FAILED`,
          `KEY_MISSING`, `NOT_CONFIGURED`, `TIMEOUT`) в сценариях встречается ОДИН. Остальные пять —
          это ровно недоступность и исчерпание чужого сервиса, то есть деградация, ради которой
          адаптер и существует. Общий храповик «объявлено сервером, но сценарием не покрыто» считает
          их в куче и роста не даёт, но по имени не отвечает за них никто
        улика: grep -ro "PROVIDER_[A-Z_]*" tests/scenarios/

  инструменты:
    про: "`tools/` — 23 инструмента, единственная поверхность, которую видит клиент"
    условия:
      И1:
        про: контракт `ToolResult` и схема входа не сломаны
        механизм: прогон соответствия по описи
        состояние: судится
        улика: .venv/bin/python tests/conformance/test_conformance.py
      И2:
        про: сценарий зовёт только существующий инструмент, а опись полна
        механизм: ось «сценарий зовёт инструмент мимо описи»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      И3:
        про: новый код отказа объявлен в реестре, и его есть кому бросить
        механизм: оси «код отказа мимо реестра» и «объявлено клиенту, но бросить некому»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      И4:
        про: новый факт объявлен в реестре типов, и у него есть наблюдатель
        механизм: оси «факт мимо реестра типов» и «факт эмитится, а решения о наблюдении нет»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      И5:
        про: у каждого объявленного инструмента есть хотя бы один сценарий (замер 2026-09-06 — 23 из 23)
        механизм: храповик «объявлено сервером, но сценарием не покрыто» не даёт росту
        состояние: судится
        улика: 'grep -ro "call" tests/scenarios/'
      И6:
        про: этажность цела — инструменты над ядром, ядро о них не знает
        механизм: контракты `import-linter`
        состояние: судится
        улика: .venv/bin/lint-imports
      И7:
        про: клиенту не уезжает ни секрет, ни внутренний путь
        механизм: санитайзер отказа + статический разбор `bandit`
        состояние: судится
        улика: .venv/bin/python tests/quick/test_audit_fixes.py
