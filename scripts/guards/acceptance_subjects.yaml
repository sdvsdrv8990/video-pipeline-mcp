# ПРИЁМКА ПО ПРЕДМЕТАМ — что мы обязались судить и судим ли на самом деле.
#
# Заказ владельца 2026-09-05: «приёмку надо адаптировать под каждый модуль и его задачи… написать
# адаптивную приёмку для каждого сторожа и всего тандема, и для каждого скила — сразу станет
# понятен вектор развития… разместить на гит и через парсер и улику проверять, что сделано, а что
# нет». Поэтому объявление лежит в репозитории, а не в памяти, и КАЖДОЕ состояние несёт улику —
# команду, которой оно доказывается. Состояние без улики парсер считает пожеланием.
#
# Двенадцать условий студии были прочитаны на сервер и дали ложную картину «у бэкенда приёмка
# меньше»: «не сломал компонент» и «не сменил шрифты» на сервере не значат ничего, а то, что там
# действительно судится — контракт инструмента, код отказа, этажность, маршрут потока, объявленный
# факт и его наблюдатель — в ту таблицу не попадало, потому что называется не «приёмкой».
#
# Состояние честное и только одно из трёх:
#   судится — есть исполнитель, вердикт падает exit-кодом;
#   совет   — исполнитель говорит, но не судит (вердикта нет);
#   нет     — механизма нет; обязано нести `ждёт`, иначе это пожелание, а не план.
# Читает `scripts/guards/invariants.py`: ось «состояние приёмки не доказано» (жёсткая, потолок 0),
# храповик «условие приёмки без механизма» и печать карты `--приёмка`. Имя файла отличается от
# `acceptance_scenarios.yaml`: там сценарии совета по роду улики, здесь — предметы и их условия.

предметы:

  сервер:
    про: дерево `core/`, `tools/`, `server.py` — предмет правок ИИ чаще прочего
    условия:
      С1:
        про: контракт инструмента не сломан молча
        механизм: опись инструментов ↔ сценарии, форма `ToolResult` в прогоне соответствия
        состояние: судится
        улика: .venv/bin/python tests/conformance/test_conformance.py
      С2:
        про: объявленные значения не сменены молча — код отказа, факт, ручка конфига
        механизм: «код отказа мимо реестра», «факт мимо реестра типов», «ручка без читателя»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      С3:
        про: не вышел за рамки задачи и не оставил мёртвого
        механизм: тронутое ↔ зона задания, мёртвое судит `ruff`
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_server.py --суд
      С4:
        про: файл объявляет СВОЮ зону — шапка модуля называет его самого
        механизм: шапка ↔ имя файла или пакета
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_server.py --суд
      С5:
        про: файл лежит в объявленном каталоге, а не в подвернувшемся
        механизм: объявленная структура ↔ фактические пути (`structure_server.yaml`)
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_server.py --суд
      С6:
        про: имена говорят — не из словаря «ни о чём», без звёздного импорта и стирающего алиаса
        механизм: файл ↔ его главный экспорт, алиас ↔ исходное имя, словарь пустых имён
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_server.py --суд
      С7:
        про: этажность и границы групп не нарушены
        механизм: контракты `import-linter` (инструменты над ядром, ядро о них не знает)
        состояние: судится
        улика: .venv/bin/lint-imports
      С8:
        про: поток данных к клиенту объявлен и покрыт прогоном
        механизм: маршрут в `tests/routes/routes.yaml` ↔ сценарий, читает `blast_radius --check-routes`
        состояние: судится
        улика: .venv/bin/python -m pytest tests/routes/test_routes.py -q
      С9:
        про: понятно без комментариев; комментарий обоснован ЦЕНОЙ
        механизм: комментарий ↔ слова соседней строки (пересказ), вопрос цены в момент правки
        состояние: судится
        улика: .venv/bin/python scripts/guards/comment_guard.py --check
      С10:
        про: типы сходятся в том, чем мы судим, и остаток зоны назван ЧИСЛОМ, а не намерением
        механизм: зона `[tool.mypy] files` ↔ храповик «дерево, которым судим, вне гейта типов»
        состояние: судится
        улика: .venv/bin/python -m mypy
      С11:
        про: у нового факта есть наблюдатель, а у объявленного наблюдения — полнота
        механизм: «факт эмитится, а решения о наблюдении нет», «объявление наблюдения неполно»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      С12:
        про: вердикт уходит в общий журнал тандема, а задетый поток назван
        механизм: общий хвост `_verdict.close` + источник улики `_routes.py`
        состояние: судится
        улика: .venv/bin/python tests/quick/test_acceptance_server.py
      С13:
        про: радиус правки известен ДО неё
        механизм: "`blast_radius --query` (кто держит это место) и `--affected` (кого задело)"
        состояние: совет
        улика: .venv/bin/python scripts/guards/blast_radius.py --affected

  студия:
    про: дерево эмуляции `tests/studio_emulation/` — предмет правок ИИ по React/TS
    условия:
      П1:
        про: не сломал ни одного компонента
        механизм: тег ↔ импорт, импорт ↔ экспорт цели
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_studio.py --суд
      П2:
        про: не сменил стили, дизайн, параметры, шрифты, отступы
        механизм: значение ↔ токен того же рода, форма ↔ снимок
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_studio.py --суд
      П4:
        про: понятно, с каким компонентом работать
        механизм: "`data-component` ↔ имя, уникальность на дерево"
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_studio.py --суд
      П8:
        про: стилизация и анимация восстанавливаются ТОЧНО, без бэкапа
        механизм: снимок хранит точные объявления, `--восстановить` печатает исчезнувшее дословно
        состояние: судится
        улика: .venv/bin/python scripts/guards/acceptance_studio.py --восстановить
      П10:
        про: видит разъехавшуюся вёрстку — наложение, текст за границей, компонент не там
        механизм: статическая половина — композиция ↔ снимок; динамическая — геометрия в браузере
        состояние: судится
        улика: npm --prefix tests/studio_emulation run geometry
      П11:
        про: явные ошибки логики и синтаксиса
        механизм: "`tsc` + `eslint` (правило хуков, полнота зависимостей)"
        состояние: судится
        улика: npm --prefix tests/studio_emulation run typecheck

  тандем:
    про: сами сторожа — приёмка НЕ правки, а механизма, который правку судит
    условия:
      Т1:
        про: у сторожа объявлена зона ответственности и запас расширения
        механизм: ось «сторож мимо каталога зон» (`scripts/guards/CATALOG.md`)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Т2:
        про: сторожа судит набор-дом, иначе цикл не с чем сравнить
        механизм: ось «сторож без набора-дома» (`tests/CATALOG.md`)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Т3:
        про: вердикт доезжает до общего журнала — завтра его есть чем поднять
        механизм: ось «судья мимо общего журнала»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Т4:
        про: сторож поднимается по улике вручную, а не только событием
        механизм: роспись `evidence.yaml` + наряд `patrol.py`
        состояние: судится
        улика: .venv/bin/python tests/quick/test_patrol.py
      Т5:
        про: хук объявлен событием и стоит в росписи — иначе его факт никто не спросит
        механизм: оси «хук мимо объявления» и «роспись улик разошлась» (половина хуков)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Т6:
        про: ФАКТ срабатывания проверяем, а молчание объявленного — отказ
        механизм: след `_trace.py` + `patrol.py --факт`
        состояние: судится
        улика: .venv/bin/python scripts/guards/patrol.py --факт --улика редактирование
      Т7:
        про: у каждой оси сторожа ОБЕ стороны — ловит своё нарушение и молчит на чистом
        механизм: нет; держится дисциплиной набора и ручными мутациями
        состояние: нет
        ждёт: >
          мутационный прогон должен стать механическим — сегодня номера M### ставятся руками
          и доказывают ровно то, что автор решил проверить
        улика: grep -c '^| M' tests/CATALOG.md
      Т8:
        про: сторож не врёт — ложные срабатывания меряются, а не вспоминаются
        механизм: нет
        состояние: нет
        ждёт: >
          ложная тревога сегодня всплывает случайно (в эту сессию — дважды на своём же авторе);
          нужен счёт ложных срабатываний на прогоне, иначе «сторож точен» — самооценка
        улика: grep -rn "ложн" docs/roadmap/02_findings.md
      Т9:
        про: сторож не печатает в отказе, чем его выключить
        механизм: у сторожа остатков — дверь человека (`_permit.py`); у остальных четырёх выключатель оставлен владельцем осознанно
        состояние: судится
        улика: .venv/bin/python tests/quick/test_hooks.py

  скилы:
    про: библиотека `.claude/skills/` — правило, которое читает ИИ перед работой
    условия:
      К1:
        про: у скила объявлена зона и граница с соседями
        механизм: ось «скил без объявленной зоны» (`.claude/skills/CATALOG.md`)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      К2:
        про: правило скила имеет машинного ЧИТАТЕЛЯ, а не живёт текстом
        механизм: храповики «урок без механизма» и «урок без ключа улики»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      К3:
        про: скил назван в связке по типу задачи — иначе его не позовут
        механизм: раздел `задачи` в `evidence.yaml` ведёт в скил, и ось сверяет его существование
        состояние: судится
        улика: .venv/bin/python scripts/guards/patrol.py --задача правка-сервера
      К4:
        про: описание скила действительно поднимает его на нужном запросе
        механизм: нет
        состояние: нет
        ждёт: >
          триггер описания проверяется только живым запросом; официальный `skill-creator` умеет
          eval-петлю по описаниям — кандидат не разбирался в карантине
        улика: ls .claude/skills
      К5:
        про: скил не держит копию чужой таблицы
        механизм: нет
        состояние: нет
        ждёт: >
          дубли ловились дважды вручную (таблица связок в CLAUDE.md, роспись улик); нужна ось
          «две таблицы об одном» либо один хозяин факта, названный машинно
        улика: 'grep -rn "Связки" .claude/skills'

  провайдеры:
    про: "`core/providers/` — адаптеры к чужим движкам и облакам: ключи, деньги, железо, отказы"
    условия:
      Пр1:
        про: секрет не уезжает наружу ни телом ответа, ни текстом отказа
        механизм: санитайзер `raw_response` маскирует ключи и токены на входе в отказ
        состояние: судится
        улика: .venv/bin/python tests/quick/test_audit_fixes.py
      Пр2:
        про: зрелость объявлена честно — стаб не выдаётся за исполнителя
        механизм: ось «объявлено незавершённым» (потолок 0)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Пр3:
        про: рецепт восстановления зовёт только тех, у кого есть исполнитель
        механизм: оси «рецепт движка, который клиент не увидит» и «объявлено клиенту, но бросить некому»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Пр4:
        про: отказ провайдера доезжает КОДОМ реестра, а не текстом исключения
        механизм: ось «код отказа мимо реестра» + прогон соответствия
        состояние: судится
        улика: .venv/bin/python tests/conformance/test_conformance.py
      Пр5:
        про: расход и наблюдение объявлены полно — у факта есть наблюдатель
        механизм: оси «объявление наблюдения неполно» и «факт эмитится, а решения о наблюдении нет»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Пр6:
        про: каждый объявленный отказ провайдера проверен сценарием, а не только объявлен
        механизм: нет — поимённо за коды не отвечает никто
        состояние: нет
        ждёт: >
          замер 2026-09-06: из шести кодов (`PROVIDER_ADAPTER_MISSING`, `EXHAUSTED`, `FAILED`,
          `KEY_MISSING`, `NOT_CONFIGURED`, `TIMEOUT`) в сценариях встречается ОДИН. Остальные пять —
          это ровно недоступность и исчерпание чужого сервиса, то есть деградация, ради которой
          адаптер и существует. Общий храповик «объявлено сервером, но сценарием не покрыто» считает
          их в куче и роста не даёт, но по имени не отвечает за них никто
        улика: grep -ro "PROVIDER_[A-Z_]*" tests/scenarios/

  инструменты:
    про: "`tools/` — 23 инструмента, единственная поверхность, которую видит клиент"
    условия:
      И1:
        про: контракт `ToolResult` и схема входа не сломаны
        механизм: прогон соответствия по описи
        состояние: судится
        улика: .venv/bin/python tests/conformance/test_conformance.py
      И2:
        про: сценарий зовёт только существующий инструмент, а опись полна
        механизм: ось «сценарий зовёт инструмент мимо описи»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      И3:
        про: новый код отказа объявлен в реестре, и его есть кому бросить
        механизм: оси «код отказа мимо реестра» и «объявлено клиенту, но бросить некому»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      И4:
        про: новый факт объявлен в реестре типов, и у него есть наблюдатель
        механизм: оси «факт мимо реестра типов» и «факт эмитится, а решения о наблюдении нет»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      И5:
        про: у каждого объявленного инструмента есть хотя бы один сценарий (замер 2026-09-06 — 23 из 23)
        механизм: храповик «объявлено сервером, но сценарием не покрыто» не даёт росту
        состояние: судится
        улика: 'grep -ro "call" tests/scenarios/'
      И6:
        про: этажность цела — инструменты над ядром, ядро о них не знает
        механизм: контракты `import-linter`
        состояние: судится
        улика: .venv/bin/lint-imports
      И7:
        про: клиенту не уезжает ни секрет, ни внутренний путь
        механизм: санитайзер отказа + статический разбор `bandit`
        состояние: судится
        улика: .venv/bin/python tests/quick/test_audit_fixes.py

  тесты:
    про: "`tests/` — наборы и сценарии: то, чем доказывается всё остальное"
    условия:
      Тс1:
        про: у набора объявлена зона и запас — правило «не плодить» действует и здесь
        механизм: ось «набор мимо каталога зон» (`tests/CATALOG.md`)
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Тс2:
        про: пропуск набора не прячется — у каждого `skip` есть покрытие в CI
        механизм: ось «пропуск набора без покрытия в CI»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Тс3:
        про: сценарий зовёт только существующий инструмент и объявленный переход
        механизм: оси «сценарий зовёт инструмент мимо описи» и «сценарий приёмки зовёт несуществующее»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Тс4:
        про: объявленное сервером покрыто сценарием, и долг не растёт
        механизм: храповик «объявлено сервером, но сценарием не покрыто»
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Тс5:
        про: набор не растёт разнородно — рождение набора и рост внутри него решаются, а не случаются
        механизм: гейт фактов спрашивает обе двери (рождение набора, рост внутри запаса), но вердикта не выносит
        состояние: совет
        улика: .venv/bin/python tests/quick/test_hooks.py

  симуляции:
    про: "`tests/stand/` — вторая консоль на эмуляции: дисциплина ИИ и цена прогона"
    условия:
      См1:
        про: цена прогона объявлена до запуска — модель и предел секунд
        механизм: объявление `stand.yaml` читается раннером и ограничивает прогон
        состояние: судится
        улика: .venv/bin/python tests/stand/run.py --список
      См2:
        про: вердикт стенда уходит подписью в общий журнал тандема
        механизм: общий хвост `_verdict.close`
        состояние: судится
        улика: .venv/bin/python tests/stand/run.py --список
      См3:
        про: подпись ЭМУЛЯЦИИ не течёт в боевой журнал и не блокирует живую сессию
        механизм: нет
        состояние: нет
        ждёт: >
          случилось вживую 2026-09-05: остаток, подписанный внутри эмуляции, лёг в боевой журнал и
          запретил работу в моей же сессии — `_stamp` считает корень от своего файла. Лечится копией
          `_stamp` в эмуляцию, но проверки на это нет, и следующая эмуляция повторит
        улика: grep -rn "_stamp" tests/stand/run.py
      См4:
        про: изоляция второй консоли не копирует секрет на диск
        механизм: нет
        состояние: нет
        ждёт: >
          рабочая связка (свой HOME плюс симлинки на `.claude.json` и `.credentials.json`) держится
          дисциплиной раннера; проверки, что секрет не скопирован, нет — а стенд заводится ради того,
          чтобы гонять чужие консоли
        улика: grep -rn "symlink" tests/stand/run.py

  # Предметы `студия-*` объявлены ДО экранов своих доменов: «нет» у них — план, а не сломанное.
  # Как судить такое условие руками, пока механизма нет, — скил `studio-acceptance`.

  студия-общее:
    про: то, что верно на любом экране студии, читающем или пишущем сервер
    условия:
      Об1:
        про: отказ сервера показан кодом реакции и рецептом, а не «что-то пошло не так»
        механизм: подменённый ответ двери отказом ↔ текст и действие на экране
        состояние: нет
        ждёт: >
          сценарий Playwright, подменяющий ответ `/mcp` отказом из реестра реакций и ищущий на
          экране код и рецепт; ждёт живой двери `studio/app/mcp/` (сегодня честный стаб)
        улика: grep -rn "mounted" studio/app/mcp/client.ts
      Об2:
        про: один жест — одна запись, по отпусканию
        механизм: жест в браузере ↔ число вызовов записи за него
        состояние: нет
        ждёт: >
          счётчик вызовов двери в прогоне Playwright и ассерт «ровно один» на перетаскивание,
          ввод в ячейку и двойной клик; инвариант уже назван в test-master, исполнителя нет
        улика: grep -rn "onPointerUp\|onBlur" studio/app
      Об3:
        про: чужая правка не затирается молча — устаревшая версия строки даёт отказ и перечитывание
        механизм: версия прочитанной строки ↔ ответ сервера на запись
        состояние: нет
        ждёт: сценарий двух вкладок против живого сервера; ждёт двери и версии строки в `table_set`
        улика: grep -rn "version" studio/app/mcp/client.ts
      Об4:
        про: пока дверь не подключена, экран говорит об этом, а не рисует посев как живые данные
        механизм: флаг двери ↔ видимое предупреждение на каждом экране
        состояние: нет
        ждёт: проверка в прогоне геометрии, что при `mounted` ложном предупреждение есть на каждом экране
        улика: grep -rn "mounted" studio/app

  студия-навигация:
    про: адрес, крошки и меню — где человек находится и как туда вернуться
    условия:
      Нв1:
        про: адрес восстанавливает экран и вкладку — перезагрузка, ссылка и «назад» работают
        механизм: адрес ↔ открытый экран после перезагрузки
        состояние: нет
        ждёт: состояние навигации в адресе (решение о роутере — `dependency-hygiene`) и сценарий перезагрузки в Playwright
        улика: grep -rn "history\|location" studio/app
      Нв2:
        про: несуществующий адрес даёт честный экран «не найдено», а не пустоту
        механизм: адрес удалённой сущности ↔ видимое состояние экрана
        состояние: нет
        ждёт: сценарий с адресом несуществующего канала после появления адресов (Нв1)
        улика: grep -rn "не найден" studio/app

  студия-проекты:
    про: проекты и ниши, включая проекты без ниши
    условия:
      Пн1:
        про: фильтр по нише не теряет проекты без ниши
        механизм: посев с проектом без ниши ↔ карточки в каждом фильтре
        состояние: нет
        ждёт: сценарий в прогоне Playwright по посеву двери; в посеве проект без ниши уже есть
        улика: grep -n "nicheId" studio/app/mcp/client.ts
      Пн2:
        про: счётчики ниши выводятся из списка, а не хранятся рядом с ним
        механизм: счётчик на экране ↔ пересчёт по тем же данным
        состояние: нет
        ждёт: ассерт в прогоне, что число у ниши равно числу её карточек; и склонение числительных одной функцией
        улика: grep -rn "Count" studio/app/types.ts

  студия-каналы:
    про: сетки (личная и конкурентов) и каналы с их вкладками
    условия:
      Кн1:
        про: род канала один — выводится из сетки, и у канала конкурента нет действий записи
        механизм: тип сетки ↔ набор действий на экране канала
        состояние: нет
        ждёт: экран канала и сценарий «канал конкурента не предлагает создать видео»
        улика: grep -rn "competitors" studio/app
      Кн2:
        про: числа приходят числами и форматируются одной функцией с локалью
        механизм: тип поля ↔ одна функция отображения
        состояние: нет
        ждёт: тип числа в `studio/app/types.ts` вместо строки «142.5K» и одна функция формата на всё приложение
        улика: grep -rn "Intl" studio/app

  студия-конкуренты:
    про: чужие каналы, их видео и комментарии — недоверенный внешний текст
    условия:
      Кк1:
        про: чужой текст — только текстом, ссылка наружу — только https и без утечки адреса
        механизм: данные с разметкой и `javascript:` в посеве ↔ DOM после отрисовки
        состояние: нет
        ждёт: состязательный посев в прогоне Playwright (строка с тегом, адрес с `javascript:`) и ассерт по DOM
        улика: grep -rn "dangerouslySetInnerHTML" studio/app
      Кк2:
        про: метрика активности считается одной функцией, одинаково на всех экранах
        механизм: функция ↔ эталон, вычисленный независимо
        состояние: нет
        ждёт: экран конкурентов и тест функции на эталоне; формула сегодня живёт комментарием в типе дизайна
        улика: grep -rn "activity" studio/app

  студия-видео:
    про: видео-проект — сценарий, ассеты, таблицы, готовое видео, редактор, статистика
    условия:
      Вп1:
        про: интерфейс предлагает только переходы статуса, объявленные сервером
        механизм: "`WORKFLOW_SEQUENCES` ↔ кнопки перехода на экране"
        состояние: нет
        ждёт: словарь статусов из объявления сервера и сценарий на запрещённый переход
        улика: grep -n "WORKFLOW_SEQUENCES" config/templates/tables/channel_data.schema.yaml
      Вп2:
        про: черновик и финал рендера различимы, опрос прогресса останавливается на финальном статусе
        механизм: "`render_stage`/`render_status` ↔ подпись и опрос на экране"
        состояние: нет
        ждёт: экран готового видео после двери; сценарий с подменённой последовательностью статусов
        улика: grep -n "render_stage" config/templates/tables/channel_data.schema.yaml
      Вп3:
        про: несохранённая правка сценария не теряется молча
        механизм: грязный редактор ↔ предупреждение при уходе и одна запись на жест
        состояние: нет
        ждёт: экран сценария и сценарий «ушёл с несохранённым»
        улика: grep -rn "beforeunload" studio/app
      Вп4:
        про: редактор до движка монтажа — честный стаб, а не таймлайн с немыми кнопками
        механизм: готовность монтажа ↔ состояние экрана редактора
        состояние: нет
        ждёт: экран редактора (ждёт монтажа, план 19) с объявленным стабом
        улика: grep -rn "editor" studio/app

  студия-календарь:
    про: даты и время публикаций
    условия:
      Кл1:
        про: время публикации несёт часовой пояс, и на экране написано, в каком поясе оно показано
        механизм: момент с зоной ↔ отображение в зоне канала или пользователя
        состояние: нет
        ждёт: тип момента вместо пары строк даты и времени; сценарий с двумя часовыми поясами в Playwright (`timezoneId`)
        улика: grep -rn "timeZone" studio/app

  студия-создание:
    про: модалки создания проекта, сетки, канала, видео и сценария
    условия:
      Сз1:
        про: двойное нажатие не создаёт дубль
        механизм: двойной клик и двойной Enter ↔ число вызовов создания
        состояние: нет
        ждёт: счётчик вызовов двери (как у Об2) на модалках создания
        улика: grep -rn "disabled" studio/app/primitives
      Сз2:
        про: ограничения полей не расходятся с сервером — отказ сервера показан у поля
        механизм: объявление поля на сервере ↔ проверка и сообщение в форме
        состояние: нет
        ждёт: модалки создания и сценарий с отказом сервера по полю
        улика: grep -rn "aria-invalid" studio/app

  студия-платформа:
    про: нормы платформы в браузере — ширины, движки, доступность, вес, внешние получатели
    условия:
      Пл1:
        про: на каждой ширине матрицы нет прокрутки вбок, наложений, выхода за край и мелких целей касания
        механизм: профили устройств в Chromium ↔ геометрия по `data-component`
        состояние: совет
        улика: node .claude/skills/studio-web-standards/scripts/devices.mjs
      Пл2:
        про: пол браузеров объявлен один раз и экран проверен в трёх движках
        механизм: "`browserslist` ↔ цель сборки, линтер совместимости, проекты Playwright по движкам"
        состояние: нет
        ждёт: >
          `browserslist` по полу Tailwind v4, `eslint-plugin-compat` в `studio/eslint.config.js` и
          проекты webkit/firefox в CI (в среде сессии предустановлен только Chromium)
        улика: grep -n "browserslist" studio/package.json
      Пл3:
        про: экран доступен с клавиатуры и скринридеру — фокус виден, диалоги и вкладки по шаблонам WAI-ARIA
        механизм: "`axe-core` в прогоне Playwright + проход клавиатурой"
        состояние: нет
        ждёт: "`@axe-core/playwright` в прогоне геометрии по всей матрице ширин"
        улика: grep -rn "focus-visible" studio/app
      Пл4:
        про: пары токенов цвета держат контраст WCAG — слабая пара объявлена декором или крупным текстом
        механизм: пары токенов ↔ отношение контраста
        состояние: совет
        улика: python3 .claude/skills/studio-web-standards/scripts/contrast.py studio/app/tokens.css
      Пл5:
        про: вес начального бандла объявлен бюджетом и не растёт молча
        механизм: вывод сборки ↔ бюджет в репозитории
        состояние: нет
        ждёт: число бюджета рядом с деревом студии и проверка в джобе `studio-app`
        улика: npm --prefix studio run build
      Пл6:
        про: в собранном дереве нет ключей, а страница не ходит к хостам вне объявленного списка
        механизм: греп `dist` ↔ шаблоны ключей; запросы прогона ↔ объявленные хосты
        состояние: нет
        ждёт: греп `studio/dist` в джобе `studio-app` и сбор хостов запросов в прогоне Playwright
        улика: npm --prefix studio run build

  храповики:
    про: потолки долгов — единственное, что не даёт «временно» стать «навсегда»
    условия:
      Х1:
        про: у каждого потолка есть читатель — файл без читателя не держит ничего
        механизм: замер 2026-09-06 — 23 файла потолков, читателей у всех 23
        состояние: судится
        улика: grep -rn "baseline" scripts/guards/invariants.py
      Х2:
        про: потолок движется только вниз, а вверх — с подписанной причиной
        механизм: ось «потолок сдвинут без записи» + `--bless --почему`
        состояние: судится
        улика: .venv/bin/python scripts/guards/invariants.py --check
      Х3:
        про: потолок — голое число, и нечитаемый потолок объявляется вслух, а не молчит
        механизм: разбор потолка отказывает с причиной, а не считает его нулём
        состояние: судится
        улика: .venv/bin/python tests/quick/test_invariants.py
