# Структура дерева СЕРВЕРА и зона ответственности каталогов. Читатель — scripts/guards/
# acceptance_server.py (П5 зона файла, П6 структура дерева, П7 имена).
#
# Каталоги задаются глобами, первое совпадение выигрывает. `можно` — исчерпывающий список родов
# верхнего уровня, которые тут законны: класс · функция · константа · тест · скрипт.
# Этажность и границы групп судит import-linter — здесь их нет намеренно: держать второй механизм
# для того, что уже судится готовым, значит удвоить обслуживание и получить два разных вердикта.

каталоги:
  ".":
    роль: точка входа сервера и манифесты проекта
    можно: [класс, функция, константа, скрипт]
    нужна_шапка: true
  "core":
    роль: пакет ядра
    можно: [класс, функция, константа]
    нужна_шапка: true
  "core/*":
    роль: бизнес-логика ядра — движки, контракты, реестры
    # `скрипт` законен: раннер и туннель запускаются ОТДЕЛЬНО от сервера (план 17), у них своя
    # точка входа. Тест здесь незаконен — у наборов свой каталог и свой каталог зон.
    можно: [класс, функция, константа, скрипт]
    нужна_шапка: true
  "tools":
    роль: пакет обёрток
    можно: [класс, функция, константа]
    нужна_шапка: true
  "tools/*":
    роль: тонкие обёртки инструментов MCP по Bounded Context
    можно: [класс, функция, константа]
    нужна_шапка: true
  "scripts":
    роль: утилиты обслуживания владельца — не бизнес-логика
    можно: [класс, функция, константа, скрипт]
    нужна_шапка: true
  "scripts/guards":
    роль: сторожа и источники улики
    можно: [класс, функция, константа, скрипт]
    нужна_шапка: true
  ".claude/hooks":
    роль: тандем хуков сессии
    можно: [класс, функция, константа, скрипт]
    нужна_шапка: false

имена:
  запрещённые: [utils, helpers, misc, common, stuff, data, tmp, temp, new, old, manager2,
                handler2, thing, stuff2, module2, base2]
