      читатель: axis_undeclared

# ═══ Требования проекта: что обязано соблюдаться и КТО по этому ругается ═══
# Правило без поимённого судьи исполняется настроением, а правило с двумя судьями исполняется
# наполовину: непонятно, чьё молчание было дефектом. Здесь у требования судья ОДИН.
требования:
  факты-до-правки:
    про: "перед правкой несущего файла факты о нём предъявлены командой, а не памятью"
    судья: "vpm-fact-gate.py"
    дом: "verified-edits"
  замысел-до-кода:
    про: "замысел объявлен ДО кода, и зона замысла на момент объявления не правлена"
    судья: "vpm-intent-guard.py"
    дом: "intent-guard"
  шаг-закрыт-артефактом:
    про: "шаг закрывают три вещи: правка в дереве, прогон СВЕЖЕЕ правки, запись решение→факт"
    судья: "vpm-delivery-gate.py"
    дом: "engineering-questions"
  остаток-записан-уликой:
    про: "обещание в ленте живёт до конца сессии: остаток записывается подписью, а не статусом"
    судья: "остаток записан мимо своего дома"
    дом: "intent-guard"
  комментарий-объясняет-неочевидное:
    про: "текст в коде объясняет НЕОЧЕВИДНОЕ поведение; пересказ декларации и процесс-нарратив — мусор"
    судья: "comment_guard.py"
    дом: "project-conventions"
  координата-задачи-не-в-коде:
    про: "координата задачи (F#/M#/D#) указывает в реестр, а не объясняет код: её место в commit"
    судья: "comment_guard.py"
    дом: "project-conventions"
  цифра-в-комментарии:
    про: "число прозой лжёт молча: оно живёт в объявлении или измеряется прогоном, а не в комментарии"
    судья: ""
    дом: "vpm-comment-intent.py"
  правка-текстовая-доказана:
    про: "утверждение «правка только текстовая» проверяется потоком токенов КОДА, а не глазами"
    судья: "text_only.py"
    дом: "verified-edits"
  сторож-имеет-дом:
    про: "у сторожа есть набор-дом, названный строкой зоны в tests/CATALOG.md"
    судья: "сторож без набора-дома"
    дом: "project-conventions"
  сторож-имеет-зону:
    про: "у сторожа объявлена зона в scripts/guards/CATALOG.md — иначе сторожа плодятся мимо запаса"
    судья: "сторож мимо каталога зон"
    дом: "project-conventions"
  судья-в-общем-журнале:
    про: "судья заканчивает общим хвостом суда: подпись вердикта уходит в один журнал на всех"
    судья: "судья мимо общего журнала"
    дом: "project-conventions"
  сторож-в-росписи-улик:
    про: "сторож внесён в роспись улик evidence.yaml — иначе по улике его не поднимут никогда"
    судья: "роспись улик разошлась"
    дом: "project-conventions"
  судья-объявляет-состояние-улики:
    про: "судья объявляет состояние своей улики: ноль находок иначе неотличим от «смотреть нечего»"
    судья: "судья не объявил состояния улики"
    дом: "engineering-questions"
  ось-не-молчит-без-причины:
    про: "ось говорит причину молчания словом: `raise НетУлики(...)` либо `return чисто()`"
    судья: "ось молчит без объявленной причины"
    дом: "engineering-questions"
  набор-в-своей-зоне:
    про: "набор объявлен строкой зоны в каталоге тестов — так тесты и перестают плодиться"
    судья: "набор мимо каталога зон"
    дом: "test-master"
  зона-имеет-разрушительный-сценарий:
    про: "в зоне есть сценарий, который РУШИТ состояние, а не только проверяет удачу и отказ"
    судья: "зона сценариев без разрушительного"
    дом: "test-master"
  род-сценария-объявлен:
    про: "род сценария объявлен либо выведен из ожиданий; разрушительный — только объявлен"
    судья: "scenario.py"
    дом: "test-master"
  мутация-называет-счёт:
    про: "поимка мутации названа счётом ассертов, а не значком: «поймана» без числа неотличима от случайности"
    судья: "мутация поймана, а счёт пойманного не назван"
    дом: "test-master"
  ожидание-цикла-предсказание:
    про: "ожидание цикла предсказывает смену цвета, а не читается в тексте собственной правки"
    судья: "цикл судит тавтологию, а не предсказание"
    дом: "engineering-questions"
  урок-называет-исполнителя:
    про: "урок называет механизм-исполнитель, и тот существует в дереве"
    судья: "урок зовёт несуществующего исполнителя"
    дом: "engineering-questions"
  урок-несёт-ключ-улики:
    про: "урок несёт ключ прогона: без него он проза, которую нечем поднять"
    судья: "урок без ключа улики"
    дом: "engineering-questions"
  скил-имеет-зону:
    про: "у скила объявлена зона: иначе при выборе его граница невидима"
    судья: "скил без объявленной зоны"
    дом: "skill-curator"
  ручка-имеет-читателя:
    про: "объявленная ручка конфигурации читается кодом — мёртвая половина декларации запрещена"
    судья: "ручка объявлена, а читателя нет"
    дом: "anti-hardcode"
  отказ-не-гасится-молча:
    про: "отказ доезжает до клиента кодом реакции, а не гасится молча"
    судья: "отказ погашен молча"
    дом: "reactions-errors"
