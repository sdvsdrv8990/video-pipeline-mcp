# Единый словарь УЛИК — один на всех сторожей (заказ владельца 2026-09-05).
#
# Три главные улики выбраны владельцем: всё, что ИИ делает с деревом, — это ЧТЕНИЕ,
# РЕДАКТИРОВАНИЕ или СОЗДАНИЕ. Любая частная улика привязана к одной из трёх (`главная:`),
# иначе она живёт сама по себе, и поднять по ней набор сторожей нечем.
#
# Читатели: `_evidence.py` (разбор), обе приёмки (`--совет`), шим тандема (больные места),
# наряд `patrol.py` (ручной режим: поднять НАБОР сторожей по улике).
# Сверку объявления с диском держит ось «роспись улик разошлась» в `invariants.py`.

# Ходовые слова проекта многозначны, и все значения машинные. ЧИСЛА здесь не пишутся словом —
# они протухают молча (см. ниже `чем проверить` у каждого понятия): сколько слов многозначно и
# сколько у каждого родов, считает `patrol.py --улики`; сколько скилов употребляет слово, не
# определяя, — `grep -rc улик .claude/skills/*/SKILL.md | grep -v ':0'`. Отсюда правила, написанные
# по примеру: пока не назван РОД, формула покрывает один случай вместо класса.
понятия:
  улика-событие:
    про: род действия ИИ, поднимающий набор сторожей
    где: этот файл, раздел `главные` — чтение, редактирование, создание
    чем проверить: .venv/bin/python scripts/guards/patrol.py --улики
  улика-доказательство:
    про: КОМАНДА, которой условие приёмки доказывается, а не объявляется
    где: "`scripts/guards/acceptance_subjects.yaml`, поле `улика:` (сколько — считает команда ниже)"
    чем проверить: .venv/bin/python scripts/guards/invariants.py --приёмка
  ожидание-предсказание:
    про: исход, который НЕ выводится из текста патча, — его проверяет только прогон
    где: '`scripts/guards/what_if.py`, таблица ВЫВОДИМОСТЬ; счёт в подписи цикла — `предсказаний N из M`'
    чем проверить: grep -h 'предсказаний' tests/.journal/stamps-*.jsonl | tail -3
  ожидание-тавтология:
    про: исход, читаемый в самой правке («появится проверка, которую я и добавил»); НЕ допустим —
      слово владельца 2026-09-12. Объявленный `ломается:` делает его разбираемым, но не законным
    где: '`scripts/guards/what_if.py`, без_условия — отказ ДО прогонов; доля судится храповиком'
    чем проверить: .venv/bin/python scripts/guards/invariants.py --check 2>&1 | grep тавтолог
  совет-клиенту:
    про: рекомендация в УСПЕШНОМ ответе — когда у ИИ был выбор, о котором он не знал, и промаха
      нет. Форма одна на все советы, её держит `Advice.get`, а не вызывающий — `id · text · tool ·
      params`; исполним инструментом, а не проза
    где: '`config/recommendations.yaml` (тексты) → `core/advice.py` (чтение и подстановка) → поле
      `recommendations` в ToolResult; читают tools/media, tools/structure, tools/uniqueness'
    чем проверить: .venv/bin/python -c "import yaml,sys; sys.path.insert(0,'.'); from core.advice
      import Advice; d=yaml.safe_load(open('config/recommendations.yaml',encoding='utf-8'));
      print(len(d), sorted(Advice('config/recommendations.yaml').get(sorted(d)[0])[0]))"
  совет-приёмки:
    про: сценарий, который приёмка ПРЕДЛАГАЕТ по роду улики, — «где тут чаще всего ломается»;
      сам не судит, поэтому сценарий без исполнителя судится отдельной осью
    где: "`scripts/guards/acceptance_scenarios.yaml` → флаг `--совет` обеих приёмок"
    чем проверить: .venv/bin/python scripts/guards/acceptance_server.py --совет --файл server.py
  совет-храповика:
    про: что делать, когда ось покраснела, — четвёртое поле записи `RATCHETS`; печатается ТОЛЬКО
      при превышении потолка, поэтому в зелёном прогоне его не видно и легко счесть отсутствующим
    где: "`scripts/guards/invariants.py`, RATCHETS — последний элемент кортежа"
    чем проверить: .venv/bin/python -c "import sys; sys.path.insert(0,'scripts/guards'); import
      invariants as I; print(sum(1 for *_, a in I.RATCHETS if a), 'из', len(I.RATCHETS))"
  улика-подпись:
    про: роль наблюдения в журнале; механизмам эта роль запрещена — иначе сторож удовлетворяет
      гейт собственным прогоном
    где: "`scripts/guards/_stamp.py`, ROLES"
    чем проверить: .venv/bin/python scripts/guards/_stamp.py --tails

главные:
  чтение:
    про: посмотрели, не меняя дерева, — взгляд перед правкой и разбор чужой записи
    видно: инструменты Read/Grep/Glob и probe-команды оболочки
  редактирование:
    про: изменён СУЩЕСТВУЮЩИЙ файл — самая частая улика и самая дорогая по последствиям
    видно: Edit/MultiEdit, запись поверх существующего, правка скриптом мимо события
  создание:
    про: заведён НОВЫЙ файл — у него ещё нет ни зоны, ни строки в каталогах, ни читателя
    видно: Write по несуществующему пути, `git ls-files --others`

роды:
  правка-компонента:
    главная: редактирование
    про: тронут файл компонента или экрана студии
    когда: ["*.tsx", "*.jsx"]
  правка-токенов:
    главная: редактирование
    про: тронуто объявление общего стиля — это правка ВСЕГО приложения, а не одного места
    когда: ["*/tokens.ts", "*/tokens.js", "tokens.ts"]
  правка-доступа:
    главная: редактирование
    про: тронут слой обращения к серверу — единственная дверь наружу
    когда: ["*/mcp/*.ts", "*/mcp/*.tsx"]
  правка-сервера:
    главная: редактирование
    про: тронуто дерево сервера — ядро, обёртки, точка входа
    когда: ["core/*", "tools/*", "server.py", "*.py"]
  задание-react:
    главная: чтение
    про: ИИ получил задание на React-функцию или интерфейс — спрашивают ДО кода
    когда: []
  красный-суд:
    главная: чтение
    про: сторож отказал, и надо понять, что именно сломано — читаем запись отказа
    когда: []
  новый-файл:
    главная: создание
    про: файл заведён, но ни зоны, ни строки в каталоге, ни читателя у него ещё нет
    когда: []

# Роспись: кто отзывается на какую улику — ГЛАВНУЮ (всё под ней) либо частный РОД (только он) —
# и какой командой поднимается вручную.
# `авто` говорит, поднимает ли сторожа СОБЫТИЕ; пустая команда — нарядом не поднимается.
сторожа:
  invariants.py:
    улики: [редактирование, создание]
    команда: ["--check"]
    авто: хук PostToolUse и гейт CI
  comment_guard.py:
    улики: [редактирование, создание]
    команда: ["--check"]
    авто: хук PostToolUse и гейт CI
  text_only.py:
    улики: [редактирование]
    команда: ["--только-текст"]
    авто: нет — поднимается рукой и нарядом по типу работы `текст-в-коде`
  findings_count.py:
    улики: [редактирование]
    команда: ["--check"]
    авто: гейт CI
  blast_radius.py:
    улики: [редактирование]
    команда: ["--affected"]
    авто: нет — поднимается нарядом либо руками
  acceptance_server.py:
    улики: [правка-сервера]
    команда: ["--суд"]
    авто: нет — поднимается нарядом либо руками
  acceptance_studio.py:
    улики: [правка-компонента, правка-токенов, правка-доступа]
    команда: ["--суд"]
    авто: нет — поднимается нарядом либо руками
  patrol.py:
    улики: []
    команда: []
    авто: нет — наряд поднимают ИИ или человек; поднимать наряд нарядом значит зациклить его
  what_if.py:
    улики: []
    команда: []
    авто: нет — цикл поднимается НАМЕРЕНИЕМ, а не уликой, и требует объявленного ожидания
  reproduce.py:
    улики: [чтение]
    команда: []
    авто: гейт поставки на красном
  lesson_producer.py:
    улики: []
    команда: []
    авто: нет — производителя поднимают КЛЮЧОМ прогона; уликой его не разбудить, потому что
      материал урока рождается не правкой дерева, а расхождением в записи

# Хуки — вторая половина росписи. Они судят СОБЫТИЕ и поднимаются сами; нарядом их не поднять
# (события у наряда нет), но без них ответ на вопрос «кто обязан сработать по этой улике» неполон,
# а именно по нему таск проверяет ФАКТ срабатывания (`patrol.py --факт`).
# Пустой список улик — не пропуск, а утверждение: сторож стоит на границе сессии или на команде,
# а не на том, что сделано с деревом. Сверку с диском держит та же ось «роспись улик разошлась».
хуки:
  vpm-fact-gate.py:
    улики: [редактирование, создание]
    событие: PreToolUse (Edit/Write/MultiEdit/Bash) + PostToolUse (Bash)
    про: требует факты до правки несущего файла и ловит запись мимо Edit/Write постфактум
  vpm-comment-intent.py:
    улики: [редактирование, создание]
    событие: PreToolUse (Edit/Write/MultiEdit) + PostToolUse (Edit/Write/MultiEdit/Bash)
    про: текст в коде обосновывается ценой ДО записи; после записи ведёт к судье содержимого (храповик)
  vpm-invariants.py:
    улики: [редактирование, создание]
    событие: PostToolUse (Write/Edit/MultiEdit/Bash)
    про: межфайловые инварианты плюс карта потоков и больные места приёмки
  vpm-skill-guard.py:
    улики: [редактирование, создание]
    событие: PostToolUse (Write/Edit/MultiEdit)
    про: правка скила остаётся в границах его зоны
  vpm-intent-guard.py:
    улики: [редактирование, создание]
    событие: SessionStart + PreToolUse (пишущие/Bash) + Stop
    про: незакрытый остаток запрещает запись; обещание в конце сессии требует подписи
  vpm-permit.py:
    улики: []
    событие: PreToolUse (Bash)
    про: >
      стоит на КОМАНДЕ, а не на улике: просьбу снять запрет выносит человеку, самовольное
      снятие отклоняет
  vpm-delivery-gate.py:
    улики: []
    событие: Stop
    про: граница сессии — прогон свежее правки и запись решение→факт
  vpm-discipline-guard.py:
    улики: []
    событие: Stop
    про: граница сессии — судит сами механизмы по общему следу

# Улика «чтение» не поднимает НИ ОДНОГО хука: инструменты Read/Grep/Glob события хукам не дают,
# и это записанный остаток `75e4`, а не забытая строка. Пустота здесь — улика о слепой зоне.

# ЗАДАЧИ: какая улика рождается типом работы и кого поднять СВЕРХ тех, кого разбудит событие.
# Скилы по типам задач — таблица в `engineering-questions`; здесь не скилы, а сторожа, и это
# другой вопрос: там «что прочитать перед работой», тут «кто обязан судить сделанное».
# Читает `patrol.py --задача`; сверку с диском держит ось «роспись улик разошлась».
задачи:
  правка-сервера:
    требования:
      - "факты-до-правки"
      - "замысел-до-кода"
      - "шаг-закрыт-артефактом"
      - "комментарий-объясняет-неочевидное"
      - "координата-задачи-не-в-коде"
      - "отказ-не-гасится-молча"
      - "ручка-имеет-читателя"
    оси:
      - "код отказа мимо реестра"
      - "отказ погашен молча"
      - "модуль без единого читателя"
      - "объявлено сервером, но сценарием не покрыто"
      - "ветвление по значению вместо таблицы"
    улики: [редактирование]
    сверх: {blast_radius.py: ["--affected"], acceptance_server.py: ["--суд"]}
    скил: mcp-developer
    про: тронуты core/, tools/, server.py — радиус правки не виден на глаз
    спросить: {_place.py: "--файл <тронутый> — символы, зона и точка вставки"}
  баг-фикс:
    требования:
      - "факты-до-правки"
      - "шаг-закрыт-артефактом"
      - "мутация-называет-счёт"
      - "урок-несёт-ключ-улики"
    оси:
      - "мутация объявлена, а улики поимки нет"
      - "статус находки мимо реестра"
      - "мутация поймана, а счёт пойманного не назван"
    улики: [чтение, редактирование]
    сверх: {reproduce.py: []}
    скил: systematic-debugging
    про: корневая причина ДО правки; регрессия обязана краснеть на старом коде
  текст-в-коде:
    требования:
      - "комментарий-объясняет-неочевидное"
      - "координата-задачи-не-в-коде"
      - "цифра-в-комментарии"
      - "правка-текстовая-доказана"
    оси: []
    улики: [редактирование]
    сверх: {comment_guard.py: ["--check"], text_only.py: ["--только-текст"]}
    скил: project-conventions
    про: >-
      правится шапка, комментарий или проза в файле с кодом. Требования — пять классов мусора и
      форма под род файла — в скиле; сторож текста судит ФОРМУ (длину, маркеры, координаты) и
      классов не судит вовсе, поэтому его «чисто» не значит чистую шапку
    спросить: {_place.py: "--файл <тронутый> — зона файла и его род"}
  рефакторинг:
    требования:
      - "правка-текстовая-доказана"
      - "шаг-закрыт-артефактом"
      - "комментарий-объясняет-неочевидное"
    оси:
      - "копия объявления в коде"
      - "ветвление по значению вместо таблицы"
      - "модуль без единого читателя"
    улики: [редактирование]
    сверх: {comment_guard.py: ["--check"], invariants.py: ["--check"]}
    скил: code-quality
    про: поведение не меняется — значит и цвет проверок не меняется, и это утверждение
    спросить: {_place.py: "--файл <тронутый> — что в модуле есть до правки"}
  новый-файл:
    требования:
      - "сторож-имеет-дом"
      - "сторож-имеет-зону"
      - "судья-в-общем-журнале"
      - "сторож-в-росписи-улик"
      - "набор-в-своей-зоне"
    оси:
      - "сторож без набора-дома"
      - "сторож мимо каталога зон"
      - "судья мимо общего журнала"
      - "роспись улик разошлась"
      - "набор мимо каталога зон"
    улики: [создание]
    сверх: {invariants.py: ["--check"], acceptance_server.py: ["--суд"]}
    скил: project-conventions
    про: у нового файла нет ни зоны, ни строки в каталоге, ни читателя — всё три спрашиваются сразу
    спросить: {_place.py: "--файл <сосед по зоне> — куда встаёт новое и по какому правилу"}
  тесты:
    требования:
      - "набор-в-своей-зоне"
      - "род-сценария-объявлен"
      - "зона-имеет-разрушительный-сценарий"
      - "мутация-называет-счёт"
    оси:
      - "набор мимо каталога зон"
      - "зона сценариев без разрушительного"
      - "мутация поймана, а счёт пойманного не назван"
      - "объявлено сервером, но сценарием не покрыто"
    улики: [создание, редактирование]
    сверх: {invariants.py: ["--check"]}
    скил: test-master
    про: набор судится теми же осями, что код; рождение набора — отдельное решение
  скилы-и-хуки:
    требования:
      - "скил-имеет-зону"
      - "замысел-до-кода"
      - "остаток-записан-уликой"
    оси:
      - "скил без объявленной зоны"
      - "хук мимо объявления"
      - "объявление глушит голос хука"
      - "граница скила невидима при выборе"
      - "ложное срабатывание хука без проверки в наборе"
    улики: [редактирование, создание]
    сверх: {invariants.py: ["--check"]}
    скил: skill-curator
    про: >
      правка скила или хука меняет ПРАВИЛА, а не код; здесь же проверяется, что новый хук попал
      в роспись улик, иначе его факт срабатывания никто не спросит
  правка-сторожа:
    требования:
      - "замысел-до-кода"
      - "шаг-закрыт-артефактом"
      - "судья-в-общем-журнале"
      - "судья-объявляет-состояние-улики"
      - "ось-не-молчит-без-причины"
      - "ожидание-цикла-предсказание"
      - "мутация-называет-счёт"
    оси:
      - "судья не объявил состояния улики"
      - "ось молчит без объявленной причины"
      - "цикл судит тавтологию, а не предсказание"
      - "судья мимо общего журнала"
      - "ось написана, но не объявлена"
      - "мутация поймана, а счёт пойманного не назван"
    улики: [редактирование, создание]
    сверх: {invariants.py: ["--check"], what_if.py: []}
    скил: discipline-guard
    про: >-
      правится САМ судья: ось, храповик или сторож. Здесь чаще всего платят молчанием — новый
      судья молчит, пока не объявлен, и его тишина читается как чистота
  зависимости:
    требования:
      - "шаг-закрыт-артефактом"
    оси:
      - "пропуск набора без покрытия в CI"
      - "число джоб гейта мимо ci.yml"
    улики: [редактирование]
    сверх: {invariants.py: ["--check"]}
    скил: dependency-hygiene
    про: манифест ↔ лок ↔ .venv; эффект правки манифеста виден не там, где правка
  документы:
    требования:
      - "остаток-записан-уликой"
      - "урок-несёт-ключ-улики"
      - "урок-называет-исполнителя"
    оси:
      - "статус находки мимо реестра"
      - "ссылка ведёт в пустоту"
      - "журнал разошёлся со своим указателем"
      - "память разошлась со своим указателем"
      - "в памяти статус, а не знание"
    улики: [редактирование]
    сверх: {findings_count.py: ["--check"], invariants.py: ["--check"]}
    скил: docs-governance
    про: документ спорит с диском чаще, чем кажется; счёт реестра — механический
    спросить: {_place.py: "--ссылки — ссылки на строку: они протухают молча"}
  фронтенд:
    требования:
      - "шаг-закрыт-артефактом"
      - "комментарий-объясняет-неочевидное"
    оси:
      - "дерево, которым судим, вне гейта типов"
    улики: [редактирование, создание]
    сверх: {acceptance_studio.py: ["--суд"]}
    скил: frontend-design
    про: правка UI задевает соседнее чаще прочего — снесённая анимация, тронутые иконки

# Деревья, которые меряет карта радиуса. Объявлением, а не списком в коде: до 2026-09-07 замер был
# зашит в `_measured_files()` и видел ОДНО дерево из четырёх, поэтому правка сторожа или хука
# отвечала «ничего не изменилось», а новая функция хука рождалась невидимой для потолка.
# Поле `судится` разводит два разных вопроса:
#   радиус       — «что заденет правка здесь и чем это проверено»; спрашивается у любого дерева;
#   слепая-зона  — «какую функцию не исполняет НИ ОДИН сценарий»; у тестов бессмысленно, они сами
#                  исполнители, а не исполняемое, и их 393 функции превратили бы потолок в шум.
# Сторожа и хуки судятся ПОКА только радиусом: сценарий зовёт их подпроцессом (`run:`), а покрытие
# в подпроцесс не ходит — в карте прогонов их ноль файлов из 27. Объяви им слепую зону сегодня, и
# 389 функций разом станут «молчащими» не потому, что их никто не гоняет, а потому, что замер их
# не видит. Ложное обвинение выключает сторожа быстрее, чем его отсутствие. Остаток — ниже.
# Дома улики: файлы, которые не гоняют командой, но обращение к ним обязано оставлять след.
# Сторож дисциплины судит их наравне с хуками и инструментами: дом без обращений — заброшенный,
# и его содержимое перестаёт быть уликой, оставаясь текстом.
дома:
  tails.jsonl:
    про: дом незакрытых остатков; переживает сессию, поэтому его молчание дороже прочего
    следы: ["tails.jsonl:чтение", "tails.jsonl:запись"]

деревья:
  сервер:
    корни: [core, tools, server.py]
    про: ядро, обёртки инструментов и точка входа
    судится: [радиус, слепая-зона]
    замысел: да
  сторожа:
    корни: [scripts/guards]
    про: код, которым судим всё остальное
    судится: [радиус]
    замысел: да
  хуки:
    корни: [.claude/hooks]
    про: правила сессии; они БЛОКИРУЮТ запись, поэтому их молчание дороже прочего
    судится: [радиус]
    замысел: да
  тесты:
    корни: [tests]
    про: наборы и сценарии
    судится: [радиус]

# ЖИВЫЕ ВЕЛИЧИНЫ: число о нашем дереве объявляется КОМАНДОЙ, а не цифрой в прозе. В тексте оно
# пишется маркером (форма — в докстринге `_live.py`, здесь она НЕ повторяется: написанный тут
# образец сторож принял бы за настоящий маркер и обвинил бы в зове необъявленной величины);
# сторож гоняет команду и сверяет написанное с прогоном, `_live.py --обнови` переписывает.
# Бремя перевёрнуто намеренно: угадывать, какая из цифр в прозе —
# утверждение о диске, нельзя (замер: «286 скилов» чужого репозитория и «9 скилов» в ЗАКРЫТОЙ
# находке — не наши утверждения), поэтому утверждение само несёт свой источник.
#
# `команда` печатает ЧИСЛО, `перечень` — имена через пробел. Где есть перечень, число из него и
# выводится: список — источник, счёт — производная, поэтому расходиться им нечем.
живые:
  джобы:
    про: джобы гейта в `.github/workflows/ci.yml`
    команда: python3 -c "import yaml;print(len(yaml.safe_load(open('.github/workflows/ci.yml'))['jobs']))"
    перечень: python3 -c "import yaml;print(' '.join(yaml.safe_load(open('.github/workflows/ci.yml'))['jobs']))"
  скилы:
    про: скилы проекта в `.claude/skills`
    команда: ls -d .claude/skills/*/ | wc -l
    перечень: bash -c 'for d in .claude/skills/*/; do basename "$d"; done | tr "\n" " "'
  сторожа:
    про: сторожа в `scripts/guards` (источники улики на подчёркивании не судьи)
    команда: bash -c 'ls scripts/guards/*.py | grep -v "/_" | wc -l'
    перечень: bash -c 'for f in scripts/guards/*.py; do case "$(basename $f)" in _*) ;; *) basename "$f" ;; esac; done | tr "\n" " "'
  хуки:
    про: хуки сессии в `.claude/hooks` (`_trace` — источник, не хук)
    команда: bash -c 'ls .claude/hooks/*.py | grep -v "/_" | wc -l'
  разделы-памяти:
    про: разделы памяти проекта; `MEMORY.md` — указатель, а не раздел
    команда: bash -c 'ls ~/.claude/projects/-home-admin-projects-video-pipeline-mcp/memory/*.md | grep -v MEMORY.md | wc -l'
  оси:
    про: оси суда сторожа инвариантов — храповики плюс жёсткие
    команда: python3 -c "import sys; sys.path.insert(0,'scripts/guards'); import invariants as I; print(len(I.RATCHETS) + len(I.HARD))"
  находки-открытые:
    про: открытые находки реестра
    команда: bash -c 'python3 scripts/guards/findings_count.py 2>/dev/null | grep -oP "открытых:\s*\K\d+" | head -1'

# ЗОНА — тема работы, одна для файлов и для ЗАПИСЕЙ (`деревья` выше судят только файлы).
# У записи зона ОБЪЯВЛЯЕТСЯ (`--зона` у подписи); не объявлена — выводится из путей в команде
# продолжения и помечается «выведена». Поля `слова` здесь нет намеренно: угадывание зоны по
# тексту — правило по примерам, оно промахивается молча, как белый список суффиксов (7a7d).
#
# Порядок строк ЗНАЧИМ: берётся ПЕРВЫЙ совпавший путь, поэтому частное (`what_if.py`) стоит выше
# общего (`scripts/guards`). Отсортируешь блоки по алфавиту — цикл молча уедет в сторожей.
зоны:
  цикл:
    про: предсказание правки и его проверка прогоном
    пути: [scripts/guards/what_if.py, scripts/guards/reproduce.py]
  приёмка:
    про: суд над КОНКРЕТНОЙ правкой ИИ, а не над кодом вообще
    пути: [scripts/guards/acceptance_server.py, scripts/guards/acceptance_studio.py,
           scripts/guards/_acceptance.py, scripts/guards/acceptance_subjects.yaml]
  покрытие:
    про: карта «код → сценарии», слепая зона и рубежи маршрутов
    пути: [scripts/guards/blast_radius.py, scripts/guards/_routes.py,
           scripts/guards/_symbol_graph.py]
  сторожа:
    про: сторожа, хуки, скилы и дисциплина их применения
    пути: [scripts/guards, .claude/hooks, .claude/skills]
    память:
      - hard-won-lessons
      - skills-system
      - socraticode-evidence-source
  студия:
    про: этаж React/TS
    пути: [studio]
  сервер:
    про: ядро продукта — инструменты, транспорт, реакции, объявления
    пути: [core, tools, server.py, config]
    память:
      - video-pipeline-mcp-overview
      - subsystems-map
      - security-posture
      - infra-and-connector
      - montage-subsystem-design
  тесты:
    про: наборы и сценарии
    пути: [tests]
    память:
      - testing-and-gate
  доки:
    про: планы, реестр находок, журнал сессий
    пути: [docs]
    память:
      - owner-directives
      - open-questions
      - project-rules
      - project-workflow-canonical
      - memory-maintenance-directive
      - resume-full-pass-s24
      - code-review-task-pool
      - enterprise-roadmap-program

# Горячая точка: дорого править то, что часто трогают, а НЕ то, что запутанно. Пороги долями,
# а не числами: абсолютное число правок протухает с каждым коммитом, доля пересчитывается сама.
горячие:
  про: файл часто правится И крупнее медианы — единственная метрика, давшая сигнал сверх размера
  замер: docs/roadmap/23_code_quality_metrics.md
  доля-правок: 0.10
  крупнее: медиана

# Оси суда: ЧТО сторож проверяет. `читатель` — имя функции в invariants.py: условие остаётся
# Python, объявлением стал реестр. Порядок строк = порядок отчёта, и пересортировка его меняет.
оси:
  # Храповик: вниз можно, вверх нет. Потолок — число в файле рядом, совет — как долг закрывается.
  храповики:
    - заголовок: "требование без судьи"
      читатель: requirement_without_judge
      потолок: requirement_judge_baseline.txt
      совет: "Правило, по которому не ругается никто, исполняется настроением: оно живёт прозой в скиле или в тексте хука, а нарушение видно только владельцу и только глазами. Закрывается двумя способами — назвать существующего судью (заголовок оси, сторож, хук) либо завести его; вопрос «кто из двух обязан был ругаться» решается тем, что судья у требования ОДИН"
    - заголовок: "судья не объявил состояния улики"
      читатель: judge_without_evidence_state
      потолок: judge_state_baseline.txt
      совет: "Ноль находок значит и «смотрел — чисто», и «смотреть было не на что»: по такой подписи снять улику о состоянии судьи нельзя, и дыра отличается от чистоты вкусом. Объяви состояние ключом `улика=` у общей двери вердикта (`есть`/`нет`, и `почему_молчит` при `нет`) — оно уедет в роспись прогона рядом с исходом, причиной и следствием"
    - заголовок: "зона сценариев без разрушительного"
      читатель: scenarios_without_destructive
      потолок: destructive_zone_baseline.txt
      совет: "Положительный сценарий проверяет удачу, отрицательный — объявленный отказ, а разрушительный — что механизм делает, когда состояние РУШАТ: сносят зарегистрированный файл, режут колонку под формулой, вырезают источник улики. Объяви `род: разрушительный` у сценария, который это делает, и заведи такой в зоне, где его нет: пока его нет, первым разрушение пробует владелец на своих данных"
    - заголовок: "ось молчит без объявленной причины"
      читатель: axis_silent_without_reason
      потолок: axis_silence_baseline.txt
      совет: "Ранний `return []` у оси значит «источника нет», а отчёту показывает «чисто» — тот самый класс F256, который мы ловим у чужого кода. Скажи `raise НетУлики(«чего именно нет»)` либо `return чисто()`, если пустота там и правда значит чистоту: отказ судить печатается отдельной строкой, попадает в роспись прогона и не даёт снятому источнику читаться как закрытый долг"
    - заголовок: "мутация поймана, а счёт пойманного не назван"
      читатель: mutation_without_count
      потолок: mutation_count_baseline.txt
      совет: "Значок `🔴` даёт один бит, и его читает `what_if`. Но «поймана одним ассертом» и «поймана двенадцатью» — разные утверждения о зоне: первое неотличимо от случайного попадания. Пиши счёт одной формой — `ловит N ассертов`, — иначе набор поведения выродится в точку незаметно"
    - заголовок: "глушитель чужого сторожа без причины"
      читатель: silencer_without_reason
      потолок: silencer_reason_baseline.txt
      совет: "Строка отключает чужого сторожа и не говорит, почему: назови код правила и причину (`# noqa: S102 — проверяем инертность`). Без причины снять глушитель нельзя, а цена решения, измеренная снятием, считает такой участок в НОЛЬ — сторож, обязанный покраснеть, молчит"
    - заголовок: "урок без ключа улики"
      читатель: lesson_without_evidence
      потолок: lesson_evidence_baseline.txt
      совет: "Урок не ведёт в прогон, где родился: подпиши наблюдение (`_stamp.py`) и поставь ключ меткой ⟨улика: ⟦vpm КЛЮЧ⟧⟩ — или объясни в ревью, почему улики быть не может (--bless)"
    - заголовок: "у записи зона не объявлена, а выведена"
      читатель: record_zone_guessed
      потолок: record_zone_baseline.txt
      совет: "Зона выведена из путей команды — это догадка, а не объявление: у команды бывает общий путь (`invariants.py --check`), и тема уезжает в сторожей. Подписывай остаток с `--зона` из словаря `зоны`"
    - заголовок: "условие приёмки без механизма"
      читатель: acceptance_subject_gap
      потолок: acceptance_gap_baseline.txt
      совет: "Условие объявлено, а судить его нечем — это и есть вектор развития: заведи исполнителя либо опусти потолок осознанно (--bless). Карта целиком: invariants.py --приёмка"
    - заголовок: "в памяти статус, а не знание"
      читатель: memory_status
      потолок: memory_status_baseline.txt
      совет: "Статус протухает молча и грузится в КАЖДУЮ сессию: его хозяин — git, реестр находок или журнал, а память держит только не выводимое с диска. Убери строку либо опусти потолок осознанно (--bless)"
    - заголовок: "подпись цикла без счёта родов"
      читатель: cycle_unjudged
      потолок: cycle_unjudged_baseline.txt
      совет: "Ось тавтологии ищет в подписи `предсказаний N из M` и подпись без него не судит вовсе — молча. Гони цикл через what_if.py: он печатает счёт всегда. Записи до заведения счёта уйдут из окна по мере прогонов, и дом остатков их не теряет — хвост живёт в `tails.jsonl`, а не в окне журнала"
    - заголовок: "цикл судит тавтологию, а не предсказание"
      читатель: cycle_tautology
      потолок: tautology_baseline.txt
      дверь: владелец
      совет: "Ожидание читается в тексте патча — прогон его не проверяет. Предсказывай смену цвета у СУЩЕСТВУЮЩЕЙ проверки: тавтология НЕ допустима. Потолок вниз идёт свободно (--bless); ВВЕРХ — только по прямой команде владельца под важную осознанную причину (экстренный коммит, передача куска кода человеку): `_permit.py --запрос VPM_CEILING_UP --почему ...`"
    - заголовок: "дерево, которым судим, вне гейта типов"
      читатель: typegate_uncovered
      потолок: typegate_baseline.txt
      совет: "Код, которым мы судим проект, сам не судится по типам: внеси дерево в `[tool.mypy] files` и погаси его ошибки ЭТАПОМ — либо опусти потолок осознанно (--bless)"
    - заголовок: "сценарий приёмки без исполнителя"
      читатель: acceptance_advice_only
      потолок: acceptance_advice_baseline.txt
      совет: "Сценарий советует, но не судится: заведи исполнителя (набор + метку проверки) или объясни в ревью, почему судить его сегодня нечем — --bless"
    - заголовок: "мутация объявлена, а улики поимки нет"
      читатель: mutation_without_catch
      потолок: mutation_catch_baseline.txt
      совет: "Строка реестра мутаций не несёт значка «набор её ловит»: мутацию завели, а добивает её никто. Доведи набор до неё и поставь улику поимки — либо объясни в ревью, почему слепая зона осознанна (--bless)"
    - заголовок: "урок без механизма"
      читатель: lesson_without_mechanism
      потолок: lesson_debt_baseline.txt
      совет: "Урок держится словами: заведи ось/проверку/сценарий, который ловит повтор — или объясни в ревью, почему механизма быть не может (--bless)"
    - заголовок: "enum без значений"
      читатель: enum_without_values
      потолок: invariants_baseline.txt
      совет: "Долг вырос. Почини столбцы выше или объясни в ревью: --bless"
    - заголовок: "ветвление по значению вместо таблицы"
      читатель: dispatch_by_value
      потолок: dispatch_baseline.txt
      совет: "Новая цепочка ветвления: объяви таблицу (config/*.yaml → генерик в core/) или опусти потолок осознанно — --bless"
    - заголовок: "объявлено клиенту, но бросить некому"
      читатель: codes_without_emitter
      потолок: orphan_codes_baseline.txt
      совет: "Реестр обещает клиенту отказ, которого не бывает: либо путь, который его бросает, либо снять строку из server_reactions.yaml и KNOWN_ERROR_CODES"
    - заголовок: "рецепт движка, который клиент не увидит"
      читатель: dead_recovery_in_engine
      потолок: dead_recovery_baseline.txt
      совет: "Совет из кода перекрывается реестром и до клиента не доезжает: либо снять аргумент `suggested_tool`, либо поправить рецепт в config/server_reactions.yaml"
    - заголовок: "копия объявления в коде"
      читатель: mirrored_declaration
      потолок: mirror_baseline.txt
      совет: "Значение объявлено в config/*.yaml и продублировано в коде под тем же именем: читай декларацию вместо копии — либо опусти потолок осознанно, --bless"
    - заголовок: "ручка объявлена, а читателя нет"
      читатель: knob_without_reader
      потолок: knob_reader_baseline.txt
      совет: "Ключ в config/*.yaml не грузит НИКТО: правка строки не меняет поведения. Либо читатель, либо снять строку — украшение хуже пустого места, оно обещает управление, которого нет"
    - заголовок: "отказ погашен молча"
      читатель: muted_refusal
      потолок: muted_refusal_baseline.txt
      совет: "Широкий `except` превратил сбой в пустой результат: назови причину узким перехватом, либо отдай отказ кодом реестра, либо оставь след — молчание клиенту неотличимо от данных"
    - заголовок: "граница скила невидима при выборе"
      читатель: skill_boundary_invisible
      потолок: skill_boundary_baseline.txt
      совет: "Пара путаема по существу, а граница объявлена только в каталоге: назови соседа в ОБОИХ `description` — каталог в момент выбора не читается — либо опусти потолок осознанно, --bless"
    - заголовок: "объявлено незавершённым"
      читатель: unfinished_in_server
      потолок: stub_baseline.txt
      совет: "Незавершённого стало больше. Кричать о нём правильно, но прибавление — решение: либо доделать, либо --bless с объяснением, почему стаб остаётся"
    - заголовок: "конфигурация, которой нет: ключ читают с дефолтом"
      читатель: default_instead_of_declaration
      потолок: absent_knob_baseline.txt
      совет: "Читают раздел декларации и спрашивают строку, которой в нём нет: либо объяви её в config/*.yaml, либо не притворяйся конфигурацией — именованная константа честнее"
    - заголовок: "объявлено сервером, но сценарием не покрыто"
      читатель: declared_but_unscripted
      потолок: unscripted_baseline.txt
      совет: "Новое объявление без сценария. Покрытие пишется ОБЪЯВЛЕНИЕМ в tests/scenarios/*.yaml (`call` + `expect.code`), новый python-скрипт для этого не нужен — либо --bless с объяснением"
    - заголовок: "объявлено ненаблюдаемым"
      читатель: facts_exempt_from_observation
      потолок: fact_exempt_baseline.txt
      совет: "Спросить реальность про этот факт нечем — и таких стало больше. Либо наблюдатель, либо инструмент, которого не хватает, чтобы наблюдатель стал возможен"
    - заголовок: "поле записи мимо объявления"
      читатель: record_field_mismatch
      потолок: record_field_baseline.txt
      совет: "У записи следа/журнала спрашивают или в неё кладут поле, которого нет в core/contracts/trail_record.py. Промах немой: `dict.get` вернёт None, и отсутствие улики сойдёт за отсутствие в реальности — объяви поле либо спрашивай объявленным именем"
    - заголовок: "своя загрузка декларации мимо общей двери"
      читатель: declaration_loaded_privately
      потолок: private_loader_baseline.txt
      совет: "Модуль разбирает YAML сам, и у отказа заводится своя политика: шесть загрузчиков давали шесть ответов на «нет файла» и «битый файл». Читай через core/declaration.py"
    - заголовок: "объявлено фактом, а слать некому"
      читатель: facts_without_emitter
      потолок: fact_emitters_baseline.txt
      совет: "Тип обещан контрактом (или наблюдателем), а сервер его не шлёт: либо путь, который шлёт, либо снять строку из KNOWN_FACT_TYPES / tests/harness/observations.yaml"
    - заголовок: "замысел объявлен ПОСЛЕ кода"
      читатель: intent_after_code
      потолок: intent_after_code_baseline.txt
      совет: "Замысел подписан, когда судимая зона уже правлена: предсказывать было нечего. Объявляй ЗАМЫСЕЛ до первой правки кода — тогда `--expected` называет существующую проверку, которая сменит цвет, и цикл проверяет предсказание, а не пересказ (F241)"
    - заголовок: "ложное срабатывание хука без проверки в наборе"
      читатель: hook_false_unpinned
      потолок: hook_false_baseline.txt
      совет: "Ложное сработало, а проверки, которая покраснеет при повторе, нет: сузь правило по ЗАПИСАННОМУ случаю и закрепи его проверкой (`--проверка` у _precision.py). Сужение без случая глушит сторожа — либо опусти потолок осознанно, --bless"
  # Жёсткие: потолка нет, любое попадание — отказ.
  жёсткие:
    - заголовок: "ключ улики в реестре не поднимается"
      читатель: key_without_record
    - заголовок: "одну зону объявили два хозяина"
      читатель: zone_declared_twice
    - заголовок: "сторож без набора-дома"
      читатель: guard_without_home
    - заголовок: "пропуск набора без покрытия в CI"
      читатель: skips_without_ci
    - заголовок: "имя используется до объявления"
      читатель: used_before_declared
    - заголовок: "код отказа мимо реестра"
      читатель: codes_outside_registry
    - заголовок: "объявление ресурсов мимо инвентаря"
      читатель: resources_off_inventory
    - заголовок: "статус находки мимо реестра"
      читатель: status_off_registry
    - заголовок: "набор мимо каталога зон"
      читатель: suites_off_catalog
    - заголовок: "сторож мимо каталога зон"
      читатель: guards_off_catalog
    - заголовок: "модуль без единого читателя"
      читатель: module_without_reader
    - заголовок: "число джоб гейта мимо ci.yml"
      читатель: ci_jobs_off_docs
    - заголовок: "сценарий зовёт инструмент мимо описи"
      читатель: scenario_calls_unknown_tool
    - заголовок: "факт мимо реестра типов"
      читатель: facts_outside_registry
    - заголовок: "хук мимо объявления"
      читатель: hooks_off_declaration
    - заголовок: "объявление глушит голос хука"
      читатель: hook_declared_muted
    - заголовок: "дверь коммита объявлена, но не ставится"
      читатель: door_not_installed
    - заголовок: "остаток записан мимо своего дома"
      читатель: tails_off_home
    - заголовок: "раздел памяти без объявленной зоны"
      читатель: memory_zone_undeclared
    - заголовок: "живая величина разошлась с прогоном"
      читатель: live_value_stale
    - заголовок: "ссылка ведёт в пустоту"
      читатель: dead_line_reference
    - заголовок: "память разошлась со своим указателем"
      читатель: memory_off_index
    - заголовок: "память выросла выше потолка"
      читатель: memory_grew
    - заголовок: "журнал разошёлся со своим указателем"
      читатель: journal_off_index
    - заголовок: "скил без объявленной зоны"
      читатель: skill_without_zone
    - заголовок: "судья мимо общего журнала"
      читатель: judge_off_journal
    - заголовок: "роспись улик разошлась"
      читатель: evidence_roster_off_disk
    - заголовок: "потолок сдвинут без записи"
      читатель: ceiling_moved_unrecorded
    - заголовок: "ось качества без объявленного параметра"
      читатель: quality_axis_without_parameter
    - заголовок: "урок зовёт несуществующего исполнителя"
      читатель: lesson_without_executor
    - заголовок: "объявление наблюдения неполно"
      читатель: observation_incomplete
    - заголовок: "факт эмитится, а решения о наблюдении нет"
      читатель: facts_without_observer
    - заголовок: "сценарий приёмки зовёт несуществующее"
      читатель: acceptance_calls_missing
    - заголовок: "состояние приёмки не доказано"
      читатель: acceptance_state_unproven
