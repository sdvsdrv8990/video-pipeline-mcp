# Реестр осей сторожа инвариантов контракта сервера (scripts/guards/invariants.py).
# Храповик: вниз можно, вверх нет — потолок в файле рядом, совет — как долг закрывается. Жёсткая ось —
# любое попадание есть отказ. Читатель — имя функции в invariants.py.
оси:
  храповики:
    - заголовок: "enum без значений"
      читатель: enum_without_values
      потолок: invariants_baseline.txt
      совет: "Долг вырос. Почини столбцы выше или объясни в ревью: --bless"
    - заголовок: "ветвление по значению вместо таблицы"
      читатель: dispatch_by_value
      потолок: dispatch_baseline.txt
      совет: "Новая цепочка ветвления: объяви таблицу (config/*.yaml → генерик в core/) или опусти потолок осознанно — --bless"
    - заголовок: "объявлено клиенту, но бросить некому"
      читатель: codes_without_emitter
      потолок: orphan_codes_baseline.txt
      совет: "Реестр обещает клиенту отказ, которого не бывает: либо путь, который его бросает, либо снять строку из server_reactions.yaml и KNOWN_ERROR_CODES"
    - заголовок: "рецепт движка, который клиент не увидит"
      читатель: dead_recovery_in_engine
      потолок: dead_recovery_baseline.txt
      совет: "Совет из кода перекрывается реестром и до клиента не доезжает: либо снять аргумент `suggested_tool`, либо поправить рецепт в config/server_reactions.yaml"
    - заголовок: "копия объявления в коде"
      читатель: mirrored_declaration
      потолок: mirror_baseline.txt
      совет: "Значение объявлено в config/*.yaml и продублировано в коде под тем же именем: читай декларацию вместо копии — либо опусти потолок осознанно, --bless"
    - заголовок: "ручка объявлена, а читателя нет"
      читатель: knob_without_reader
      потолок: knob_reader_baseline.txt
      совет: "Ключ в config/*.yaml не грузит НИКТО: правка строки не меняет поведения. Либо читатель, либо снять строку — украшение хуже пустого места, оно обещает управление, которого нет"
    - заголовок: "отказ погашен молча"
      читатель: muted_refusal
      потолок: muted_refusal_baseline.txt
      совет: "Широкий `except` превратил сбой в пустой результат: назови причину узким перехватом, либо отдай отказ кодом реестра, либо оставь след — молчание клиенту неотличимо от данных"
    - заголовок: "объявлено незавершённым"
      читатель: unfinished_in_server
      потолок: stub_baseline.txt
      совет: "Незавершённого стало больше. Кричать о нём правильно, но прибавление — решение: либо доделать, либо --bless с объяснением, почему стаб остаётся"
    - заголовок: "конфигурация, которой нет: ключ читают с дефолтом"
      читатель: default_instead_of_declaration
      потолок: absent_knob_baseline.txt
      совет: "Читают раздел декларации и спрашивают строку, которой в нём нет: либо объяви её в config/*.yaml, либо не притворяйся конфигурацией — именованная константа честнее"
    - заголовок: "объявлено сервером, но сценарием не покрыто"
      читатель: declared_but_unscripted
      потолок: unscripted_baseline.txt
      совет: "Новое объявление без сценария. Покрытие пишется ОБЪЯВЛЕНИЕМ в tests/scenarios/*.yaml (`call` + `expect.code`), новый python-скрипт для этого не нужен — либо --bless с объяснением"
    - заголовок: "объявлено несценарным"
      читатель: codes_exempt_from_scenarios
      потолок: unscripted_exempt_baseline.txt
      совет: "Кодов, которые сценарий не родит, стало больше. Сначала попытка родить причину данными, декларацией или средой сервера (given); исключение в tests/harness/unscripted.yaml — только с фактом и местом, чем обвязка не может"
    - заголовок: "объявлено ненаблюдаемым"
      читатель: facts_exempt_from_observation
      потолок: fact_exempt_baseline.txt
      совет: "Спросить реальность про этот факт нечем — и таких стало больше. Либо наблюдатель, либо инструмент, которого не хватает, чтобы наблюдатель стал возможен"
    - заголовок: "поле записи мимо объявления"
      читатель: record_field_mismatch
      потолок: record_field_baseline.txt
      совет: "У записи следа/журнала спрашивают или в неё кладут поле, которого нет в core/contracts/trail_record.py. Промах немой: `dict.get` вернёт None, и отсутствие улики сойдёт за отсутствие в реальности — объяви поле либо спрашивай объявленным именем"
    - заголовок: "своя загрузка декларации мимо общей двери"
      читатель: declaration_loaded_privately
      потолок: private_loader_baseline.txt
      совет: "Модуль разбирает YAML сам, и у отказа заводится своя политика: шесть загрузчиков давали шесть ответов на «нет файла» и «битый файл». Читай через core/declaration.py"
    - заголовок: "объявлено фактом, а слать некому"
      читатель: facts_without_emitter
      потолок: fact_emitters_baseline.txt
      совет: "Тип обещан контрактом (или наблюдателем), а сервер его не шлёт: либо путь, который шлёт, либо снять строку из KNOWN_FACT_TYPES / tests/harness/observations.yaml"
  жёсткие:
    - заголовок: "код отказа мимо реестра"
      читатель: codes_outside_registry
    - заголовок: "объявление ресурсов мимо инвентаря"
      читатель: resources_off_inventory
    - заголовок: "модуль без единого читателя"
      читатель: module_without_reader
    - заголовок: "сценарий зовёт инструмент мимо описи"
      читатель: scenario_calls_unknown_tool
    - заголовок: "факт мимо реестра типов"
      читатель: facts_outside_registry
    - заголовок: "объявление наблюдения неполно"
      читатель: observation_incomplete
    - заголовок: "факт эмитится, а решения о наблюдении нет"
      читатель: facts_without_observer
    - заголовок: "объявление несценарности без причины или предмета"
      читатель: unscripted_declaration_stale
    - заголовок: "ось написана, но не объявлена"
      читатель: axis_undeclared

