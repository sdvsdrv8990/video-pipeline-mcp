# Единый словарь УЛИК — один на всех сторожей (заказ владельца 2026-09-05).
#
# Три главные улики выбраны владельцем: всё, что ИИ делает с деревом, — это ЧТЕНИЕ,
# РЕДАКТИРОВАНИЕ или СОЗДАНИЕ. Любая частная улика привязана к одной из трёх (`главная:`),
# иначе она живёт сама по себе, и поднять по ней набор сторожей нечем.
#
# Читатели: `_evidence.py` (разбор), обе приёмки (`--совет`), шим тандема (больные места),
# наряд `patrol.py` (ручной режим: поднять НАБОР сторожей по улике).
# Сверку объявления с диском держит ось «роспись улик разошлась» в `invariants.py`.

# Ходовые слова проекта многозначны, и все значения машинные. ЧИСЛА здесь не пишутся словом —
# они протухают молча (см. ниже `чем проверить` у каждого понятия): сколько слов многозначно и
# сколько у каждого родов, считает `patrol.py --улики`; сколько скилов употребляет слово, не
# определяя, — `grep -rc улик .claude/skills/*/SKILL.md | grep -v ':0'`. Отсюда правила, написанные
# по примеру: пока не назван РОД, формула покрывает один случай вместо класса.
понятия:
  улика-событие:
    про: род действия ИИ, поднимающий набор сторожей
    где: этот файл, раздел `главные` — чтение, редактирование, создание
    чем проверить: .venv/bin/python scripts/guards/patrol.py --улики
  улика-доказательство:
    про: КОМАНДА, которой условие приёмки доказывается, а не объявляется
    где: "`scripts/guards/acceptance_subjects.yaml`, поле `улика:` (сколько — считает команда ниже)"
    чем проверить: .venv/bin/python scripts/guards/invariants.py --приёмка
  ожидание-предсказание:
    про: исход, который НЕ выводится из текста патча, — его проверяет только прогон
    где: '`scripts/guards/what_if.py`, таблица ВЫВОДИМОСТЬ; счёт в подписи цикла — `предсказаний N из M`'
    чем проверить: grep -h 'предсказаний' tests/.journal/stamps-*.jsonl | tail -3
  ожидание-тавтология:
    про: исход, читаемый в самой правке («появится проверка, которую я и добавил»); допустим лишь
      с объявленным `ломается:` — условием, при котором исход был бы другим
    где: '`scripts/guards/what_if.py`, без_условия — отказ ДО прогонов; доля судится храповиком'
    чем проверить: .venv/bin/python scripts/guards/invariants.py --check 2>&1 | grep тавтолог
  совет-клиенту:
    про: рекомендация в УСПЕШНОМ ответе — когда у ИИ был выбор, о котором он не знал, и промаха
      нет. Форма одна на все советы, её держит `Advice.get`, а не вызывающий — `id · text · tool ·
      params`; исполним инструментом, а не проза
    где: '`config/recommendations.yaml` (тексты) → `core/advice.py` (чтение и подстановка) → поле
      `recommendations` в ToolResult; читают tools/media, tools/structure, tools/uniqueness'
    чем проверить: .venv/bin/python -c "import yaml,sys; sys.path.insert(0,'.'); from core.advice
      import Advice; d=yaml.safe_load(open('config/recommendations.yaml',encoding='utf-8'));
      print(len(d), sorted(Advice('config/recommendations.yaml').get(sorted(d)[0])[0]))"
  совет-приёмки:
    про: сценарий, который приёмка ПРЕДЛАГАЕТ по роду улики, — «где тут чаще всего ломается»;
      сам не судит, поэтому сценарий без исполнителя судится отдельной осью
    где: "`scripts/guards/acceptance_scenarios.yaml` → флаг `--совет` обеих приёмок"
    чем проверить: .venv/bin/python scripts/guards/acceptance_server.py --совет --файл server.py
  совет-храповика:
    про: что делать, когда ось покраснела, — четвёртое поле записи `RATCHETS`; печатается ТОЛЬКО
      при превышении потолка, поэтому в зелёном прогоне его не видно и легко счесть отсутствующим
    где: "`scripts/guards/invariants.py`, RATCHETS — последний элемент кортежа"
    чем проверить: .venv/bin/python -c "import sys; sys.path.insert(0,'scripts/guards'); import
      invariants as I; print(sum(1 for *_, a in I.RATCHETS if a), 'из', len(I.RATCHETS))"
  улика-подпись:
    про: роль наблюдения в журнале; механизмам эта роль запрещена — иначе сторож удовлетворяет
      гейт собственным прогоном
    где: "`scripts/guards/_stamp.py`, ROLES"
    чем проверить: .venv/bin/python scripts/guards/_stamp.py --tails

главные:
  чтение:
    про: посмотрели, не меняя дерева, — взгляд перед правкой и разбор чужой записи
    видно: инструменты Read/Grep/Glob и probe-команды оболочки
  редактирование:
    про: изменён СУЩЕСТВУЮЩИЙ файл — самая частая улика и самая дорогая по последствиям
    видно: Edit/MultiEdit, запись поверх существующего, правка скриптом мимо события
  создание:
    про: заведён НОВЫЙ файл — у него ещё нет ни зоны, ни строки в каталогах, ни читателя
    видно: Write по несуществующему пути, `git ls-files --others`

роды:
  правка-компонента:
    главная: редактирование
    про: тронут файл компонента или экрана студии
    когда: ["*.tsx", "*.jsx"]
  правка-токенов:
    главная: редактирование
    про: тронуто объявление общего стиля — это правка ВСЕГО приложения, а не одного места
    когда: ["*/tokens.ts", "*/tokens.js", "tokens.ts"]
  правка-доступа:
    главная: редактирование
    про: тронут слой обращения к серверу — единственная дверь наружу
    когда: ["*/mcp/*.ts", "*/mcp/*.tsx"]
  правка-сервера:
    главная: редактирование
    про: тронуто дерево сервера — ядро, обёртки, точка входа
    когда: ["core/*", "tools/*", "server.py", "*.py"]
  задание-react:
    главная: чтение
    про: ИИ получил задание на React-функцию или интерфейс — спрашивают ДО кода
    когда: []
  красный-суд:
    главная: чтение
    про: сторож отказал, и надо понять, что именно сломано — читаем запись отказа
    когда: []
  новый-файл:
    главная: создание
    про: файл заведён, но ни зоны, ни строки в каталоге, ни читателя у него ещё нет
    когда: []

# Роспись: кто отзывается на какую улику — ГЛАВНУЮ (всё под ней) либо частный РОД (только он) —
# и какой командой поднимается вручную.
# `авто` говорит, поднимает ли сторожа СОБЫТИЕ; пустая команда — нарядом не поднимается.
сторожа:
  invariants.py:
    улики: [редактирование, создание]
    команда: ["--check"]
    авто: хук PostToolUse и гейт CI
  comment_guard.py:
    улики: [редактирование, создание]
    команда: ["--check"]
    авто: хук PostToolUse и гейт CI
  findings_count.py:
    улики: [редактирование]
    команда: ["--check"]
    авто: гейт CI
  blast_radius.py:
    улики: [редактирование]
    команда: ["--affected"]
    авто: нет — поднимается нарядом либо руками
  acceptance_server.py:
    улики: [правка-сервера]
    команда: ["--суд"]
    авто: нет — поднимается нарядом либо руками
  acceptance_studio.py:
    улики: [правка-компонента, правка-токенов, правка-доступа]
    команда: ["--суд"]
    авто: нет — поднимается нарядом либо руками
  patrol.py:
    улики: []
    команда: []
    авто: нет — наряд поднимают ИИ или человек; поднимать наряд нарядом значит зациклить его
  what_if.py:
    улики: []
    команда: []
    авто: нет — цикл поднимается НАМЕРЕНИЕМ, а не уликой, и требует объявленного ожидания
  reproduce.py:
    улики: [чтение]
    команда: []
    авто: гейт поставки на красном

# Хуки — вторая половина росписи. Они судят СОБЫТИЕ и поднимаются сами; нарядом их не поднять
# (события у наряда нет), но без них ответ на вопрос «кто обязан сработать по этой улике» неполон,
# а именно по нему таск проверяет ФАКТ срабатывания (`patrol.py --факт`).
# Пустой список улик — не пропуск, а утверждение: сторож стоит на границе сессии или на команде,
# а не на том, что сделано с деревом. Сверку с диском держит та же ось «роспись улик разошлась».
хуки:
  vpm-fact-gate.py:
    улики: [редактирование, создание]
    событие: PreToolUse (Edit/Write/MultiEdit/Bash) + PostToolUse (Bash)
    про: требует факты до правки несущего файла и ловит запись мимо Edit/Write постфактум
  vpm-comment-intent.py:
    улики: [редактирование, создание]
    событие: PreToolUse (Edit/Write/MultiEdit) + PostToolUse (Bash)
    про: текст в коде обосновывается ценой ДО записи
  vpm-comment-guard.py:
    улики: [редактирование, создание]
    событие: PostToolUse (Write/Edit/MultiEdit)
    про: шим храповика текста в коде
  vpm-invariants.py:
    улики: [редактирование, создание]
    событие: PostToolUse (Write/Edit/MultiEdit/Bash)
    про: межфайловые инварианты плюс карта потоков и больные места приёмки
  vpm-skill-guard.py:
    улики: [редактирование, создание]
    событие: PostToolUse (Write/Edit/MultiEdit)
    про: правка скила остаётся в границах его зоны
  vpm-intent-guard.py:
    улики: [редактирование, создание]
    событие: SessionStart + PreToolUse (пишущие/Bash) + Stop
    про: незакрытый остаток запрещает запись; обещание в конце сессии требует подписи
  vpm-permit.py:
    улики: []
    событие: PreToolUse (Bash)
    про: >
      стоит на КОМАНДЕ, а не на улике: просьбу снять запрет выносит человеку, самовольное
      снятие отклоняет
  vpm-delivery-gate.py:
    улики: []
    событие: Stop
    про: граница сессии — прогон свежее правки и запись решение→факт
  vpm-discipline-guard.py:
    улики: []
    событие: Stop
    про: граница сессии — судит сами механизмы по общему следу

# Улика «чтение» не поднимает НИ ОДНОГО хука: инструменты Read/Grep/Glob события хукам не дают,
# и это записанный остаток `75e4`, а не забытая строка. Пустота здесь — улика о слепой зоне.

# ЗАДАЧИ: какая улика рождается типом работы и кого поднять СВЕРХ тех, кого разбудит событие.
# Скилы по типам задач — таблица в `engineering-questions`; здесь не скилы, а сторожа, и это
# другой вопрос: там «что прочитать перед работой», тут «кто обязан судить сделанное».
# Читает `patrol.py --задача`; сверку с диском держит ось «роспись улик разошлась».
задачи:
  правка-сервера:
    улики: [редактирование]
    сверх: {blast_radius.py: ["--affected"], acceptance_server.py: ["--суд"]}
    скил: mcp-developer
    про: тронуты core/, tools/, server.py — радиус правки не виден на глаз
  баг-фикс:
    улики: [чтение, редактирование]
    сверх: {reproduce.py: []}
    скил: systematic-debugging
    про: корневая причина ДО правки; регрессия обязана краснеть на старом коде
  рефакторинг:
    улики: [редактирование]
    сверх: {comment_guard.py: ["--check"], invariants.py: ["--check"]}
    скил: code-quality
    про: поведение не меняется — значит и цвет проверок не меняется, и это утверждение
  новый-файл:
    улики: [создание]
    сверх: {invariants.py: ["--check"], acceptance_server.py: ["--суд"]}
    скил: project-conventions
    про: у нового файла нет ни зоны, ни строки в каталоге, ни читателя — всё три спрашиваются сразу
  тесты:
    улики: [создание, редактирование]
    сверх: {invariants.py: ["--check"]}
    скил: test-master
    про: набор судится теми же осями, что код; рождение набора — отдельное решение
  скилы-и-хуки:
    улики: [редактирование, создание]
    сверх: {invariants.py: ["--check"]}
    скил: skill-curator
    про: >
      правка скила или хука меняет ПРАВИЛА, а не код; здесь же проверяется, что новый хук попал
      в роспись улик, иначе его факт срабатывания никто не спросит
  зависимости:
    улики: [редактирование]
    сверх: {invariants.py: ["--check"]}
    скил: dependency-hygiene
    про: манифест ↔ лок ↔ .venv; эффект правки манифеста виден не там, где правка
  документы:
    улики: [редактирование]
    сверх: {findings_count.py: ["--check"], invariants.py: ["--check"]}
    скил: docs-governance
    про: документ спорит с диском чаще, чем кажется; счёт реестра — механический
  фронтенд:
    улики: [редактирование, создание]
    сверх: {acceptance_studio.py: ["--суд"]}
    скил: frontend-design
    про: правка UI задевает соседнее чаще прочего — снесённая анимация, тронутые иконки

# Деревья, которые меряет карта радиуса. Объявлением, а не списком в коде: до 2026-09-07 замер был
# зашит в `_measured_files()` и видел ОДНО дерево из четырёх, поэтому правка сторожа или хука
# отвечала «ничего не изменилось», а новая функция хука рождалась невидимой для потолка.
# Поле `судится` разводит два разных вопроса:
#   радиус       — «что заденет правка здесь и чем это проверено»; спрашивается у любого дерева;
#   слепая-зона  — «какую функцию не исполняет НИ ОДИН сценарий»; у тестов бессмысленно, они сами
#                  исполнители, а не исполняемое, и их 393 функции превратили бы потолок в шум.
# Сторожа и хуки судятся ПОКА только радиусом: сценарий зовёт их подпроцессом (`run:`), а покрытие
# в подпроцесс не ходит — в карте прогонов их ноль файлов из 27. Объяви им слепую зону сегодня, и
# 389 функций разом станут «молчащими» не потому, что их никто не гоняет, а потому, что замер их
# не видит. Ложное обвинение выключает сторожа быстрее, чем его отсутствие. Остаток — ниже.
деревья:
  сервер:
    корни: [core, tools, server.py]
    про: ядро, обёртки инструментов и точка входа
    судится: [радиус, слепая-зона]
  сторожа:
    корни: [scripts/guards]
    про: код, которым судим всё остальное
    судится: [радиус]
  хуки:
    корни: [.claude/hooks]
    про: правила сессии; они БЛОКИРУЮТ запись, поэтому их молчание дороже прочего
    судится: [радиус]
  тесты:
    корни: [tests]
    про: наборы и сценарии
    судится: [радиус]

# Горячая точка: дорого править то, что часто трогают, а НЕ то, что запутанно. Пороги долями,
# а не числами: абсолютное число правок протухает с каждым коммитом, доля пересчитывается сама.
горячие:
  про: файл часто правится И крупнее медианы — единственная метрика, давшая сигнал сверх размера
  замер: docs/roadmap/23_code_quality_metrics.md
  доля-правок: 0.10
  крупнее: медиана

# Оси суда: ЧТО сторож проверяет. `читатель` — имя функции в invariants.py: условие остаётся
# Python, объявлением стал реестр. Порядок строк = порядок отчёта, и пересортировка его меняет.
оси:
  # Храповик: вниз можно, вверх нет. Потолок — число в файле рядом, совет — как долг закрывается.
  храповики:
    - заголовок: "урок без ключа улики"
      читатель: lesson_without_evidence
      потолок: lesson_evidence_baseline.txt
      совет: "Урок не ведёт в прогон, где родился: подпиши наблюдение (`_stamp.py`) и поставь ключ меткой ⟨улика: ⟦vpm КЛЮЧ⟧⟩ — или объясни в ревью, почему улики быть не может (--bless)"
    - заголовок: "условие приёмки без механизма"
      читатель: acceptance_subject_gap
      потолок: acceptance_gap_baseline.txt
      совет: "Условие объявлено, а судить его нечем — это и есть вектор развития: заведи исполнителя либо опусти потолок осознанно (--bless). Карта целиком: invariants.py --приёмка"
    - заголовок: "в памяти статус, а не знание"
      читатель: memory_status
      потолок: memory_status_baseline.txt
      совет: "Статус протухает молча и грузится в КАЖДУЮ сессию: его хозяин — git, реестр находок или журнал, а память держит только не выводимое с диска. Убери строку либо опусти потолок осознанно (--bless)"
    - заголовок: "подпись цикла без счёта родов"
      читатель: cycle_unjudged
      потолок: cycle_unjudged_baseline.txt
      совет: "Ось тавтологии ищет в подписи `предсказаний N из M` и подпись без него не судит вовсе — молча. Гони цикл через what_if.py (он печатает счёт всегда), а старые записи выйдут из окна сами — либо опусти потолок осознанно (--bless)"
    - заголовок: "цикл судит тавтологию, а не предсказание"
      читатель: cycle_tautology
      потолок: tautology_baseline.txt
      совет: "Ожидание читается в тексте патча — прогон его не проверяет. Предсказывай смену цвета у СУЩЕСТВУЮЩЕЙ проверки; тавтология допустима с объявленным `ломается:`, но доля её обязана идти вниз — либо опусти потолок осознанно (--bless)"
    - заголовок: "дерево, которым судим, вне гейта типов"
      читатель: typegate_uncovered
      потолок: typegate_baseline.txt
      совет: "Код, которым мы судим проект, сам не судится по типам: внеси дерево в `[tool.mypy] files` и погаси его ошибки ЭТАПОМ — либо опусти потолок осознанно (--bless)"
    - заголовок: "сценарий приёмки без исполнителя"
      читатель: acceptance_advice_only
      потолок: acceptance_advice_baseline.txt
      совет: "Сценарий советует, но не судится: заведи исполнителя (набор + метку проверки) или объясни в ревью, почему судить его сегодня нечем — --bless"
