# Дом исключений комментария. Объявляет ВЛАДЕЛЕЦ, не ИИ.
#
# Читатели: `scripts/guards/comment_guard.py --check` — замечания в действующей зоне не идут в долг;
# хук `.claude/hooks/vpm-comment-intent.py` — в зоне не требует обоснования. Разбор один:
# `scripts/guards/_comments.py`.
#
# Строка обязана нести все пять полей, иначе она НЕ ДЕЙСТВУЕТ и печатается претензией:
#   - зона: путь к файлу или каталогу (обязан существовать на диске)
#     класс: плавающий-дефект | передача-человеку   # других классов нет
#     почему: одна строка — что именно непонятно без прозы
#     подпись: ключ РЕШЕНИЯ владельца; обязан поднимать запись (`reproduce.py --stamp <ключ>`)
#     до: ГГГГ-ММ-ДД — срок; вечное исключение есть снятая проверка
#
# Пусто — исключений не объявлено. Это законное состояние, а не недоделка.
