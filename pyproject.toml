# pyproject.toml — источник истины для сборки и зависимостей (I2, enterprise-roadmap).
# Runtime-зависимости — здесь (абстрактно, с полами); точные пины — в requirements.lock.
# requirements.txt делегирует сюда (`-e .`). Dev-инструменты — в [project.optional-dependencies].

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-pipeline-mcp"
# 0.x — ранняя стадия: продукт (видео-пайплайн) ещё в заглушках (см. docs/roadmap/00_reality_check.md).
# Внутренняя версия протокола сервера (v2.x в history_*) — отдельная от версии пакета.
version = "0.1.0"
description = "MCP-сервер управления видеопайплайном; работает с Claude AI Web через cloudflared-туннель."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "sdvsdrv8990" }]
keywords = ["mcp", "claude", "video-pipeline", "cloudflared"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
# PolyForm Noncommercial 1.0.0 (source-available, некоммерческое использование). Файл: LICENSE. F19 закрыт.
# PEP 639: при `license = "<SPDX>"` классификатор `License :: *` запрещён (setuptools>=77 роняет сборку).
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
]

dependencies = [
    # Ядро
    "pydantic>=2.0,<3",
    "openpyxl>=3.1",
    # Провайдеры (STT/TTS/IMG)
    # Полы подняты по advisory (S8/F47, 2026-08-12): ниже них известные CVE.
    "litellm>=1.84.0",
    "stable-ts>=2.0",
    "torch>=2.13.0",
    # torchaudio отстаёт от torch на минор: 2.11.0 — максимум, существующий на PyPI (проверено 2026-08-12).
    "torchaudio>=2.11.0",
    # Удаление фона и апскейл: граф ONNX + работа с картинкой. В основных, а не в группе local,
    # потому что это провайдеры ПО УМОЛЧАНИЮ для своих видов ресурса (гигабайтов не тянут:
    # onnxruntime ~50 МБ против ~3 ГБ у torch), и без них сервер отказывал бы в базовой операции.
    "onnxruntime>=1.20",
    "pillow>=11.0",
    # FFmpeg-обёртка
    "ffmpeg-python>=0.2",
    # Транспорт
    "httpx>=0.24",
    # aiohttp — публичный транспорт за туннелем: 9 advisory ниже 3.14.3 (S8/F47).
    "aiohttp>=3.14.3",
    # Утилиты
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    # Подпись артефактов и ключ инстанса (core/integrity, S9): без неё подпись молча отключается.
    "cryptography>=42.0",
    # NB: cloudflared — бинарь, НЕ pip-пакет (ставится install.sh, D11).
]

[project.optional-dependencies]
# Инструменты разработки/CI — задел под I4 (линт/типы) и I3 (CI/безопасность).
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "bandit>=1.7",
    "pip-audit>=2.7",
    # Пол по advisory (PYSEC-2026-3447): у раннера CI предустановлен уязвимый 79.0.1, и
    # `pip install -e ".[dev]"` его НЕ трогает — лок с 84.0.0 в этой установке не участвует.
    # Пол в манифесте — единственное место, которое действует и на чистой машине, и в CI.
    "setuptools>=83.0.0",
]
# Локальные модели (озвучка/картинки) — среда инференса. Отдельной группой, потому что это
# гигабайты рантайма ради провайдеров, которые нужны не всякой установке; сервер без неё
# работает и честно отвечает LOCAL_INFERENCE_FAILED. Сами веса — не сюда, они вне git:
# каталог объявлен в config/providers.yaml → local.models_dir, тянет scripts/fetch_local_models.py.
local = [
    "piper-tts>=1.6",
    "diffusers>=0.35",
    "transformers>=4.44",
    "accelerate>=1.0",
    "safetensors>=0.5",
]
# Расчёт на видеокарте AMD. Пин ЛОКАЛЬНОЙ версии (`+rocm7.1`) — не придирчивость: колесо с PyPI
# собрано под CUDA и на amdgpu карту не увидит, а номер версии у них одинаковый. Только пин
# отличает одно от другого, и он же не даёт обычному `pip install -e .` молча вернуть CUDA-сборку.
# Индекс объявлен ниже в [tool.pip] и передаётся ключом --extra-index-url: PEP 508 адрес индекса
# внутри зависимости выразить не умеет. Системный ROCm НЕ нужен — библиотеки лежат внутри колеса,
# нужен лишь драйвер ядра amdgpu и доступ к /dev/kfd.
#   .venv/bin/pip install -e ".[local,gpu-amd]" --extra-index-url https://download.pytorch.org/whl/rocm7.1
# Карта другого вендора — своя группа с тем же смыслом (nvidia: `+cu…` с индекса cuXXX).
gpu-amd = [
    "torch==2.13.0+rocm7.1",
    "torchaudio==2.11.0+rocm7.1",
]

[project.scripts]
video-pipeline-mcp = "server:main"

[project.urls]
Repository = "https://github.com/sdvsdrv8990/video-pipeline-mcp"

# server.py — модуль в корне; core/tools/pipeline — пакеты. Явно, чтобы автодискавери не спотыкался.
[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["core*", "tools*", "pipeline*"]
exclude = ["tests*", "workspace*", "docs*"]

# ═══ I4: линт/типы ═══
# Данные (workspace/) и доки — не код, исключены. Тесты — самостоятельные скрипты
# (sys.path-инъекция + компактный стиль), их идиомы игнорируются point-wise.
[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["workspace", ".venv", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "E701", "E702", "E731", "F841"]

# ═══ I7 T0: pytest — канонический раннер ═══
# Собираем ТОЛЬКО tests/test_suites.py: наборы — самостоятельные скрипты, их внутренние
# test_*-функции ничего не ассертят (F50 «ложный зелёный»), а тело модуля исполняется при
# импорте. Гейт = exit-код набора в подпроцессе. Пофайловая миграция в идиоматичный pytest —
# по мере касания набора; тогда файл добавляется в python_files.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_suites.py"]
xfail_strict = true
addopts = "-ra"
markers = [
    "live: нужен запущенный сервер/туннель (вне основного гейта до харнесса T2)",
    "sim: adversarial-симуляция",
    "slow: длительный прогон",
    "eval: оценка качества, opt-in вне гейта",
]

# ═══ I7 T1: покрытие ═══
# Наборы гоняются подпроцессами (test_suites.py) → parallel-mode + combine, иначе цифра = 0%.
# Порог — ratchet от ФАКТА (не «красивое число»): падение ниже = красный гейт, рост фиксируем.
[tool.coverage.run]
source = ["core", "tools", "server"]
parallel = true
omit = ["*/__pycache__/*", "core/providers/*"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
skip_covered = false

[tool.mypy]
# Версию НЕ пиним: матрица CI гоняет 3.11 и 3.12, а пин 3.11 заставлял mypy разбирать стабы
# установленного numpy как 3.11-синтаксис — на 3.12-раннере это падало `Type statement is only
# supported in Python 3.12` ещё до проверки нашего кода. Пусть анализирует ту версию, на
# которой запущен: именно она и исполняет код.
files = ["core", "tools", "server.py"]
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
# Прагматичный базовый уровень I4 (не strict). Ужесточение аннотаций — отдельным воркстримом.
# `exclude = "core/providers/"` СНЯТ (S24, F88): он не работал — mypy идёт в провайдеров по импортам
# из tools/media, а не обходом каталога, — и потому 15 ошибок типов там жили, пока сессии писали
# «mypy PASS». Провайдеры давно не стабы: локальные адаптеры реальны и типизируются наравне.
