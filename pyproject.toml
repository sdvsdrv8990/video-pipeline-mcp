# pyproject.toml — источник истины для сборки и зависимостей (enterprise-roadmap).
# ЕДИНСТВЕННЫЙ файл зависимостей. requirements.txt/.lock сняты: первый содержал только `-e .`,
# из второго не ставил никто (CI, install.sh и Dockerfile ставят отсюда) — оба держались
# дисциплиной, а не механизмом, и были третьим местом, где ту же правду приходилось чинить.
# Runtime — в [project.dependencies], инструменты — в [project.optional-dependencies].

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-pipeline-mcp"
# 0.x — ранняя стадия: продукт (видео-пайплайн) ещё в заглушках (см. docs/roadmap/00_reality_check.md).
# Внутренняя версия протокола сервера (v2.x в history_*) — отдельная от версии пакета.
version = "0.1.0"
description = "MCP-сервер управления видеопайплайном; работает с Claude AI Web через туннель."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "sdvsdrv8990" }]
keywords = ["mcp", "claude", "video-pipeline", "tunnel"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
# PolyForm Noncommercial 1.0.0 (source-available, некоммерческое использование). Файл: LICENSE.
# PEP 639: при `license = "<SPDX>"` классификатор `License :: *` запрещён (setuptools>=77 роняет сборку).
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    # Объявленные платформы = матрица CI (.github/workflows/ci.yml): красный на ОС — мера переносимости, не повод снять ОС.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Framework :: AsyncIO",
]

dependencies = [
    # Ядро
    "pydantic>=2.0,<3",
    # Ошибки проверки схем деклараций с путём ключа (core/declaration_schemas.py); версию закрепляет pydantic.
    "pydantic-core",
    "openpyxl>=3.1",
    # Провайдеры (STT/TTS/IMG)
    # Полы подняты по advisory (2026-08-12): ниже них известные CVE.
    "litellm>=1.84.0",
    # Удаление фона и апскейл: граф ONNX + работа с картинкой. В основных, а не в группе local,
    # потому что это провайдеры ПО УМОЛЧАНИЮ для своих видов ресурса (гигабайтов не тянут:
    # onnxruntime ~50 МБ против ~3 ГБ у torch), и без них сервер отказывал бы в базовой операции.
    "onnxruntime>=1.20",
    "pillow>=11.0",
    # Транспорт
    "httpx>=0.24",
    # Суд значения заголовка у двери загрузчика (core/providers/download.py `_carried`): h11 несёт запрос httpx по
    # HTTP/1.1 — импорт нашего кода, а приезжал транзитивно через httpcore. Нижняя граница — версия, на которой мерено.
    "h11>=0.16",
    # aiohttp — публичный транспорт за туннелем: 9 advisory ниже 3.14.3.
    "aiohttp>=3.14.3",
    # Утилиты
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    # Требования PEP 508 среды расчёта судит наш менеджер пакетов (core/packages) — импорт, а не транзитив.
    "packaging>=24.0",
    # numpy и huggingface_hub импортируются НАШИМ кодом (onnx-провайдеры, каталог/установщик
    # моделей), а приезжали транзитивно через onnxruntime/diffusers. Транзитив — не объявление:
    # уносишь донора — базовый путь ломается на чистой машине.
    "numpy>=2.4",
    "huggingface_hub>=1.16",
    # Замок ОС между процессами (core/paths, FS-09): импорт нашего кода, а приезжал транзитивно через huggingface_hub.
    "filelock>=3.32",
    # Корень журналов по ОС (core/observability/logs, FS-17): импорт нашего кода, а приезжал транзитивно.
    "platformdirs>=4.11",
    # Ядра и память процесса на macOS и Windows и привязка к ядрам (core/providers/hardware, HW-01/02): в stdlib
    # переносимого вызова памяти нет; приезжал транзитивно через accelerate. Нижняя граница — версия, на которой мерено.
    "psutil>=7.2",
    # Подпись артефактов и ключ инстанса (core/integrity): без неё подпись молча отключается.
    "cryptography>=42.0",
    # NB: бинарь туннеля — НЕ pip-пакет (ставится install.sh).
]

[project.optional-dependencies]
# Зависимости разведены ПО ЗОНАМ: снять зону — значит удалить её строку, а не выковыривать
# пакеты из общего списка. `dev` остался агрегатом (`pip install -e ".[dev]"` в CI не менялся).
# Что чем пользуется на самом деле — считает `tests/quick/test_dependencies.py`.
test = ["pytest>=8.0"]
scripts = [
    "coverage[toml]>=7.6",
]
# Инструменты разработки/CI — задел под I4 (линт/типы) и I3 (CI/безопасность).
dev = [
    "video-pipeline-mcp[test,scripts]",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "bandit>=1.7",
    "pip-audit>=2.7",
    # Архитектурные контракты ОБЪЯВЛЕНИЕМ ([tool.importlinter] ниже), а не нашим обходчиком:
    # этажность и границы Bounded Context держит библиотека, нам остаётся политика.
    "import-linter>=2.14",
    # Слом публичной поверхности между ревизиями — параметр «предсказуемость».
    "griffe>=2.3",
    # Пол по advisory (PYSEC-2026-3447): у раннера CI предустановлен уязвимый 79.0.1, и
    # `pip install -e ".[dev]"` его НЕ трогает. Пол в манифесте действует и на чистой
    # машине, и в CI — а больше объявить версию негде.
    "setuptools>=83.0.0",
    # Тот же механизм, что у setuptools: pip-audit аудирует ОКРУЖЕНИЕ, а сам pip в нём —
    # обычный пакет. PYSEC-2026-3721 (CVE-2026-13346, fix 26.2): pip не разбирал дважды
    # закодированные URL из индекса и клал файлы мимо целевого каталога.
    "pip>=26.2",
]
# Локальные модели (озвучка/картинки) — среда инференса. Отдельной группой, потому что это
# гигабайты рантайма ради провайдеров, которые нужны не всякой установке; сервер без неё
# работает и честно отвечает LOCAL_INFERENCE_FAILED. Сами веса — не сюда, они вне git:
# каталог объявлен в config/providers.yaml → local.models_dir, тянет scripts/models.py.
local = [
    "piper-tts>=1.6",
    "diffusers>=0.35",
    # Требование МОДЕЛИ, а не diffusers: model_index.json объявляет
    # text_encoder = [transformers, CLIPTextModel]. Без него генерация картинки не поднимется.
    "transformers>=4.44",
    # Распознавание речи исполняет тот же transformers, что и картинки: отдельной библиотеки
    # для этого не нужно. Звук декодирует ffmpeg — СИСТЕМНЫЙ бинарь, не пакет pip (как
    # бинарь туннеля): его отсутствие адаптер называет отдельным отказом.
    # safetensors не объявляем: он транзитивно у diffusers/transformers.
    # torch и accelerate ЗДЕСЬ НЕ ОБЪЯВЛЕНЫ, хотя нужны диффузии и распознаванию речи, — замер
    # 2026-09-10: с ними `pip install -e ".[local]"` тянул 20+ колёс nvidia-*/cuda-* (~12 ГБ)
    # CUDA-сборки на машину с картой AMD. Требует их только accelerate: diffusers, transformers
    # и piper-tts к torch не обращаются при установке вовсе. Ускоритель выбирает МАШИНА — группой
    # ниже, с точным пином локальной версии; голое `torch` с PyPI на Linux означает CUDA.
]
# Ускоритель без карты: колесо CPU лежит на своём индексе и отличается от CUDA-сборки ТОЛЬКО
# локальной версией (`+cpu`), номер у них общий — поэтому пин, а не пол.
#   .venv/bin/pip install -e ".[local,cpu]" --extra-index-url https://download.pytorch.org/whl/cpu
cpu = [
    "torch==2.14.1",
    "accelerate>=1.0",
]
# Расчёт на видеокарте AMD. Пин ЛОКАЛЬНОЙ версии (`+rocm7.1`) — не придирчивость: колесо с PyPI
# собрано под CUDA и на amdgpu карту не увидит, а номер версии у них одинаковый. Только пин
# отличает одно от другого, и он же не даёт обычному `pip install -e .` молча вернуть CUDA-сборку.
# Индекс объявить негде: PEP 508 адрес индекса внутри зависимости выразить не умеет, а секции
# для него в манифесте нет — он передаётся ключом --extra-index-url в команде ниже.
# Системный ROCm НЕ нужен — библиотеки лежат внутри колеса,
# нужен лишь драйвер ядра amdgpu и доступ к /dev/kfd.
#   .venv/bin/pip install -e ".[local,gpu-amd]" --extra-index-url https://download.pytorch.org/whl/rocm7.1
#   .venv/bin/pip install -e ".[local,gpu-nvidia]"        # индекс не нужен: PyPI и есть CUDA
gpu-nvidia = [
    # Пина локальной версии здесь нет намеренно: колесо с PyPI под Linux УЖЕ собрано под CUDA,
    # отдельного индекса и суффикса ему не нужно — именно этой сборкой `.[local]` и тянул 12 ГБ
    # на машину с картой AMD, пока torch стоял в группе моделей.
    "torch>=2.13.0",
    "accelerate>=1.0",
]
gpu-amd = [
    "torch==2.14.1",
    # accelerate живёт рядом с torch, а не в `local`: он ЕДИНСТВЕННЫЙ из группы моделей, кто
    # требует torch метаданными, и в `local` он тянул за собой чужую сборку.
    "accelerate>=1.0",
    # Ядро triton. Объявлено ЯВНО, потому что метаданные врут: `triton-rocm` (его тянет torch)
    # содержит только `triton/backends/amd/**` — плагин бэкенда — и не объявляет зависимости от
    # ядра, хотя `torch._dynamo` обращается к `triton.language`. Два дистрибутива делят одно имя
    # модуля, и обратные зависимости этого не показывают: снос `triton` как «сироты» оставляет
    # `triton/` без `__init__.py`, и diffusers падает `module 'triton' has no attribute 'language'`.
    # Версия совпадает с triton-rocm намеренно.
    "triton==3.8.0",
]

[project.scripts]
video-pipeline-mcp = "server:main"

[project.urls]
Repository = "https://github.com/sdvsdrv8990/video-pipeline-mcp"

# server.py — модуль в корне; core/tools/pipeline — пакеты. Явно, чтобы автодискавери не спотыкался.
[tool.vpm]
# Проектные зависимости, у которых есть ВТОРОЙ читатель — тесты или сторожа. Список нужен не для
# установки (они и так приходят с сервером), а для снятия: убрав такую строку из `dependencies`,
# ломаешь не только сервер, и узнать об этом надо ДО, а не по красному гейту. Обе стороны держит
# `tests/quick/test_dependencies.py`: незаявленное заимствование и заявленное, которого уже нет.
borrowed_by_tests = ["aiohttp", "httpx", "huggingface-hub", "jsonschema", "openpyxl", "pillow", "platformdirs", "psutil", "pydantic", "pyyaml"]
# Модуль, который даёт дистрибутив, — ОБЪЯВЛЕНИЕМ. Связать `import piper` с `piper-tts` можно
# только через установленный пакет, а необязательная группа (модели, ускоритель) не стоит ни
# здесь, ни в CI: там ставится ровно `.[dev]`. Без этой строки «не проверено» превращалось в
# «читателя нет» — обвинение, выведенное из отсутствия улики.
provides_modules = {"piper-tts" = ["piper"], "diffusers" = ["diffusers"], "transformers" = ["transformers"], "torch" = ["torch"], "accelerate" = ["accelerate"], "triton" = ["triton"]}
borrowed_by_scripts = ["pyyaml"]
# Внешняя граница одного набора `tests/**` — у вызывающего (tests/test_suites.py, судья мутантов): зависание набора
# ловится здесь, а не своим пределом внутри события.
suite_timeout_sec = 900

# Возраст версии в замке (`uv pip compile` из шапки requirements-lock.txt) — механизмом uv: версии моложе срока не
# берутся (uv 0.12.19 docs/concepts/resolution.md «Dependency cooldowns» :891-917). 3 дня — как у Dependabot
# (.github/dependabot.yml). pip CI этот раздел не читает: он ставит по замку.
[tool.uv.pip]
exclude-newer = "3 days"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["core*", "tools*", "pipeline*"]
exclude = ["tests*", "workspace*", "docs*"]

# ═══ I4: линт/типы ═══
# Данные (workspace/) и доки — не код, исключены. Тесты — самостоятельные скрипты
# (sys.path-инъекция + компактный стиль), их идиомы игнорируются point-wise.
[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["workspace", ".venv", "docs", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
# Глушитель правила, которого набор не проверяет, объясняет тишину, которой нет, — и его причину копируют.
# PLW1514: текст без явной кодировки читается и пишется кодировкой локали — на Windows cp1252 (PT-07).
extend-select = ["RUF100", "PLW1514"]
# PLW1514 в ruff — правило preview; preview включает только явно выбранные правила (вывод гейта по дереву тот же).
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "E701", "E702", "E731", "F841"]

# ═══ I7 T0: pytest — канонический раннер ═══
# Собираем ТОЛЬКО tests/test_suites.py: наборы — самостоятельные скрипты, их внутренние
# test_*-функции ничего не ассертят («ложный зелёный»), а тело модуля исполняется при
# импорте. Гейт = exit-код набора в подпроцессе. Пофайловая миграция в идиоматичный pytest —
# по мере касания набора; тогда файл добавляется в python_files.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_suites.py"]
xfail_strict = true
addopts = "-ra"
markers = [
    "live: нужен запущенный сервер/туннель (вне основного гейта до харнесса T2)",
    "sim: adversarial-симуляция",
    "slow: длительный прогон",
    "eval: оценка качества, opt-in вне гейта",
]

# ═══ I7 T1: покрытие ═══
# Наборы гоняются подпроцессами (test_suites.py) → parallel-mode + combine, иначе цифра = 0%.
# Порог — ratchet от ФАКТА (не «красивое число»): падение ниже = красный гейт, рост фиксируем.
[tool.coverage.run]
source = ["core", "tools", "server"]
parallel = true
# Ветви: покрытие СТРОК отвечает «строка исполнилась», а не «ветка взята», — а решение по данным
# живёт именно в ветке (заказ владельца 2026-09-12).
branch = true
# Провайдеры вернулись в замер: это продукт клиентского сервера, а не вспомогательный слой.
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
skip_covered = false

[tool.mypy]
# Версию НЕ пиним: матрица CI гоняет 3.11 и 3.12, а пин 3.11 заставлял mypy разбирать стабы
# установленного numpy как 3.11-синтаксис — на 3.12-раннере это падало `Type statement is only
# supported in Python 3.12` ещё до проверки нашего кода. Пусть анализирует ту версию, на
# которой запущен: именно она и исполняет код.
files = ["core", "tools", "server.py", "scripts", "tests/harness"]
# Зона растёт этапами, и остаток назван числом в храповике «дерево, которым судим, вне
# гейта типов»: без него ужать `files` обратно можно было бы молча.
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
# Прагматичный базовый уровень I4 (не strict). Ужесточение аннотаций — отдельным воркстримом.
# `exclude = "core/providers/"` СНЯТ: он не работал — mypy идёт в провайдеров по импортам
# из tools/media, а не обходом каталога, — и потому 15 ошибок типов там жили, пока сессии писали
# «mypy PASS». Провайдеры давно не стабы: локальные адаптеры реальны и типизируются наравне.

[[tool.mypy.overrides]]
# Харнесс сторожа тянут импортом, но судится он ЭТАПОМ 3: без этой строки 20 чужих ошибок
# приехали бы в зону этапа 1 и гейт нельзя было бы включить вовсе.
module = "tests.harness.*"
ignore_errors = true

[tool.importlinter]
# Корни графа — ПАКЕТЫ: `server.py` это модуль, и grimp его в корни не берёт. Этаж сервера
# остаётся за нашей осью, а не додумывается контрактом, который библиотека судить не может.
root_packages = ["tools", "core"]

[[tool.importlinter.contracts]]
name = "Этажность: инструменты над ядром, ядро о них не знает"
type = "layers"
layers = ["tools", "core"]

[[tool.importlinter.contracts]]
name = "Bounded Context: группы инструментов не знают друг о друге"
type = "independence"
modules = [
    "tools.excel", "tools.filesystem", "tools.media", "tools.memory", "tools.montage",
    "tools.search", "tools.structure", "tools.tables", "tools.uniqueness",
]
