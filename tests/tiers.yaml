# Ярусы прогонов: ЧТО гнать, решает радиус правки, а не тип работы «на глаз».
#
# Читает `scripts/guards/patrol.py --ярус`. Цена у каждого яруса — ЗАМЕР (2026-09-06), а не
# оценка: без неё график был бы таким же топорным ожиданием, как «появится проверка».
#
# Зона считается по ТРЁМ деревьям, а не по одному: сторожа и тесты мы тоже судим и покрываем,
# поэтому правка в них обязана поднимать свой ярус. Замер того дня: сервер 102 файла (видел
# радиус), сторожа 17, хуки 10, тесты и симуляции 47 — последние 74 радиус не видел вовсе.

деревья:
  сервер:   ["core/", "tools/", "server.py"]
  сторожа:  ["scripts/guards/"]
  хуки:     [".claude/hooks/"]
  тесты:    ["tests/"]
  правила:  [".claude/skills/"]

ярусы:
  дом:
    про: наборы, чья объявленная зона называет тронутый файл
    выбор: зона из `tests/CATALOG.md` — связь «файл → его набор» выводится, а не держится вторым списком
    поднимает: ["сервер", "сторожа", "хуки", "тесты", "правила"]
    цена: 21 набор из 24 укладывается в 33 с; поштучно 0.1–2.9 с
    чем: .venv/bin/python tests/quick/<набор>.py
    когда: КАЖДАЯ правка, без исключений

  радиус:
    про: сценарии, исполняющие тронутые строки, и места, которые их зовут
    выбор: две улики `blast_radius --affected` — прогон (что исполнялось) и статический граф
      вызовов (кто зовёт тронутое, даже если сценарий его не гоняет). Вторая и есть «может быть задето»
    поднимает: ["сервер"]
    цена: секунды на разбор; прогон названных сценариев — по их числу
    чем: .venv/bin/python scripts/guards/blast_radius.py --affected
    когда: тронут сервер

  тяжёлые:
    про: три набора, съедающие 84% времени быстрых
    выбор: замер, а не каталог — `test_structure` 84.3 с, `test_providers` 47.7 с, `test_table_materializer` 45.9 с
    поднимает: ["сервер"]
    цена: 178 с на три набора
    чем: .venv/bin/python tests/quick/test_structure.py
    когда: тронуты структура, провайдеры или материализация таблиц

  цикл:
    про: обе карты дважды — на `HEAD` и на патче; ловит смену цвета, которой правка не объявляла
    выбор: сравнение двух деревьев, а не прогон одного
    поднимает: ["сервер", "сторожа", "хуки", "тесты"]
    цена: "4.6 мин за прогон (замер журнала: 224 мин на 64 прогона)"
    чем: .venv/bin/python scripts/guards/what_if.py --intent intent.yaml
    когда: поведение меняется осознанно — и ВСЕГДА при правке машинерии
    польза: поймал незаявленное в 15 намерениях из 39

  гейт:
    про: семь джоб `ci.yml` по exit-коду, а не один pytest
    поднимает: ["сервер", "сторожа", "хуки", "тесты", "правила"]
    цена: pytest 558 с; ruff+mypy+bandit — секунды
    чем: .venv/bin/python -m pytest -q
    когда: перед коммитом

  кросс:
    про: полное перекрёстное тестирование — симуляции, рой, стенд, маршруты потоков
    выбор: сценарии подбираются по вероятности вскрыть поломку ИЛИ ТИШИНУ там, где сервер обязан кричать
    поднимает: ["сервер"]
    цена: не замерена — ОСТАТОК этого этапа
    чем: .venv/bin/python tests/test_suites.py
    когда: тронуты файрвол, контракт отказа, реестр реакций, транспорт — либо по графику

# Условия ВНЕ графика: правка этих мест поднимает ярус независимо от того, что решил радиус.
вне_графика:
  - место: core/firewall/
    ярус: кросс
    почему: защита, отключённая молча, выглядит как «чисто» — это ловят только симуляции
  - место: config/server_reactions.yaml
    ярус: кросс
    почему: код отказа доезжает до клиента через маршрут, а не через unit
  - место: core/transport/
    ярус: кросс
    почему: транспорт поднимается «как-нибудь» при битой конфигурации — поймано F-находкой
  - место: scripts/guards/
    ярус: цикл
    почему: сторож судит всё остальное; его правка меняет вердикты, а не поведение сервера
