# Структура дерева студии и ЗОНА ОТВЕТСТВЕННОСТИ каждого каталога. Объявление лежит рядом с
# деревом, поэтому копия дерева (стенд) увозит его с собой. Читатель — scripts/guards/
# acceptance_studio.py (П5 зона файла, П6 структура дерева, П7 имена).
#
# `можно` — исчерпывающий список родов, которые тут законны. Род, которого в списке нет, и есть
# «код кинут в подвернувшийся файл»: не запрет по списку запрещённого, а положительное объявление.
# Роды: компонент · сетевой-вызов · объявление (const/type без компонента) · функция · тип.

каталоги:
  ".":
    роль: корень студии — только общие объявления (токены, кадры анимации)
    можно: [объявление, тип]
  primitives:
    роль: примитивы интерфейса — один примитив на файл, назначение различается ВАРИАНТАМИ
    можно: [компонент, тип]
  screens:
    роль: экраны Bounded Context — собирают примитивы, данные берут у слоя доступа
    можно: [компонент, тип]
  mcp:
    роль: единственная дверь к серверу — здесь и только здесь живёт сетевой вызов
    можно: [функция, тип, сетевой-вызов, объявление]

имена:
  файл_равен_экспорту: ["primitives/*.tsx", "screens/*.tsx"]
  запрещённые: [utils, helpers, misc, common, stuff, data, tmp, temp, new, old, index2, test2,
                thing, item2, handler2, component, wrapper2]
