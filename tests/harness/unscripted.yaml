# Коды отказа, которые сценарий не родит: причина рождается вне того, что умеет объявление сценария.
#
# Сценарий рождает причину данными (`given.files`), декларациями (`given.declarations`) и вызовом. Код, который ни
# одним из них не родить, объявляется здесь — `why` называет факт и место в коде, а не слово. Сторож
# `scripts/guards/invariants.py` вычитает такой код из «сценарием не покрыто», держит число объявлений храповиком
# («объявлено несценарным») и отказывает объявлению без причины или без предмета (сценарий код уже ждёт, сервер его
# не бросает). Ключ этого файла читает только сторож: в config/server_reactions.yaml он был бы ручкой без читателя.

INTERNAL_ERROR:
  why: >-
    граница исполнения: код рождает только исключение мимо ContractError — общий перехват
    core/engine/engine.py:197, неожиданное исключение установки core/providers/installer.py:119, отказ без
    ErrorDetail в tools/media/__init__.py:114; сценарий, который роняет сервер нарочно, — сценарий бага, а не отказа

UNKNOWN_ERROR:
  why: >-
    граница реестра: код рождает только код отказа, которого нет в реестре (core/reactions/reactions.py:59), — это
    дефект, а не отказ: литерал в форме броска не пускает жёсткая ось «код отказа мимо реестра»
    (scripts/guards/invariants.py:94, RAISED_CODE — нижняя граница, код в словаре или переменной она не видит), код
    поля-кода декларации — дверь (core/declaration.py:104, отказ registry_code)
