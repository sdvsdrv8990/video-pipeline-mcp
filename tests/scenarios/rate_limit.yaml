# Частота — единственная зона, где предмет проверки это ПОВЕДЕНИЕ РЯДА вызовов, а не один ответ.
# Оба края объявляются в ОДНОМ сценарии и в этом порядке намеренно: шквал банит адрес, и любой
# сценарий после него в этом же файле получил бы отказ, не относящийся к делу.

- scenario: rl_honest_pace_survives_then_flood_is_refused
  why: предел обязан отсекать шквал и НЕ трогать честного — сторож, банящий честного, выключают первым
  when:
    - rpc: tools/list
      with: {}
      repeat: 30
      expect:
        ok: true
        data: {_repeat.ok_count: 30, _repeat.first_refusal: null}
    - rpc: tools/list
      with: {}
      repeat: 120
      expect:
        ok: false
        code: RPC_-32000
