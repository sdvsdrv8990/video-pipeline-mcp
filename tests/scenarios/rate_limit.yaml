# Частота — единственная зона, где предмет проверки это ПОВЕДЕНИЕ РЯДА вызовов, а не один ответ.
# Оба края объявляются в ОДНОМ сценарии и в этом порядке намеренно: шквал банит адрес, и любой
# сценарий после него в этом же файле получил бы отказ, не относящийся к делу.
#
# Обновлено в E5a (2026-10-13, 09): у шквала два края, и теперь они различимы кодом реестра. Прежде: ждали только
# последний ответ числом `RPC_-32000` (бан), а лимит частоты шёл тем же −32001, что ключ. Теперь: первый отказ ряда —
# RATE_LIMITED (ai_recoverable, факт retry_after_sec — срок лимитера, а не литерал), последний — REQUEST_BLOCKED
# правилом ip_blocklist (бан после ban_after нарушений), и лимит ложится в след своим кодом. Роды: positive — честный
# темп не тронут; negative — шквал отбит лимитом, затем баном. Прогноз до замера: все шаги зелёные.
# Обновлено в цепочке лимитера (2026-10-13, 09): срок повтора — остаток до выхода старейшего запроса окна, а не окно
# целиком. Прежде шаг ждал retry_after_sec = 60 (окно); теперь в шквале остаток зависит от часов прогона, поэтому здесь —
# только наличие факта, а точное значение судит событие на шве часов (tests/bot_army: остаток 30 из 1000 + 60 − 1030).

- scenario: rl_honest_pace_survives_then_flood_is_refused
  why: предел обязан отсекать шквал и НЕ трогать честного — сторож, банящий честного, выключают первым
  when:
    - rpc: tools/list
      with: {}
      repeat: 30
      expect:
        ok: true
        data: {_repeat.ok_count: 30, _repeat.first_refusal: null}
    - rpc: tools/list
      with: {}
      repeat: 120
      expect:
        ok: false
        code: REQUEST_BLOCKED
        class: human_required
        detail: {facts.rule: ip_blocklist}
        data: {_repeat.first_code: RATE_LIMITED, _repeat.first_detail.reaction_class: ai_recoverable}
        data_contains: {_repeat.first_detail.facts: retry_after_sec}
    - python: trail_says
      with: {level: firewall, code: RATE_LIMITED}
      expect:
        ok: true
        data: {code: RATE_LIMITED, ok_flag: false}
