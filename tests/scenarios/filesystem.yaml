# Файловые инструменты держат слово: что записали ЧЕРЕЗ ИНСТРУМЕНТ — то и прочли через инструмент.
# Остальные сценарии кладут файлы фикстурой `given.files` прямо на диск, поэтому путь записи в них
# не исполняется вовсе — замена вызова на фикстуру здесь снимает единственное покрытие записи.

- scenario: fs_write_read_roundtrip
  why: молча потерянное содержимое неотличимо от успеха — клиент получил «создано» и пустой файл
  when:
    - call: fs_create_file
      with:
        path: notes/roundtrip.txt
        content: |
          первая строка заметки
          ХВОСТ-МАРКЕР-КОНЦА
      expect:
        ok: true
        facts: [FileCreated]
    - call: fs_read_file
      with: {path: notes/roundtrip.txt}
      expect:
        ok: true
        facts: [FileRead]
        data:
          content.trust: untrusted
          content.provenance: workspace:notes/roundtrip.txt
        data_contains:
          content.value: ХВОСТ-МАРКЕР-КОНЦА

- scenario: fs_written_file_appears_in_tree
  why: запись, которой не видно в обходе каталога, оставляет клиента с неверной картой области
  when:
    - call: fs_create_file
      with: {path: notes/вложенная/глубже.txt, content: abc}
      expect:
        ok: true
        facts: [FileCreated]
    - call: fs_get_directory_tree
      with: {path: notes}
      expect:
        ok: true
        facts: [DirectoryTree]
        data:
          вложенная/: {глубже.txt: {size: 3}}

- scenario: fs_move_and_rename_keep_registry_in_sync
  why: переезд файла, о котором знает диск, но не знает реестр, делает адресацию по ID ложью
  when:
    - call: fs_write_file
      with: {path: notes/переезд.txt, content: содержимое до переезда}
      expect:
        ok: true
        facts: [FileWritten]
    - call: fs_move
      with: {source: notes/переезд.txt, destination: docs/переехал.txt}
      expect:
        ok: true
        facts: [FileMoved]
    - call: fs_read_file
      with: {path: docs/переехал.txt}
      expect:
        ok: true
        data_contains: {content.value: содержимое до переезда}
    - call: fs_rename
      with: {path: docs/переехал.txt, new_name: итог.txt}
      expect:
        ok: true
        facts: [FileRenamed]
    - call: fs_read_file
      with: {path: docs/итог.txt}
      expect:
        ok: true
        data_contains: {content.value: содержимое до переезда}

- scenario: fs_script_skeleton_and_yaml_search
  why: каркас скрипта и YAML-поиск — отдельные пути записи и чтения, мимо обычного создания файла
  when:
    - call: fs_create_python_script
      with: {path: scripts/пример.py, description: разбор витрины}
      expect:
        ok: true
        facts: [FileCreated]
    - call: fs_read_file
      with: {path: scripts/пример.py}
      expect:
        ok: true
        data_contains: {content.value: разбор витрины}
    - call: fs_search_yaml
      with:
        yaml_query: |
          root: scripts
          name_pattern: пример
      expect:
        ok: true
        facts: [FsSearchYaml]

- scenario: fs_refusals_of_creation_paths_are_named
  why: пути создания отказывают своими кодами, а не общим INTERNAL_ERROR — иначе ИИ не знает, что чинить
  when:
    - call: fs_create_python_script
      with: {path: scripts/не-скрипт.txt, description: расширение мимо каркаса}
      expect: {ok: false, code: INVALID_EXTENSION, class: ai_recoverable, console_absent: Traceback}
    - call: fs_create_project_structure
      with: {}
      expect: {ok: false, code: NO_FRAGMENTS, class: ai_recoverable, console_absent: Traceback}
    - call: fs_create_project_structure
      with: {template: нет-такого-шаблона}
      expect: {ok: false, code: TEMPLATE_NOT_FOUND, console_absent: Traceback}
