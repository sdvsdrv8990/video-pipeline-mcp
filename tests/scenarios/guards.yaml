# Сторож судит ДЕРЕВО, и его вердикт приходит кодом возврата. Шаг `run:` даёт объявлению доступ
# к этому вердикту: до него обе стороны сторожа были достижимы только из python-набора, то есть
# кодом. Цель `run` обязана лежать в репозитории, оболочки нет — объявление исполняемо.

- scenario: guard_text_answers_by_exit_code
  why: сторож, отвечающий нулём и когда нашёл, и когда нет, — печать, а не наблюдение
  given:
    files:
      сторож/чисто.py: "\"\"\"чисто.py — проба сторожа текста: ничего не зовёт и никем не зовётся.\"\"\"\nx = 1\n"
      сторож/координата.py: "# F160 закрыт в этой сессии\nx = 1\n"
  when:
    - python: workspace_path
      with: {path: сторож/чисто.py}
      as: clean
      expect: {ok: true}
    - run: scripts/guards/comment_guard.py
      with: {args: ["--scan", "${clean.path}"]}
      expect: {ok: true, exit: 0, console: "Всего замечаний: 0"}
    - python: workspace_path
      with: {path: сторож/координата.py}
      as: dirty
      expect: {ok: true}
    - run: scripts/guards/comment_guard.py
      with: {args: ["--scan", "${dirty.path}"]}
      expect: {ok: false, exit: 1, console: "координата задачи"}

- scenario: guard_gate_commands_answer_zero_on_this_tree
  why: гейт жил только в ci.yml и pre-commit — объявлением он не спрашивался ни разу
  when:
    - run: scripts/guards/invariants.py
      with: {args: ["--check"]}
      expect: {ok: true, exit: 0}
    - run: scripts/guards/findings_count.py
      with: {args: ["--check"]}
      expect: {ok: true, exit: 0, console: "реестр читается машиной"}
    - run: scripts/guards/comment_guard.py
      with: {args: ["--check"]}
      expect: {ok: true, exit: 0, console: "не выше"}

# Переезд сторожей в объявления: до `--root` сторож умел судить только СВОЁ дерево, поэтому обе
# его стороны были достижимы лишь из python-набора. Теперь подставное дерево кладётся фикстурой,
# и вердикт спрашивается тем же способом, каким его спрашивает CI.

- scenario: guard_invariants_judges_a_named_tree
  why: обе стороны сторожа обязаны быть достижимы объявлением, иначе карта до него не дотянется
  given:
    files:
      целое/core/жив.py: "x = 1\n"
      целое/server.py: "from core.жив import x\n"
      разорванное/core/сирота.py: "x = 1\n"
  when:
    - python: workspace_path
      with: {path: целое}
      as: whole
      expect: {ok: true}
    - run: scripts/guards/invariants.py
      with: {args: ["--check", "--root", "${whole.path}"]}
      expect: {ok: true, exit: 0}
    - python: workspace_path
      with: {path: разорванное}
      as: torn
      expect: {ok: true}
    - run: scripts/guards/invariants.py
      with: {args: ["--check", "--root", "${torn.path}"]}
      expect: {ok: false, exit: 1, console: "модуль без единого читателя"}
    - run: scripts/guards/invariants.py
      with: {args: ["--bless", "--root", "${whole.path}"]}
      expect: {ok: false, exit: 2, console: "потолок принадлежит СВОЕМУ дереву"}

- scenario: guard_findings_count_judges_a_named_tree
  why: "храповик без пола обязан ОТКАЗАТЬ, а не зеленеть. Заходит СВОИМ радиусом: пол здесь БЫЛ и
    исчез (`remove_path` — так его сносит человек), а не «не заводился» — причина другая, и путь к
    беде другой, поэтому сценарий не дубль соседнего"
  род: отрицательный
  when:
    - python: снимок_источника
      with: {источник: docs/roadmap/02_findings.md, куда: безполый/docs/roadmap/02_findings.md}
      expect: {ok: true}
    - python: снимок_источника
      with: {источник: scripts/guards/findings_count_baseline.txt,
             куда: безполый/scripts/guards/findings_count_baseline.txt}
      expect: {ok: true}
    - python: remove_path
      with: {path: безполый/scripts/guards/findings_count_baseline.txt}
      expect: {ok: true}
    - python: workspace_path
      with: {path: безполый}
      as: floorless
      expect: {ok: true}
    - run: scripts/guards/findings_count.py
      with: {args: ["--check", "--root", "${floorless.path}"]}
      expect: {ok: false, exit: 2, console: "пола нет"}

# Разрушительный род: состояние не «неверно заполнено», а ВЫРЕЗАНО. Сторож, чей источник улики
# снесли, обязан сказать это вслух: молчание здесь читается как чистота, и снятый источник
# становится закрытым долгом.
- scenario: guard_axes_say_refusal_when_evidence_is_cut
  why: у сторожа вырезаны источники улики — он обязан назвать отказ судить, а не промолчать чистотой
  род: разрушительный
  given:
    files:
      вырезанное/scripts/guards/сторож.py: "x = 1\n"
  when:
    - python: workspace_path
      with: {path: вырезанное}
      as: cut
      expect: {ok: true}
    - run: scripts/guards/invariants.py
      with: {args: ["--check", "--root", "${cut.path}"]}
      expect:
        ok: false
        exit: 1
        console: "сторож без набора-дома: не судится — нет каталога сторожей"
        console_absent: "сторож без набора-дома: чисто"

