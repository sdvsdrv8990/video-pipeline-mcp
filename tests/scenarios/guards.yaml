# Шапка судьи — объявление паспорта, по которому судится роспись.
# Каждый сценарий — ОДНО условие со своей ценой и своим радиусом: живой судья, правка его шапки
# в снимке и вердикт сторожа кодом возврата. Сценарий ждёт ТОЧНЫЙ класс беды, а не любое замечание.

- scenario: header_passport_literal_steps_match_code
