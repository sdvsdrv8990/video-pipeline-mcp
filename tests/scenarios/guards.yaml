  род: положительный
  when:
    - python: снимок_источника
      with: {источник: scripts/guards/findings_count.py, куда: шапки/header_passport_literal_steps_match_code/findings_count.py, правка: как-есть}
      as: draft
      expect: {ok: true}
    - run: scripts/guards/comment_guard.py
      with: {args: ["--scan", "--как", "scripts/guards/findings_count.py", "${draft.path}"]}
      expect: {ok: true, exit: 0, console: "Всего замечаний: 0"}

