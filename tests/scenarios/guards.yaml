# Улика в объявлении стареет молча — это находка владельца 2026-09-14: «улики тут им не место…
# мы только в радиус пишем, и не улику, а набор команд, который через цепочку воспроизводит дыру».
# Поэтому ниже нет ни одной строки источника: сценарий называет ИСТОЧНИК и ПРАВКУ, а содержимое
# всегда снимается живым. Форма изменится — сценарий поедет вместе с ней сам.

- scenario: registry_judge_reads_the_live_registry
  why: "положительный — живой реестр и живой пол: судья обязан сказать «читается машиной», а не молчать"
  род: положительный
  when:
    - python: снимок_источника
      with: {источник: docs/roadmap/02_findings.md, куда: дерево/docs/roadmap/02_findings.md}
      expect: {ok: true}
    - python: снимок_источника
      with: {источник: scripts/guards/findings_count_baseline.txt,
             куда: дерево/scripts/guards/findings_count_baseline.txt}
      expect: {ok: true}
    - python: workspace_path
      with: {path: дерево}
      as: live
      expect: {ok: true}
    - run: scripts/guards/findings_count.py
      with: {args: ["--check", "--root", "${live.path}"]}
      expect: {ok: true, exit: 0, console: "реестр читается машиной"}

