# Сторож судит ДЕРЕВО, и его вердикт приходит кодом возврата. Шаг `run:` даёт объявлению доступ
# к этому вердикту: до него обе стороны сторожа были достижимы только из python-набора, то есть
# кодом. Цель `run` обязана лежать в репозитории, оболочки нет — объявление исполняемо.

- scenario: guard_text_answers_by_exit_code
  why: сторож, отвечающий нулём и когда нашёл, и когда нет, — печать, а не наблюдение
  given:
    files:
      сторож/чисто.py: "\"\"\"чисто.py — проба сторожа текста: ничего не зовёт и никем не зовётся.\"\"\"\nx = 1\n"
      сторож/координата.py: "# F160 закрыт в этой сессии\nx = 1\n"
  when:
    - python: workspace_path
      with: {path: сторож/чисто.py}
      as: clean
      expect: {ok: true}
    - run: scripts/guards/comment_guard.py
      with: {args: ["--scan", "${clean.path}"]}
      expect: {ok: true, exit: 0, console: "Всего замечаний: 0"}
    - python: workspace_path
      with: {path: сторож/координата.py}
      as: dirty
      expect: {ok: true}
    - run: scripts/guards/comment_guard.py
      with: {args: ["--scan", "${dirty.path}"]}
      expect: {ok: false, exit: 1, console: "координата задачи"}

- scenario: guard_gate_commands_answer_zero_on_this_tree
  why: гейт жил только в ci.yml и pre-commit — объявлением он не спрашивался ни разу
  when:
    - run: scripts/guards/invariants.py
      with: {args: ["--check"]}
      expect: {ok: true, exit: 0}
    - run: scripts/guards/findings_count.py
      with: {args: ["--check"]}
      expect: {ok: true, exit: 0, console: "реестр читается машиной"}
    - run: scripts/guards/comment_guard.py
      with: {args: ["--check"]}
      expect: {ok: true, exit: 0, console: "не выше"}

# Переезд сторожей в объявления: до `--root` сторож умел судить только СВОЁ дерево, поэтому обе
# его стороны были достижимы лишь из python-набора. Теперь подставное дерево кладётся фикстурой,
# и вердикт спрашивается тем же способом, каким его спрашивает CI.

- scenario: guard_invariants_judges_a_named_tree
  why: обе стороны сторожа обязаны быть достижимы объявлением, иначе карта до него не дотянется
  given:
    files:
      целое/core/жив.py: "x = 1\n"
      целое/server.py: "from core.жив import x\n"
      разорванное/core/сирота.py: "x = 1\n"
  when:
    - python: workspace_path
      with: {path: целое}
      as: whole
      expect: {ok: true}
    - run: scripts/guards/invariants.py
      with: {args: ["--check", "--root", "${whole.path}"]}
      expect: {ok: true, exit: 0}
    - python: workspace_path
      with: {path: разорванное}
      as: torn
      expect: {ok: true}
    - run: scripts/guards/invariants.py
      with: {args: ["--check", "--root", "${torn.path}"]}
      expect: {ok: false, exit: 1, console: "модуль без единого читателя"}
    - run: scripts/guards/invariants.py
      with: {args: ["--bless", "--root", "${whole.path}"]}
      expect: {ok: false, exit: 2, console: "потолок принадлежит СВОЕМУ дереву"}

- scenario: guard_findings_count_judges_a_named_tree
  why: реестр только растёт, и ужавшийся разбор обязан краснеть — на любом дереве, а не только на своём
  given:
    files:
      реестр/docs/roadmap/02_findings.md: "| F1 | 🔴 | одна |\n| F2 | ✅ | две |\n"
      реестр/scripts/guards/findings_count_baseline.txt: "2\n"
      ужатый/docs/roadmap/02_findings.md: "| F1 | 🔴 | одна |\n"
      ужатый/scripts/guards/findings_count_baseline.txt: "5\n"
      безполый/docs/roadmap/02_findings.md: "| F1 | 🔴 | одна |\n"
  when:
    - python: workspace_path
      with: {path: реестр}
      as: full
      expect: {ok: true}
    - run: scripts/guards/findings_count.py
      with: {args: ["--check", "--root", "${full.path}"]}
      expect: {ok: true, exit: 0, console: "реестр читается машиной"}
    - python: workspace_path
      with: {path: ужатый}
      as: shrunk
      expect: {ok: true}
    - run: scripts/guards/findings_count.py
      with: {args: ["--check", "--root", "${shrunk.path}"]}
      expect: {ok: false, exit: 1, console: "сломался разбор"}
    - python: workspace_path
      with: {path: безполый}
      as: floorless
      expect: {ok: true}
    - run: scripts/guards/findings_count.py
      with: {args: ["--check", "--root", "${floorless.path}"]}
      expect: {ok: false, exit: 2, console: "пола нет"}

# Разрушительный род: состояние не «неверно заполнено», а ВЫРЕЗАНО. Сторож, чей источник улики
# снесли, обязан сказать это вслух: молчание здесь читается как чистота, и снятый источник
# становится закрытым долгом.
- scenario: guard_axes_say_refusal_when_evidence_is_cut
  why: у сторожа вырезаны источники улики — он обязан назвать отказ судить, а не промолчать чистотой
  род: разрушительный
  given:
    files:
      вырезанное/scripts/guards/сторож.py: "x = 1\n"
  when:
    - python: workspace_path
      with: {path: вырезанное}
      as: cut
      expect: {ok: true}
    - run: scripts/guards/invariants.py
      with: {args: ["--check", "--root", "${cut.path}"]}
      expect:
        ok: false
        exit: 1
        console: "сторож без набора-дома: не судится — нет каталога сторожей"
        console_absent: "сторож без набора-дома: чисто"

- scenario: guard_class_map_answers_who_already_stands
  why: до заведения нового судьи вопрос «кандидат уже есть?» обязан отвечаться командой, а не памятью
  when:
    - run: scripts/guards/blast_radius.py
      with: {args: ["--класс", "scripts/guards/CATALOG.md"]}
      expect: {ok: true, exit: 0, console: "кандидат уже есть"}

- scenario: guard_class_map_says_empty_source_aloud
  why: источник, на котором не стоит никто, обязан говорить это словом — молчание читается как «кандидат есть»
  when:
    - run: scripts/guards/blast_radius.py
      with: {args: ["--класс", "config/невиданное-никем.yaml"]}
      expect: {ok: true, exit: 0, console: "не стоит НИКТО"}

- scenario: guard_class_map_refuses_on_cut_sources
  why: источники вырезаны — карта обязана отказаться, а не выдать пустоту за полное покрытие
  род: разрушительный
  given:
    files:
      вырезанное/scripts/guards/сторож.py: "def сломан(:\n"
  when:
    - python: workspace_path
      with: {path: вырезанное}
      as: cut
      expect: {ok: true}
    - run: scripts/guards/blast_radius.py
      with: {args: ["--класс", "--root", "${cut.path}"]}
      expect:
        ok: false
        exit: 1
        console: "разбирать нечего"
        console_absent: "источников в карте"

- scenario: guard_skill_chain_shows_where_instruction_leads
  why: радиус скила обязан считаться по ВСЕЙ цепочке, а не по нему самому — иначе не видно, куда идёт инструкция
  when:
    - run: scripts/guards/blast_radius.py
      with: {args: ["--скил", "code-quality"]}
      expect:
        ok: true
        exit: 0
        console: "радиус цепочки"

- scenario: guard_route_refuses_command_without_declared_outcome
  why: команда, чей код возврата не объявлен, не ветвится и не запускается — угаданный смысл дал бы зелёный маршрут на красной улике
  when:
    - run: scripts/guards/blast_radius.py
      with: {args: ["--набор", "скил:code-quality"]}
      expect:
        ok: true
        exit: 0
        console: "не ветвится и не запускается"

- scenario: guard_chain_table_refuses_without_skills
  why: скилы вырезаны — таблица связей обязана отказаться, а не напечатать пустоту как отсутствие связей
  род: разрушительный
  given:
    files:
      без-скилов/scripts/guards/сторож.py: "def судит():\n    return []\n"
  when:
    - python: workspace_path
      with: {path: без-скилов}
      as: cut
      expect: {ok: true}
    - run: scripts/guards/blast_radius.py
      with: {args: ["--связи", "--root", "${cut.path}"]}
      expect:
        ok: false
        exit: 1
        console: "не из чего"
        console_absent: "рёбер"

- scenario: guard_header_judged_by_composition_not_length
  why: "длина шапки снята как критерий (владелец 2026-09-13) — судится состав: назначение, кого зовёт, кто зовёт"
  when:
    - run: scripts/guards/comment_guard.py
      with: {args: ["--scan", "scripts/guards/_chains.py"]}
      expect:
        ok: true
        exit: 0
        console: "Всего замечаний: 0"
        console_absent: "строк \\(предел"

- scenario: guard_header_without_addressee_is_a_finding
  why: "отрицательный набор — шапка без адресата при живых импортах обязана стать замечанием"
  when:
    - run: scripts/guards/comment_guard.py
      with: {args: ["--scan", "core/advice.py"]}
      expect:
        ok: false
        exit: 1
        console: "не называет НИ ОДНОГО"

- scenario: guard_header_scan_refuses_on_missing_target
  why: "разрушительный — цель замера вырезана: сторож обязан отказать, а не напечатать пустую чистоту"
  when:
    - run: scripts/guards/comment_guard.py
      with: {args: ["--scan", "core/этого-файла-нет.py"]}
      expect:
        ok: false
        exit: 1
        console: "цель не найдена"
        console_absent: "чисто"

- scenario: guard_states_are_bound_to_the_file
  why: "состояние сторожа привязано к файлу, а не к прогону: зелёный обход дерева не судит файл, правленный после него"
  when:
    - run: scripts/guards/patrol.py
      with: {args: ["--состояния", "scripts/guards/patrol.py"]}
      expect:
        ok: true
        exit: 0
        console: "дыра:"

- scenario: guard_states_refuse_on_missing_file
  why: "отрицательный набор — файла нет: состояние спрашивать не у чего, и это отказ, а не пустая таблица"
  when:
    - run: scripts/guards/patrol.py
      with: {args: ["--состояния", "core/этого-нет.py"]}
      expect:
        ok: false
        exit: 1
        console: "файла нет"
        console_absent: "дыра:"

- scenario: guard_file_map_closes_the_chain
  why: "карта вокруг файла смыкает цепочки: кто про него знает, кто его судил и каким событием он рождается"
  when:
    - run: scripts/guards/blast_radius.py
      with: {args: ["--файл", "scripts/guards/comment_guard.py"]}
      expect:
        ok: true
        exit: 0
        console: "событие, которое он рождает"

- scenario: guard_file_map_refuses_on_missing_file
  why: "разрушительный — файла нет: карту строить не из чего, и это отказ, а не пустая таблица связей"
  when:
    - run: scripts/guards/blast_radius.py
      with: {args: ["--файл", "core/этого-нет.py"]}
      expect:
        ok: false
        exit: 1
        console: "карту вокруг него строить не из чего"
        console_absent: "скилы, знающие"
