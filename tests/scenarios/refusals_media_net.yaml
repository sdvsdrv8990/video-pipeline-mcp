# Коды отказа сетевого вызова провайдера: причина рождается ответом двойника сети (`given.network`, приспособление
# `net_double`). Носитель — раннер: токен «живого раннера» засевается в его файл состояния у копии деклараций сервера.
# Каждый сценарий — свой сервер и своя сеть; законная пара — тот же вызов без токена (RUNNER_NOT_RUNNING, refusals_media_rows).
#
# Обновлено 2026-10-19 (media_generate — задание узла, AD-20 б). Что: каждый сценарий объявляет срок вызова клиента
# (transport.yaml clients.claude_code.call_sec 60), ожидания те же. Почему: отказ вызова раннера рождается в работе задания;
# дверь отдаёт итог, если задание кончилось в срок клиента, иначе — статус. Без объявленного срока бюджет установки 0
# (клиент без срока), и исход шага решала гонка потока задания с чтением статуса: прогон 19.10 00:02 — 401, too_large,
# cut_after_send зелёные, 500, read_timeout, not_json, оба токена — статус processing. Ожидания по родам: negative — те же
# коды, факты и net_tasks тем же вызовом; positive — законная пара RUNNER_NOT_RUNNING на двери не тронута; destructive —
# нет; путь «срок вышел — статус задания» мерит test_providers 12c. Прогноз до замера: все 8 сценариев файла зелёные.

- scenario: rcode_net_runner_answer_500
  why: раннер ответил 500 без ErrorDetail — отказ провайдера своим кодом, а не сырой ответ
  род: отрицательный
  given:
    fixtures: [net_double]
    declarations:
      transport.yaml: {clients.claude_code.call_sec: 60}
    network:
      routes: [{host: 127.0.0.1, method: POST, path: /run, replies: [{status: 500, json: {detail: сбой}}]}]
    files:
      сеть/вход.png: не картинка — раннер читает путь, а не байты
      сеть/read.json: |
        {"RESOURCE_LIMITS": {"schema": {}, "rows": {"L1": {"resource_type": "bg_removals",
          "provider": "Local_runner", "fallback_provider": "", "daily_limit": -1, "current_usage": 0,
          "warning_threshold": -1, "model": "rmbg", "response_format": "png", "speed": 1.0, "usage_unit": "call"}}}}
  when:
    - python: seed_runner_token
      with: {token: scenario-runner-token}
      expect: {ok: true}
    - call: media_generate
      with: {table: сеть, resource_type: bg_removals, input: сеть/вход.png, scene_id: s1, video_slug: demo}
      expect: {ok: false, code: PROVIDER_FAILED, net_tasks: 1}

# Обновлено 2026-10-18 (П1 плана текста места, решение 6a по прецеденту D25). Что: 401 провайдера (здесь — раннера)
# теперь PROVIDER_KEY_REJECTED с фактами provider и status, прежде AUTH_FAILED. Почему: AUTH_FAILED — «ключ не совпал с
# ключом сервера» с рецептом перевыпуска НАШЕГО ключа; две причины под одним кодом (EB-11). Ожидания по родам:
# negative — этот сценарий (код провайдера, net_tasks 1, без повтора); positive — rcode_net_runner_answer_500 и
# answer_not_json не тронуты (PROVIDER_FAILED); destructive — нет. Прогноз до замера: этот сценарий красный на старом
# ожидании и зелёный на новом, остальные сценарии файла без изменений.
- scenario: rcode_net_runner_answer_401
  why: раннер не принял токен (401 без ErrorDetail) — отказ ключа у провайдера своим кодом, а не AUTH_FAILED сервера
  род: отрицательный
  given:
    fixtures: [net_double]
    declarations:
      transport.yaml: {clients.claude_code.call_sec: 60}
    network:
      routes: [{host: 127.0.0.1, method: POST, path: /run, replies: [{status: 401, json: {detail: чужой токен}}]}]
    files:
      сеть/вход.png: не картинка — раннер читает путь, а не байты
      сеть/read.json: |
        {"RESOURCE_LIMITS": {"schema": {}, "rows": {"L1": {"resource_type": "bg_removals",
          "provider": "Local_runner", "fallback_provider": "", "daily_limit": -1, "current_usage": 0,
          "warning_threshold": -1, "model": "rmbg", "response_format": "png", "speed": 1.0, "usage_unit": "call"}}}}
  when:
    - python: seed_runner_token
      with: {token: scenario-runner-token}
      expect: {ok: true}
    - call: media_generate
      with: {table: сеть, resource_type: bg_removals, input: сеть/вход.png, scene_id: s1, video_slug: demo}
      expect: {ok: false, code: PROVIDER_KEY_REJECTED, net_tasks: 1}

