- scenario: rcode_net_runner_answer_cut_after_send
  why: ответ на неповторяемый POST оборван после отправки — исход неизвестен, повтора вслепую нет
  род: отрицательный
  given:
    fixtures: [net_double]
    network:
      routes: [{host: 127.0.0.1, method: POST, path: /run, replies: [{status: 200, body: "{\"files\": [1, 2, 3]}", cut_after: 3}]}]
    files:
      сеть/вход.png: не картинка — раннер читает путь, а не байты
