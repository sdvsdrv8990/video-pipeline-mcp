- scenario: rcode_net_runner_token_not_ascii
  why: токен раннера не ASCII — заголовок не отправлен отказом с именем заголовка; запроса нет, значения нет нигде
  род: отрицательный
  given:
    fixtures: [net_double]
    declarations:
      transport.yaml: {clients.claude_code.call_sec: 60}
    network:
      routes: [{host: 127.0.0.1, method: POST, path: /run, replies: [{status: 200, json: {files: []}}]}]
    files:
      сеть/вход.png: не картинка — раннер читает путь, а не байты
      сеть/read.json: |
        {"RESOURCE_LIMITS": {"schema": {}, "rows": {"L1": {"resource_type": "bg_removals",
          "provider": "Local_runner", "fallback_provider": "", "daily_limit": -1, "current_usage": 0,
          "warning_threshold": -1, "model": "rmbg", "response_format": "png", "speed": 1.0, "usage_unit": "call"}}}}
  when:
    - python: seed_runner_token
      with: {token: канарейка-раннера-7f3a}
      expect: {ok: true}
    - call: media_generate
      with: {table: сеть, resource_type: bg_removals, input: сеть/вход.png, scene_id: s1, video_slug: demo}
      expect:
        ok: false
        code: REQUEST_HEADER_INVALID
        net_tasks: 0
        detail: {facts.header: X-Runner-Token, facts.host: 127.0.0.1}
        canary: канарейка-раннера-7f3a

- scenario: rcode_net_runner_token_line_break
  why: токен раннера с переводом строки (попытка вписать свой заголовок) — тот же отказ до сети, а не «мог дойти»
  род: отрицательный
  given:
    fixtures: [net_double]
    declarations:
      transport.yaml: {clients.claude_code.call_sec: 60}
    network:
      routes: [{host: 127.0.0.1, method: POST, path: /run, replies: [{status: 200, json: {files: []}}]}]
    files:
      сеть/вход.png: не картинка — раннер читает путь, а не байты
      сеть/read.json: |
        {"RESOURCE_LIMITS": {"schema": {}, "rows": {"L1": {"resource_type": "bg_removals",
          "provider": "Local_runner", "fallback_provider": "", "daily_limit": -1, "current_usage": 0,
          "warning_threshold": -1, "model": "rmbg", "response_format": "png", "speed": 1.0, "usage_unit": "call"}}}}
  when:
