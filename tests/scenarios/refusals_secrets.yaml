# Коды отказа ключей провайдеров: причина рождается файлом ключей канала (`given.files`) и средой сервера (`given.fixtures`).
# Пара на одних данных — файл ключей, который ключом этого сервера не открыть: без приспособления SECRET_UNREADABLE, в
# интерпретаторе без cryptography — SECRET_ENCRYPTION_UNAVAILABLE. Вызов с ключом отказывает; отчёт о провайдерах — нет,
# он называет причину у одного канала полем.

- scenario: rcode_secret_file_of_another_instance
  why: файл ключей канала зашифрован не ключом этого сервера — вызов с ключом отказывает своим кодом, отчёт называет причину
  род: отрицательный
  given:
    files:
      шифр/read.json: |
        {"RESOURCE_LIMITS": {"schema": {}, "rows": {"L1": {"resource_type": "tts_characters",
          "provider": "ElevenLabs", "fallback_provider": "", "daily_limit": -1, "current_usage": 0,
          "warning_threshold": -1, "model": "eleven_multilingual_v2", "response_format": "mp3", "speed": 1.0,
          "usage_unit": "character"}}}}
      шифр/.secrets/provider_keys.enc: не шифротекст этого сервера
  when:
    - call: media_generate
      with: {table: шифр, resource_type: tts_characters, input: текст, scene_id: s1, video_slug: demo}
      expect: {ok: false, code: SECRET_UNREADABLE}
    - call: media_provider_status
      with: {table: шифр}
      expect: {ok: true, data_contains: {resolved: SECRET_UNREADABLE}}

- scenario: rcode_secret_box_without_cryptography
  why: в интерпретаторе сервера нет cryptography — вызов с ключом отказывает своим кодом, а не трассировкой и не открытым текстом
  род: отрицательный
  given:
    fixtures: [no_crypto]
    files:
      шифр/read.json: |
        {"RESOURCE_LIMITS": {"schema": {}, "rows": {"L1": {"resource_type": "tts_characters",
          "provider": "ElevenLabs", "fallback_provider": "", "daily_limit": -1, "current_usage": 0,
          "warning_threshold": -1, "model": "eleven_multilingual_v2", "response_format": "mp3", "speed": 1.0,
          "usage_unit": "character"}}}}
      шифр/.secrets/provider_keys.enc: не шифротекст этого сервера
  when:
    - call: media_generate
      with: {table: шифр, resource_type: tts_characters, input: текст, scene_id: s1, video_slug: demo}
      expect: {ok: false, code: SECRET_ENCRYPTION_UNAVAILABLE}
    - call: media_provider_status
      with: {table: шифр}
      expect: {ok: true, data_contains: {resolved: SECRET_ENCRYPTION_UNAVAILABLE}}
