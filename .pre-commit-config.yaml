# Pre-commit — линт/типы перед коммитом. Хуки=system, версии совпадают с CI.
# Форматтер НЕ включён намеренно (не переписываем весь код). Установка: pre-commit install
# Путь к линтеру и типам ЯВНЫЙ (`.venv/bin/…`): по имени они находились только из активированного
# окружения, и коммит из обычного терминала падал «Executable ruff not found». Сторожа ниже
# остаются на системном `python` намеренно — им хватает stdlib, как и в CI.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (types)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
      # Храповик считается по репозиторию целиком, поэтому имена файлов не передаём и
      # гоняем всегда: иначе координата, внесённая в нетронутый файл, проедет молча.
      - id: comment-guard
        name: comment_guard (текст в коде)
        entry: python scripts/guards/comment_guard.py --check
        language: system
        pass_filenames: false
        always_run: true
      # Шапка реестра находок обязана сходиться с его же строками: последние находки попадали
      # в таблицы и не попадали в счёт, и расхождение жило до следующей сверки вручную.
      # Межфайловые инварианты: пропуск набора без покрытия в CI, имя до объявления в наборе,
      # код отказа мимо реестра, `enum` без значений (храповик). Ни ruff, ни mypy, ни pytest
      # этого не видят — разрыв живёт МЕЖДУ файлами.
      - id: invariants
        name: invariants (межфайловые инварианты)
        entry: python scripts/guards/invariants.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: findings-count
        name: findings_count (счёт реестра сходится с перечнем)
        entry: python scripts/guards/findings_count.py --check
        language: system
        pass_filenames: false
        always_run: true
