# Pre-commit — линт/типы перед коммитом. Хуки=system, версии совпадают с CI.
# Форматтер НЕ включён намеренно (не переписываем весь код). Установка: pre-commit install
# Путь к линтеру и типам ЯВНЫЙ (`.venv/bin/…`): по имени они находились только из активированного
# окружения, и коммит из обычного терминала падал «Executable ruff not found». Сторожа ниже
# остаются на системном `python` намеренно — им хватает stdlib, как и в CI.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (types)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
      # Сравнение с HEAD: слом виден в момент рождения, а не через сутки в CI.
      # Пакеты перечислены явно — `griffe check` берёт ровно один за прогон.
      # `env -u GIT_INDEX_FILE`: при КОММИТЕ pre-commit подставляет относительный `.git/index`, а
      # griffe работает во временном worktree, где `.git` это файл, — без снятия падает только
      # на настоящем коммите, а `pre-commit run` проходит. Перед прогоном снимается мусор
      # аварийного предыдущего: осиротевшая ветка `griffe-HEAD` блокирует следующий запуск.
      - id: griffe
        name: griffe (слом публичной поверхности)
        entry: env -u GIT_INDEX_FILE bash -c 'git worktree prune; git branch -D griffe-HEAD >/dev/null 2>&1; .venv/bin/griffe check core -s . -a HEAD && .venv/bin/griffe check tools -s . -a HEAD'
        language: system
        types: [python]
        pass_filenames: false

      # Дерево студии судится НАСТОЯЩИМ разбором, а не текстом. Гоняется только на правке
      # `.ts/.tsx`: node-прогон дороже питоновских, и платить им за каждый коммит незачем.
      # Нет `node_modules` — это «не судил», а не «чисто», поэтому отказ, а не пропуск.
      - id: studio-app-typecheck
        name: tsc (разбор дерева студии)
        entry: bash -c 'cd studio && { [ -d node_modules ] || { echo "нет node_modules — сперва npm ci в studio; прогон НЕ состоялся"; exit 1; }; } && npm run --silent typecheck'
        language: system
        files: ^studio/.*\.(ts|tsx)$
        pass_filenames: false

      - id: studio-app-lint
        name: eslint (правило хуков и полнота зависимостей)
        entry: bash -c 'cd studio && { [ -d node_modules ] || { echo "нет node_modules — сперва npm ci в studio; прогон НЕ состоялся"; exit 1; }; } && npm run --silent lint'
        language: system
        files: ^studio/.*\.(ts|tsx)$
        pass_filenames: false

      - id: import-linter
        name: import-linter (этажность и границы групп)
        entry: .venv/bin/lint-imports
        language: system
        types: [python]
        pass_filenames: false
