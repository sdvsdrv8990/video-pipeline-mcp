# Pre-commit — линт/типы перед коммитом. Хуки=system (venv-инструменты),
# версии совпадают с CI. Форматтер НЕ включён намеренно (не переписываем весь код).
# Установка: pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (types)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      # Храповик считается по репозиторию целиком, поэтому имена файлов не передаём и
      # гоняем всегда: иначе координата, внесённая в нетронутый файл, проедет молча.
      - id: comment-guard
        name: comment_guard (текст в коде)
        entry: python scripts/comment_guard.py --check
        language: system
        pass_filenames: false
        always_run: true
