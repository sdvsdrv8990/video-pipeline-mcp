# requirements.lock — точные пины БАЗОВОЙ установки (I2).
# Версии — из окружения, в котором гоняется гейт (`pip freeze` по смыслу, F71: пин, который
# никто не прогонял, не лок, а пожелание). Состав — замыкание манифеста, полученное чистым
# разрешением (`pip install --dry-run --ignore-installed --report -e "."`): голый freeze тащил
# сюда всё, что когда-либо оседало в окружении, — так в лок и попали 25 пакетов CUDA на
# AMD-машине и три зависимости, которые код не импортирует.
# Репро-установка: pip install -r requirements.lock . Источник абстрактных deps — pyproject.toml.
#
# Машинных сборок здесь нет и быть не может: torch переехал в группу `local`, поэтому вопрос
# «CUDA или ROCm» базовой установки больше не касается. Локальный инференс ставится отдельно:
#   pip install -e ".[local]"                                    # CPU
#   pip install -e ".[local,gpu-amd]" --extra-index-url https://download.pytorch.org/whl/rocm7.1
# Второй командой номер версии тот же, а сборка другая — различает их только пин `+rocm7.1`.
