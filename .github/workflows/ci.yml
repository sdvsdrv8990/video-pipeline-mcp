# CI-гейт под фазу фиксов. Хард-гейты: ruff, mypy, тесты (in-process), bandit, pip-audit,
# gitleaks, conformance, comment-guard (храповик текста в коде: вниз можно, вверх нет).
# Тесты — через pytest-раннер: наборы находятся автоматически. Отсечения «живых» больше НЕТ
# харнесс `tests/harness` поднимает сервер сам — свой порт, своя временная рабочая
# область, настоящий ключ, — поэтому периметр проверяется в CI, а не «когда-нибудь руками».
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  test:
    name: test (in-process, script exit-code = gate)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # LibreOffice — движок пересчёта формул (`validate_formulas`). Без него тест скипается.
      - name: install LibreOffice (formula recalc)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      # I7 T0: единый раннер вместо ручного перечисления файлов (забытая строка = тест вне гейта).
      # tests/test_suites.py находит все наборы сам и гоняет каждый подпроцессом (exit-код = вердикт).
      # Маркер `live` больше никого не отсекает — сервер поднимает харнесс.
      - name: tests (pytest gate) + покрытие
        # VPM_COVERAGE=1 → наборы гоняются под `coverage run --parallel-mode` (иначе подпроцессы
        # не считаются и цифра = 0%). Порог — RATCHET от факта (61%): падение ниже = красный гейт.
        # Поднимать порог по мере роста покрытия, не «целевые 80%» с потолка.
        env:
          VPM_COVERAGE: "1"
        run: |
          python -m coverage erase
          python -m pytest
          python -m coverage combine
          python -m coverage report --fail-under=60
          python -m coverage xml
      - name: coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  conformance:
    name: conformance (спека MCP, сторонний клиент)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Сверка с эталонным набором спеки. Набор поднимает сервер сам (харнесс T2) и ходит
      # через прокси, добавляющий ключ, — auth при этом остаётся включённым.
      # VPM_CONFORMANCE_REQUIRED=1: без node набор обязан УПАСТЬ, а не пропуститься — иначе
      # сломавшаяся установка node дала бы зелёную джобу, ничего не проверив.
      - name: conformance (@modelcontextprotocol/conformance)
        env:
          VPM_CONFORMANCE_REQUIRED: "1"
        run: python tests/conformance/test_conformance.py

  security:
    name: security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: bandit (medium+)
        run: bandit -r core server.py -ll
      # Из advisory в ХАРД-ГЕЙТ. Полы в pyproject подняты выше известных CVE —
      # красный здесь означает новую уязвимость, а не старый долг. Исключения только явные,
      # списком `--ignore-vuln` с причиной, а не `continue-on-error` на весь шаг.
      # Без `--strict`: он валится на неаудируемом локальном пакете (`-e .` нет на PyPI),
      # то есть красил бы гейт всегда. Обычный pip-audit = exit 1 только на реальной уязвимости.
      - name: pip-audit (hard gate)
        run: pip-audit

  comment-guard:
    name: comment-guard (мусор ИИ в коде, храповик)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Без установки пакета: сторож на stdlib. Потолок — scripts/comment_guard_baseline.txt,
      # снижается только через --bless, поэтому падение долга видно в diff ревью.
      - name: comment guard (ratchet)
        run: python scripts/comment_guard.py --check

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Официальный action требует GITLEAKS_LICENSE и fail-closed'ится при rate-limit проверки
      # лицензии — гоняем пиннутый бинарь: детерминированно и без внешней зависимости.
      - name: gitleaks (pinned binary, full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
