# I3: CI-гейт под фазу фиксов. Хард-гейты: ruff, mypy, тесты (in-process), bandit, gitleaks.
# Advisory: pip-audit (уязвимости зависимостей — требуют dep-bump с регрессией на живом сервере).
# Тесты — через pytest-раннер (T0): наборы находятся автоматически, `-m "not live"` отсекает те,
# что требуют поднятого сервера/туннеля (вернутся с харнессом T2). Симуляции C2 — in-process, в гейте.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  test:
    name: test (in-process, script exit-code = gate)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # LibreOffice — движок пересчёта формул (F29 validate_formulas). Без него F29-тест скипается.
      - name: install LibreOffice (formula recalc)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      # I7 T0: единый раннер вместо ручного перечисления файлов (F50 — забытая строка = тест вне гейта).
      # tests/test_suites.py находит все наборы сам и гоняет каждый подпроцессом (exit-код = вердикт).
      # `not live` отсекает наборы, которым нужен поднятый сервер/туннель — вернутся с харнессом (T2).
      - name: tests (pytest gate) + покрытие
        # T1: VPM_COVERAGE=1 → наборы гоняются под `coverage run --parallel-mode` (иначе подпроцессы
        # не считаются и цифра = 0%). Порог — RATCHET от факта S18 (61%): падение ниже = красный гейт.
        # Поднимать порог по мере роста покрытия, не «целевые 80%» с потолка.
        env:
          VPM_COVERAGE: "1"
        run: |
          python -m coverage erase
          python -m pytest -m "not live"
          python -m coverage combine
          python -m coverage report --fail-under=60
          python -m coverage xml
      - name: coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: bandit (medium+)
        run: bandit -r core server.py -ll
      # S8/F47: из advisory в ХАРД-ГЕЙТ. Полы в pyproject подняты выше известных CVE —
      # красный здесь означает новую уязвимость, а не старый долг. Исключения только явные,
      # списком `--ignore-vuln` с причиной, а не `continue-on-error` на весь шаг.
      # Без `--strict`: он валится на неаудируемом локальном пакете (`-e .` нет на PyPI),
      # то есть красил бы гейт всегда. Обычный pip-audit = exit 1 только на реальной уязвимости.
      - name: pip-audit (hard gate)
        run: pip-audit

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Официальный action требует GITLEAKS_LICENSE и fail-closed'ится при rate-limit проверки
      # лицензии (F48) — гоняем пиннутый бинарь: детерминированно и без внешней зависимости.
      - name: gitleaks (pinned binary, full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
