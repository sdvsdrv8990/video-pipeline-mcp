# CI-гейт под фазу фиксов. Хард-гейты: ruff, mypy, тесты (in-process), bandit, pip-audit,
# gitleaks, conformance, comment-guard (храповик текста в коде: вниз можно, вверх нет).
# Тесты — через pytest-раннер: наборы находятся автоматически. Отсечения «живых» больше НЕТ
# харнесс `tests/harness` поднимает сервер сам — свой порт, своя временная рабочая
# область, настоящий ключ, — поэтому периметр проверяется в CI, а не «когда-нибудь руками».
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2      # griffe сравнивает поверхность с HEAD~1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: import-linter (архитектурные контракты)
        run: lint-imports
      - name: griffe (слом публичной поверхности)
        run: |
          git rev-parse HEAD~1 >/dev/null 2>&1 || { echo "нет предыдущей ревизии — сравнить не с чем"; exit 1; }
          griffe check core -s . -a HEAD~1 -b HEAD
          griffe check tools -s . -a HEAD~1 -b HEAD

  studio:
    name: studio (tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/studio_emulation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/studio_emulation/package-lock.json
      - run: npm ci
      - name: tsc (настоящий разбор .tsx вместо текстового)
        run: npm run typecheck
      - name: eslint (правило хуков и полнота зависимостей)
        run: npm run lint
      - name: браузер (chromium для прогона геометрии)
        run: npx playwright install --with-deps chromium
      - name: геометрия (наложение, выход текста, уход из окна)
        run: npm run geometry

  test:
    name: test (in-process, script exit-code = gate)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # LibreOffice — движок пересчёта формул (`validate_formulas`). Без него тест скипается.
      # ffmpeg — САМ ПРОДУКТ оси P, а не вспомогательный инструмент: без бинаря наборы монтажа
      # пропускают прогонную половину с причиной, и гейт зеленеет, ничего не собрав. Замер на
      # 2026-08-23: с бинарём 166 проверок в трёх наборах, без него 60 — то есть 106 (64%) в CI
      # не исполнялись вовсе, включая рендер, приёмку ffprobe, дорожки слотов и совместимость.
      # Это пакет менеджера пакетов, а не гигабайты весов модели, — ставится за секунды.
      - name: install LibreOffice (formula recalc) + ffmpeg (montage)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc ffmpeg
      # I7 T0: единый раннер вместо ручного перечисления файлов (забытая строка = тест вне гейта).
      # tests/test_suites.py находит все наборы сам и гоняет каждый подпроцессом (exit-код = вердикт).
      # Маркер `live` больше никого не отсекает — сервер поднимает харнесс.
      - name: tests (pytest gate) + покрытие
        # VPM_COVERAGE=1 → наборы гоняются под `coverage run --parallel-mode` (иначе подпроцессы
        # не считаются и цифра = 0%). Порог — RATCHET от факта (61%): падение ниже = красный гейт.
        # Поднимать порог по мере роста покрытия, не «целевые 80%» с потолка.
        env:
          VPM_COVERAGE: "1"
          # Пропуск наборов монтажа в CI ЗАПРЕЩЁН: бинарь ставится шагом выше, и если его вдруг
          # нет — значит установка сломалась, а зелёная джоба означала бы «не проверяли».
          # Тот же приём, что у conformance с node (VPM_CONFORMANCE_REQUIRED).
          VPM_FFMPEG_REQUIRED: "1"
        run: |
          python -m coverage erase
          python -m pytest
          python -m coverage combine
          python -m coverage report --fail-under=60
          python -m coverage xml
      - name: coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  conformance:
    name: conformance (спека MCP, сторонний клиент)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Сверка с эталонным набором спеки. Набор поднимает сервер сам (харнесс T2) и ходит
      # через прокси, добавляющий ключ, — auth при этом остаётся включённым.
      # VPM_CONFORMANCE_REQUIRED=1: без node набор обязан УПАСТЬ, а не пропуститься — иначе
      # сломавшаяся установка node дала бы зелёную джобу, ничего не проверив.
      - name: conformance (@modelcontextprotocol/conformance)
        env:
          VPM_CONFORMANCE_REQUIRED: "1"
        run: python tests/conformance/test_conformance.py

  security:
    name: security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: bandit (medium+)
        run: bandit -r core server.py -ll
      # Из advisory в ХАРД-ГЕЙТ. Полы в pyproject подняты выше известных CVE —
      # красный здесь означает новую уязвимость, а не старый долг. Исключения только явные,
      # списком `--ignore-vuln` с причиной, а не `continue-on-error` на весь шаг.
      # Без `--strict`: он валится на неаудируемом локальном пакете (`-e .` нет на PyPI),
      # то есть красил бы гейт всегда. Обычный pip-audit = exit 1 только на реальной уязвимости.
      - name: pip-audit (hard gate)
        run: pip-audit

  comment-guard:
    name: comment-guard (мусор ИИ в коде, храповик)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Без установки пакета: сторож на stdlib. Потолок — scripts/guards/comment_guard_baseline.txt,
      # снижается только через --bless, поэтому падение долга видно в diff ревью.
      - name: comment guard (ratchet)
        run: python scripts/guards/comment_guard.py --check
      # Инварианты МЕЖДУ файлами: пропуск набора без установки бинаря в CI, имя до объявления в
      # линейном наборе, код отказа мимо реестра реакций, `enum` без значений. Ни один из них не
      # виден ни линтеру, ни типам, ни прогону: разрыв живёт между двумя файлами.
      - name: invariants (межфайловые)
        run: python scripts/guards/invariants.py --check

      # Реестр находок обязан РАЗБИРАТЬСЯ: сломанный формат обнуляет и счёт, и статус-инвариант,
      # причём обе проверки при этом молча зеленеют. Числа в прозе не живут — их печатает замер.
      - name: findings registry readable
        run: python scripts/guards/findings_count.py --check

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Официальный action требует GITLEAKS_LICENSE и fail-closed'ится при rate-limit проверки
      # лицензии — гоняем пиннутый бинарь: детерминированно и без внешней зависимости.
      - name: gitleaks (pinned binary, full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
