# CI-гейт под фазу фиксов. Хард-гейты: ruff, mypy, тесты (in-process), bandit, pip-audit,
# gitleaks, conformance.
# Тесты — через pytest-раннер: наборы находятся автоматически. Отсечения «живых» больше НЕТ
# харнесс `tests/harness` поднимает сервер сам — свой порт, своя временная рабочая
# область, настоящий ключ, — поэтому периметр проверяется в CI, а не «когда-нибудь руками».
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Режим UTF-8 Python (PEP 540; по умолчанию с 3.15 — PEP 686): консоль windows-latest в cp1252, и сторонние
# инструменты (import-linter печатает имена наших контрактов) падали UnicodeEncodeError на кириллице.
env:
  PYTHONUTF8: "1"

# Версии зависимостей — по замку requirements-lock.txt (слово владельца 17.10, D22): CI и локальные гейты меряют один
# набор, а не то, что каждая ячейка разрешила сама. Пересборка — команда в шапке замка; мажоры двигает dependabot PR.

jobs:
  lint:
    name: lint (ruff + mypy) · ${{ matrix.os }} · ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Матрица = объявленные платформы pyproject (PT-01); красный одной ОС не снимает остальные.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2      # griffe сравнивает поверхность с HEAD~1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -c requirements-lock.txt -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: import-linter (архитектурные контракты)
        run: lint-imports
      # Сверка с объявленными сломами коммита (трейлер API-Break): исход — событие с перечнем или понятный отказ.
      - name: griffe (слом публичной поверхности)
        run: python scripts/guards/api_breaks.py core tools --base HEAD~1 --head HEAD

  studio-app:
    name: studio-app (возраст версий + tsc + eslint + сборка)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # гейт возраста сравнивает замок с базой правки — она должна быть в истории
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      # Ручной подъём версии идёт мимо cooldown Dependabot: новые записи замка сверяются со сроком pyproject
      # [tool.uv.pip] exclude-newer по времени публикации у реестра. База — через env, а не подстановкой в shell.
      - name: возраст версий замка студии
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ../scripts/release_age.py "$BASE"
      - name: tsc (настоящий разбор .tsx вместо текстового)
        run: npm run typecheck
      - name: eslint (правило хуков и полнота зависимостей)
        run: npm run lint
      - name: сборка (токен из @theme обязан доехать до CSS)
        run: npm run build

  test:
    name: test (in-process, script exit-code = gate) · ${{ matrix.os }} · ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu закреплена версией: переезд образа (ubuntu-latest → 26.04) — разница двух ячеек, а не внезапный красный.
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -c requirements-lock.txt -e ".[dev]"
      # LibreOffice — движок пересчёта формул (`validate_formulas`). Без него тест скипается.
      # ffmpeg — САМ ПРОДУКТ оси P, а не вспомогательный инструмент: без бинаря наборы монтажа
      # пропускают прогонную половину с причиной, и гейт зеленеет, ничего не собрав. Замер на
      # 2026-08-23: с бинарём 166 проверок в трёх наборах, без него 60 — то есть 106 (64%) в CI
      # не исполнялись вовсе, включая рендер, приёмку ffprobe, дорожки слотов и совместимость.
      # Это пакет менеджера пакетов, а не гигабайты весов модели, — ставится за секунды.
      - name: install LibreOffice (formula recalc) + ffmpeg (montage) · Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc ffmpeg
      - name: install LibreOffice (formula recalc) + ffmpeg (montage) · macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg && brew install --cask libreoffice
      - name: install LibreOffice (formula recalc) + ffmpeg (montage) · Windows
        if: runner.os == 'Windows'
        # Установщик LibreOffice кладёт soffice в Program Files без PATH — сервер находит его по config/engines.yaml, PATH не
        # трогаем: так CI мерит поиск сервера. Нет файла на объявленном месте — шаг красный, а не тихий пропуск пересчёта.
        run: |
          choco install -y --no-progress ffmpeg libreoffice-fresh
          test -f "$PROGRAMFILES/LibreOffice/program/soffice.exe"
      # I7 T0: единый раннер вместо ручного перечисления файлов (забытая строка = тест вне гейта).
      # tests/test_suites.py находит все наборы сам и гоняет каждый подпроцессом (exit-код = вердикт).
      # Маркер `live` больше никого не отсекает — сервер поднимает харнесс.
      - name: tests (pytest gate) + покрытие
        # VPM_COVERAGE=1 → наборы гоняются под `coverage run --parallel-mode` (иначе подпроцессы
        # не считаются и цифра = 0%). Порог — RATCHET от факта (61%): падение ниже = красный гейт.
        # Поднимать порог по мере роста покрытия, не «целевые 80%» с потолка.
        env:
          VPM_COVERAGE: "1"
          # Пропуск наборов монтажа в CI ЗАПРЕЩЁН: бинарь ставится шагом выше, и если его вдруг
          # нет — значит установка сломалась, а зелёная джоба означала бы «не проверяли».
          # Тот же приём, что у conformance с node (VPM_CONFORMANCE_REQUIRED).
          VPM_FFMPEG_REQUIRED: "1"
          # ВМ CI одноразовая — случай калитки суперпользователя: раннер Windows, если он администратор с повышением, без
          # неё не поднял бы ни одного живого сервера. Отказ без калитки меряет раздел 11 test_firewall.
          MCP_ALLOW_ROOT: ${{ runner.os == 'Windows' && '1' || '' }}
        run: |
          python -m coverage erase
          python -m pytest
          python -m coverage combine
          python -m coverage report --fail-under=60
          python -m coverage xml
      - name: coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # Машина владельца: Fedora 44, системный Python 3.14, ffmpeg полный из RPM Fusion (не ffmpeg-free), LibreOffice.
  test-fedora:
    name: test (in-process, script exit-code = gate) · fedora-44 · 3.14
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44  # реестр Fedora: тот же образ, что у локальной пробы чистой машины
    steps:
      - name: system packages (git, python, ffmpeg из RPM Fusion, LibreOffice)
        run: |
          dnf install -y --setopt=install_weak_deps=False git python3 python3-pip libreoffice-calc \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
          dnf install -y --allowerasing ffmpeg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Наборы — не от root: root обходит права доступа, и проверки закрытых каталогов дали бы ложное.
      - name: tests (pytest gate) от обычного пользователя
        env:
          VPM_FFMPEG_REQUIRED: "1"
        run: |
          useradd -m runner && chown -R runner:runner "$GITHUB_WORKSPACE"
          su runner -c "cd '$GITHUB_WORKSPACE' && python3 -m venv .venv-ci && .venv-ci/bin/pip install -q -c requirements-lock.txt -e '.[dev]' && VPM_FFMPEG_REQUIRED=1 .venv-ci/bin/python -m pytest"

  conformance:
    name: conformance (спека MCP, сторонний клиент) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -c requirements-lock.txt -e ".[dev]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      # Сверка с эталонным набором спеки. Набор поднимает сервер сам (харнесс T2) и ходит
      # через прокси, добавляющий ключ, — auth при этом остаётся включённым.
      # VPM_CONFORMANCE_REQUIRED=1: без node набор обязан УПАСТЬ, а не пропуститься — иначе
      # сломавшаяся установка node дала бы зелёную джобу, ничего не проверив.
      - name: conformance (@modelcontextprotocol/conformance)
        env:
          VPM_CONFORMANCE_REQUIRED: "1"
          MCP_ALLOW_ROOT: ${{ runner.os == 'Windows' && '1' || '' }}   # та же калитка, что у наборов: ВМ CI одноразовая
        # Через гейт наборов: среда набора (UTF-8 Mode и прочее) решается одним местом — suite_env (tests/test_suites.py).
        run: python -m pytest tests/test_suites.py -k conformance

  security:
    name: security (bandit + pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -c requirements-lock.txt -e ".[dev]"
      - name: bandit (medium+)
        run: bandit -r core server.py -ll
      # Из advisory в ХАРД-ГЕЙТ. Полы в pyproject подняты выше известных CVE —
      # красный здесь означает новую уязвимость, а не старый долг. Исключения только явные,
      # списком `--ignore-vuln` с причиной, а не `continue-on-error` на весь шаг.
      # Без `--strict`: он валится на неаудируемом локальном пакете (`-e .` нет на PyPI),
      # то есть красил бы гейт всегда. Обычный pip-audit = exit 1 только на реальной уязвимости.
      - name: pip-audit (hard gate)
        run: pip-audit

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # Официальный action требует GITLEAKS_LICENSE и fail-closed'ится при rate-limit проверки
      # лицензии — гоняем пиннутый бинарь: детерминированно и без внешней зависимости.
      - name: gitleaks (pinned binary, full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
